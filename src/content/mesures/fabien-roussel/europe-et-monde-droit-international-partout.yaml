titre: "Application du droit international pour l'Ukraine et la Palestine"
texte_source: >-
  Par exemple, le droit international doit être appliqué pour l’Ukraine et pour la Palestine. Cela passe par une condamnation des violations du droit international d’où qu’elles viennent (que ce soit du régime russe ou du gouvernement israélien) et par l’application des sanctions contre les régimes et les gouvernements tant que le droit international n’est pas respecté.
source: fabien-roussel-cahier-paix-defense
source_localisation: "page 38, partie 3 Porter l'exigence d'une politique de paix, point II Faire respecter le droit international"
redactions:
  resume: >-
    Dans un cahier du Parti communiste français, le droit international doit s'appliquer pour l'Ukraine et la Palestine, avec condamnation des violations et sanctions.
  detaille: >-
    Dans le cahier Paix et défense nationale du Parti communiste français, dont Fabien Roussel est le candidat, le point sur le respect du droit international écrit : « le droit international doit être appliqué pour l’Ukraine et pour la Palestine ». Le texte précise que cela passe par une condamnation des violations d'où qu'elles viennent, citant le régime russe et le gouvernement israélien, et par l'application de sanctions tant que le droit international n'est pas respecté. Le passage ne dit pas quelles sanctions seraient décidées ni par qui. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Fabien Roussel veut que le [[droit international]] s'applique partout. Le texte cite l'Ukraine et la Palestine. Il demande de condamner chaque violation, d'où qu'elle vienne. Il demande aussi des sanctions tant que le droit n'est pas respecté. Le texte ne dit pas quelles sanctions.
  aine: >-
    Dans le cahier Paix et défense nationale du Parti communiste français, dont Fabien Roussel est le candidat, le droit international doit être appliqué pour l'Ukraine et pour la Palestine. Le texte demande de condamner les violations du droit international d'où qu'elles viennent, en citant le régime russe et le gouvernement israélien, et d'appliquer des sanctions tant que ce droit n'est pas respecté. Il ne précise pas quelles seraient ces sanctions ni qui les déciderait.
