candidat: fabien-roussel
theme: europe-et-monde
sous_theme: diplomatie-et-multilateralisme
titre: "Politique de paix indépendante des États-Unis et de l'OTAN"
texte_source: >-
  La France a les moyens de mener une politique de paix en toute indépendance des ÉtatsUnis et de l’OTAN et de sortir d’une logique de blocs en tendant la main aux aspirations des peuples, notamment dans le « sud global », pour un nouvel ordre du monde fondé sur le multilatéralisme et le respect des choix souverains des peuples.
source: fabien-roussel-cahier-paix-defense
source_localisation: "page 37, partie 3 Porter l'exigence d'une politique de paix, point I Refonder la politique de la France"
redactions:
  resume: >-
    Dans un cahier du Parti communiste français, la France mènerait une politique de paix indépendante des États-Unis et de l'OTAN.
  detaille: >-
    Dans le cahier Paix et défense nationale du Parti communiste français, dont Fabien Roussel est le candidat, la partie consacrée à la politique de paix indique : « La France a les moyens de mener une politique de paix en toute indépendance des ÉtatsUnis et de l’OTAN et de sortir d’une logique de blocs ». Le texte ajoute qu'elle peut le faire en tendant la main aux aspirations des peuples, notamment dans le « sud global », pour un nouvel ordre du monde fondé sur le multilatéralisme et le respect des choix souverains des peuples. Le passage ne précise ni les décisions concrètes, ni le calendrier. Il ne donne aucun coût.
  enfant: >-
    Fabien Roussel veut une France qui mène sa propre politique de paix. Elle serait indépendante des États-Unis et de l'[[OTAN|otan]]. Elle sortirait de la logique de blocs. Elle tendrait la main aux peuples, notamment du [[Sud global|sud-global]]. Le texte ne dit pas comment.
  aine: >-
    Dans le cahier Paix et défense nationale du Parti communiste français, dont Fabien Roussel est le candidat, il est écrit que la France a les moyens de mener une politique de paix en toute indépendance des États-Unis et de l'OTAN. Elle sortirait d'une logique de blocs et tendrait la main aux aspirations des peuples, notamment du Sud global, pour un nouvel ordre du monde fondé sur le multilatéralisme. Le texte ne précise pas les décisions concrètes.
