titre: "Sécurité d'emploi, de formation et du revenu"
texte_source: >-
  Pour cela nous proposons un système de Sécurité d’emploi, de formation, du revenu, tout au long de la vie professionnelle. Un nouveau système public et social articulerait sécurisation et mobilité choisie des salariés, à partir du développement de la formation. Il s’agirait d’une mobilité entre emploi – formation rémunérée – nouvel emploi, sans perte de revenu, où les travailleur·euses ne passeraient plus par la case chômage et précarité.
source: fabien-roussel-cahier-securite-sociale
source_localisation: "chapitre 9 La question du financement au cœur du projet communiste de protection sociale du XXIe siècle, proposition n° 5, page 40 du cahier"
redactions:
  resume: >-
    Le cahier du parti de Fabien Roussel propose une Sécurité d'emploi, de formation et du revenu, sans perte de revenu en changeant d'emploi.
  detaille: >-
    Dans le cahier Sécurité sociale du Parti communiste français, parti de Fabien Roussel, le texte propose un système de Sécurité d'emploi, de formation et du revenu, tout au long de la vie professionnelle. Ce système public et social articulerait sécurisation et mobilité choisie des salariés, à partir du développement de la formation. Il s'agirait d'une mobilité entre emploi, formation rémunérée et nouvel emploi, sans perte de revenu, où les travailleurs ne passeraient plus par la case chômage et précarité. Le texte cité ne précise ni le coût de ce système, ni qui le gérerait, ni la date de sa mise en place.
  enfant: >-
    Le cahier du parti de Fabien Roussel propose un système public. Il suivrait chacun tout au long de sa vie de travail. Il garantirait un emploi ou une formation payée. On pourrait changer d'emploi sans perdre son revenu. On ne passerait plus par le chômage. Le texte ne dit pas le coût.
  aine: >-
    Dans le cahier Sécurité sociale du Parti communiste français, parti de Fabien Roussel, le texte propose un système de Sécurité d'emploi, de formation et du revenu, tout au long de la vie professionnelle. Ce système public et social permettrait aux salariés de passer d'un emploi à une formation rémunérée, puis à un nouvel emploi, sans perte de revenu, et sans passer par la case chômage et précarité. Le texte cité ne précise ni le coût, ni les modalités de gestion, ni le calendrier.
statut_relecture: brouillon
