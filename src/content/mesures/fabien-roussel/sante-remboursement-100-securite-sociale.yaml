version_schema: 1
id: fabien-roussel/sante-remboursement-100-securite-sociale
candidat: fabien-roussel
theme: sante
sous_theme: assurance-maladie
titre: "Remboursement à 100 % des soins prescrits par la Sécurité sociale"
texte_source: >-
  Il est temps de mettre fin à la dualité du remboursement des soins, non solidaire, source d’inégalités sociales, générateur de complexité, de dépenses supplémentaires, et d’aller vers le remboursement à 100% par la Sécurité Sociale des soins prescrits.
source: fabien-roussel-cahier-securite-sociale
source_localisation: "chapitre 4 Quelles ambitions pour l'assurance-maladie ?, page 15 du cahier"
redactions:
  resume: >-
    Le cahier du parti de Fabien Roussel veut aller vers le remboursement à 100 % des soins prescrits par la Sécurité sociale.
  detaille: >-
    Dans le cahier Sécurité sociale du Parti communiste français, parti de Fabien Roussel, un chapitre sur l'assurance maladie juge qu'il est temps de mettre fin à la dualité du remboursement des soins. Le texte la décrit comme non solidaire, source d'inégalités sociales, de complexité et de dépenses supplémentaires. Il propose d'aller vers le remboursement à 100 % des soins prescrits par la Sécurité sociale. Le texte cité ne dit pas à quelle date, ni quels soins seraient concernés, ni combien cela coûterait.
  enfant: >-
    Le cahier du parti de Fabien Roussel veut changer le remboursement des soins. Il critique le système actuel de remboursement. Selon lui, il crée des inégalités. Il veut un remboursement à 100 % par la [[Sécurité sociale|securite-sociale]]. Il parle des soins prescrits. Le texte ne donne pas de date.
  aine: >-
    Dans le cahier Sécurité sociale du Parti communiste français, parti de Fabien Roussel, un chapitre consacré à l'assurance maladie propose de mettre fin à la dualité du remboursement des soins, décrite comme non solidaire, source d'inégalités sociales, de complexité et de dépenses supplémentaires, et d'aller vers un remboursement à 100 % des soins prescrits par la Sécurité sociale. Le passage cité ne précise ni le calendrier, ni la liste des soins concernés, ni le coût de cette réforme.
statut_relecture: brouillon
