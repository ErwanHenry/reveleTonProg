id: fabien-roussel/travail-cotisations-patronales-modulees
candidat: fabien-roussel
theme: travail
sous_theme: fiscalite-et-financement
titre: "Cotisations patronales modulées selon les politiques d'emploi et de salaire"
texte_source: >-
  Aussi, nous proposons de moduler les taux des cotisations sociales en visant à encourager le développement de gestions vertueuses des entreprises émancipées de la domination de la finance et porteuses d’emplois et de salaires. Les taux de cotisations seraient modulés en fonction des politiques d’emploi et de salaire des entreprises, afin de peser sur leurs choix de gestion.
source: fabien-roussel-cahier-securite-sociale
source_localisation: "chapitre 9 La question du financement au cœur du projet communiste de protection sociale du XXIe siècle, proposition n° 4, page 40 du cahier"
redactions:
  resume: >-
    Le cahier du parti de Fabien Roussel propose de moduler les taux de cotisations selon les politiques d'emploi et de salaire des entreprises.
  detaille: >-
    Dans le cahier Sécurité sociale du Parti communiste français, parti de Fabien Roussel, le texte propose de moduler les taux des cotisations sociales, en visant à encourager le développement de gestions vertueuses des entreprises émancipées de la domination de la finance et porteuses d'emplois et de salaires. Selon le texte, les taux de cotisations seraient modulés en fonction des politiques d'emploi et de salaire des entreprises, afin de peser sur leurs choix de gestion. Le texte cité ne donne pas ici les taux, ni la date d'application.
  enfant: >-
    Le cahier du parti de Fabien Roussel veut changer le montant des [[cotisations|cotisation]] des entreprises. Il dépendrait de leur politique d'emploi et de salaire. Le but est d'encourager les entreprises qui créent des emplois et des salaires. Le texte cité ne donne pas les taux.
  aine: >-
    Dans le cahier Sécurité sociale du Parti communiste français, parti de Fabien Roussel, le texte propose de moduler les taux des cotisations sociales selon les politiques d'emploi et de salaire des entreprises, afin de peser sur leurs choix de gestion. Il vise à encourager des entreprises qu'il juge émancipées de la domination de la finance et porteuses d'emplois et de salaires. Le texte cité ne précise pas les taux, ni la date d'application.
