titre: "Expropriation des secteurs stratégiques, dont la santé, sous contrôle des travailleurs"
texte_source: >-
  Expropriation des secteurs stratégiques (énergie, transports, banques, santé, …) et placement sous contrôle des travailleur·ses.
source: anasse-kazib-programme
source_localisation: "page Programme, axe 2 Confisquer le pouvoir aux patrons, rubrique Ce que nous voulons "
redactions:
  resume: >-
    Anasse Kazib propose l'expropriation des secteurs stratégiques, dont la santé, et leur placement sous le contrôle des travailleurs et travailleuses.
  detaille: >-
    Sur le site de sa campagne, Anasse Kazib propose l'expropriation des secteurs stratégiques. Il cite entre parenthèses l'énergie, les transports, les banques et la santé, suivis de points de suspension : la liste n'est donc pas close. Ces secteurs seraient placés sous le contrôle des travailleurs et des travailleuses. Le texte ne précise pas ce que recouvre la santé dans cette liste, ni si les propriétaires seraient indemnisés, ni comment le contrôle des travailleurs serait organisé. Le programme ne donne pas de calendrier.
  enfant: >-
    Anasse Kazib propose l'[[expropriation]] des secteurs clés du pays. Il cite l'énergie, les transports, les banques et la santé. Les travailleurs auraient le contrôle de ces secteurs. Le texte ne dit pas ce que deviendraient les propriétaires. Il ne dit pas comment ce contrôle se ferait.
  aine: >-
    Sur le site de sa campagne, Anasse Kazib propose l'expropriation des secteurs stratégiques, c'est-à-dire le retrait de leur propriété à leurs détenteurs actuels. Il cite l'énergie, les transports, les banques et la santé, la liste restant ouverte. Ces secteurs seraient placés sous le contrôle des travailleurs et des travailleuses. Le texte ne précise pas quelles activités de santé seraient concernées, ni si une indemnisation serait prévue.
statut_relecture: brouillon
