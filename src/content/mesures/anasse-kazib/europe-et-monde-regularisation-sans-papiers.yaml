titre: "Régularisation des sans-papiers et liberté de circulation et d'installation"
texte_source: >-
  Régularisation de tous les sans-papiers, liberté de circulation et d'installation.
source: anasse-kazib-programme
source_localisation: "page Programme, axe 3 Unifier la nouvelle classe ouvrière, rubrique Ce que nous voulons"
redactions:
  resume: >-
    Anasse Kazib veut la régularisation de tous les sans-papiers, ainsi que la liberté de circulation et d'installation.
  detaille: >-
    Sur la page Programme de son site de campagne, dans l'axe Unifier la nouvelle classe ouvrière, Anasse Kazib inscrit, sous la rubrique Ce que nous voulons : « Régularisation de tous les sans-papiers, liberté de circulation et d'installation ». Le texte cité demande à la fois de régulariser tous les sans-papiers et de permettre la liberté de circulation et d'installation. Il ne dit pas par quelle loi ni selon quelles conditions, ni à partir de quelle date. Il ne précise pas pour qui s'appliquerait la liberté d'installation. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Anasse Kazib veut des papiers en règle pour tous les [[sans-papiers]]. Il veut aussi la liberté de circuler et de s'installer. Le texte ne dit pas pour qui. Il ne dit pas comment cela serait fait. Il ne dit pas quand.
  aine: >-
    Sur la page Programme de son site de campagne, Anasse Kazib demande la régularisation de tous les sans-papiers, ainsi que la liberté de circulation et d'installation. Le texte cité ne précise ni la loi qui serait utilisée, ni les conditions, ni la date. Il ne dit pas non plus pour quelles personnes la liberté de circulation et d'installation s'appliquerait. Il ne donne aucun chiffre ni aucun coût.
statut_relecture: brouillon
