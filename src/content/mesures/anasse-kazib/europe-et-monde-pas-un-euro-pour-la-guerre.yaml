titre: "Refus de financer la guerre et démantèlement de la machine de guerre française"
texte_source: >-
  Pas un euro pour la guerre, démantèlement de la machine de guerre française, 2ème exportateur d'armes mondial.
source: anasse-kazib-programme
source_localisation: "page Programme, axe 5 Contre la militarisation et l'impérialisme, rubrique Ce que nous voulons, premier point"
redactions:
  resume: >-
    Anasse Kazib veut qu'il n'y ait pas un euro pour la guerre et le démantèlement de la machine de guerre française.
  detaille: >-
    Sur la page Programme de son site de campagne, dans l'axe Contre la militarisation et l'impérialisme, Anasse Kazib inscrit, sous la rubrique Ce que nous voulons : « Pas un euro pour la guerre, démantèlement de la machine de guerre française, 2ème exportateur d'armes mondial ». Le texte cité demande donc de ne consacrer aucun argent à la guerre et de démanteler la machine de guerre française. La mention « 2ème exportateur d'armes mondial » est donnée dans le texte à la suite de ces mots, sans phrase d'explication. Le texte ne dit pas comment ce démantèlement serait mené, ni à quelle date, ni pour quel coût.
  enfant: >-
    Anasse Kazib veut qu'il n'y ait « pas un euro pour la guerre ». Il veut aussi démonter la machine de guerre de la France. Le texte ne dit pas comment il faudrait faire. Il ne dit pas non plus quand.
  aine: >-
    Sur la page Programme de son site de campagne, Anasse Kazib demande qu'il n'y ait pas un euro pour la guerre et le démantèlement de la machine de guerre française. Le texte cité ajoute une mention sur le rang de la France pour les exportations d'armes, sans expliquer le lien avec la demande. Il ne précise ni la façon de démanteler cette machine de guerre, ni la date, ni le coût. Il ne donne ni budget ni échéance.
statut_relecture: brouillon
