redactions:
  resume: >-
    Anasse Kazib propose une répartition du travail pour une semaine de 28h sans baisse de salaire.
  detaille: >-
    Dans les propositions de campagne d'Anasse Kazib, la répartition du travail pour une semaine de 28h sans baisse de salaire figure dans une liste de mesures de son programme. Le texte la mentionne en une seule ligne. Il faut comprendre que le travail serait partagé entre plus de personnes, ce que le mot répartition indique, sans que le texte détaille ce partage. Le programme ne précise pas si la semaine de 28h s'appliquerait à toutes les entreprises, ni comment les salaires seraient maintenus, ni à partir de quelle date.
  enfant: >-
    Anasse Kazib veut une semaine de travail de 28h. Le travail serait réparti entre les personnes. Les salaires ne baisseraient pas. Le texte tient en une seule ligne. Il ne dit pas comment on s'y prendrait. Il ne dit pas non plus quand cela commencerait.
  aine: >-
    Anasse Kazib propose, dans son programme de campagne, une répartition du travail pour une semaine de 28h sans baisse de salaire. Cette mesure est formulée en une seule ligne, dans une liste de mesures de son programme. Le programme ne précise pas si elle concernerait toutes les entreprises, comment le maintien des salaires serait assuré, ni à partir de quelle date elle s'appliquerait.
