titre: "Référendum en cas de blocage de la souveraineté par des règles supranationales"
texte_source: >-
  En cas d’impossibilité pour un Etat d’exercer sa souveraineté en raison de règles supranationales, il devra être possible, en cas de blocage, de demander aux citoyens d’arbitrer par référendum. Cela implique de revoir partiellement la hiérarchie des normes.
source: david-lisnard-axe-1-maitre-destin
source_localisation: "axe 1 Être maître de notre destin, partie Pour faire de l’Europe un levier de puissance, rubrique Pour démocratiser l’Europe, second paragraphe"
redactions:
  resume: >-
    Dans le programme de Nouvelle Énergie, David Lisnard prévoit un référendum en cas de blocage de la souveraineté par des règles supranationales.
  detaille: >-
    Dans l'axe Être maître de notre destin du programme de Nouvelle Énergie, parti de David Lisnard, la rubrique Pour démocratiser l'Europe énonce : « En cas d'impossibilité pour un Etat d'exercer sa souveraineté en raison de règles supranationales, il devra être possible, en cas de blocage, de demander aux citoyens d'arbitrer par référendum ». Le texte ajoute que « cela implique de revoir partiellement la hiérarchie des normes ». Le passage cité ne précise pas qui pourrait demander ce référendum, ni sur quelles règles, ni à partir de quelle date. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    David Lisnard et son parti veulent un [[référendum|referendum]] dans un cas précis. Ce serait quand un État ne peut plus décider seul à cause de règles supranationales. Les citoyens arbitreraient par leur vote. Le texte ne dit pas qui demanderait ce vote. Il ne dit pas quand.
  aine: >-
    Dans l'axe Être maître de notre destin du programme de Nouvelle Énergie, parti de David Lisnard, il est prévu qu'en cas de blocage de la souveraineté d'un État par des règles supranationales, il soit possible de demander aux citoyens d'arbitrer par référendum. Le texte indique que cela implique de revoir partiellement la hiérarchie des normes. Le passage cité ne précise pas qui pourrait demander ce référendum, ni pour quelles règles, ni à quelle date. Il ne donne aucun chiffre ni aucun coût.
