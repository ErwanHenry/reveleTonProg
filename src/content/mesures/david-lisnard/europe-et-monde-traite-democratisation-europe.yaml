titre: "Traité de démocratisation de l'Europe"
texte_source: >-
  La négociation d’un Traité de démocratisation de l’Europe permettra de revoir la répartition des compétences entre les institutions européennes, et de renforcer les prérogatives des institutions ayant la plus forte légitimité démocratique : le Conseil Européen et le Parlement.
source: david-lisnard-axe-1-maitre-destin
source_localisation: "axe 1 Être maître de notre destin, partie Pour faire de l’Europe un levier de puissance, rubrique Pour démocratiser l’Europe"
redactions:
  resume: >-
    Dans le programme de Nouvelle Énergie, David Lisnard prévoit la négociation d'un Traité de démocratisation de l'Europe.
  detaille: >-
    Dans l'axe Être maître de notre destin du programme de Nouvelle Énergie, parti de David Lisnard, la rubrique Pour démocratiser l'Europe prévoit la négociation d'un « Traité de démocratisation de l'Europe ». Selon le texte, ce traité « permettra de revoir la répartition des compétences entre les institutions européennes » et de renforcer les prérogatives des institutions « ayant la plus forte légitimité démocratique : le Conseil Européen et le Parlement ». Le texte cité ne précise pas quelles compétences changeraient de mains, ni quand ce traité serait négocié. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    David Lisnard et son parti veulent un nouveau [[traité]] pour l'Europe. Ce traité changerait qui décide quoi. Il donnerait plus de pouvoir à certaines institutions européennes, dont le Conseil européen. Le texte ne dit pas quels pouvoirs. Il ne dit pas quand.
  aine: >-
    Dans l'axe Être maître de notre destin du programme de Nouvelle Énergie, parti de David Lisnard, la rubrique Pour démocratiser l'Europe prévoit la négociation d'un Traité de démocratisation de l'Europe. Selon le texte, il permettrait de revoir la répartition des compétences entre les institutions européennes et de renforcer les prérogatives du Conseil Européen et du Parlement, jugés les plus légitimes sur le plan démocratique. Le passage cité ne précise ni les compétences concernées, ni la date de la négociation. Il ne donne aucun chiffre ni aucun coût.
