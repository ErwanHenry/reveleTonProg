candidat: christian-collovati
theme: europe-et-monde
sous_theme: souverainete-et-traites
titre: "Suspension des traités et des décisions de l’Union européenne"
texte_source: >-
  Mettre en suspens tous les traités et les décisions de l'UE jusqu'à la fin de l'année 2027 pour
  pouvoir mettre en œuvre les actions intérieures nécessaires au rétablissement du pays
source: christian-collovati-site-campagne
source_localisation: "section Actions par thématiques, rubrique Europe"
redactions:
  resume: >-
    Christian Collovati veut mettre en suspens tous les traités et les décisions de l’Union
    européenne jusqu’à la fin de l’année 2027.
  detaille: >-
    Dans la rubrique Europe des actions par thématiques de son site, Christian Collovati écrit : «
    Mettre en suspens tous les traités et les décisions de l'UE jusqu'à la fin de l'année 2027 pour
    pouvoir mettre en œuvre les actions intérieures nécessaires au rétablissement du pays ». Il veut
    donc mettre en pause les traités et les décisions de l’Union européenne, le temps d’agir à
    l’intérieur du pays. Le texte donne une échéance, la fin de l’année 2027. Il ne dit pas comment
    cette suspension serait décidée, ni quels traités seraient concernés en pratique, ni ce qui se
    passerait ensuite. Il ne donne aucun coût.
  enfant: >-
    Christian Collovati veut mettre en suspens tous les [[traités|traite]] de l’[[Union
    européenne]]. Mettre en suspens, c’est mettre en pause. Cela vaudrait aussi pour ses décisions.
    Ce serait jusqu’à la fin de l’année 2027. Il veut ainsi mener des actions dans le pays, pour le
    rétablir.
  aine: >-
    Dans la rubrique Europe de son site de campagne, Christian Collovati propose de mettre en
    suspens tous les traités et toutes les décisions de l’Union européenne jusqu’à la fin de l’année
    2027. Il explique que cela permettrait de mettre en œuvre les actions intérieures nécessaires au
    rétablissement du pays. Le texte ne précise pas comment la suspension serait décidée, quels
    traités seraient concernés en pratique, ni ce qui se passerait après la fin de l’année 2027. Il
    ne donne aucun chiffre de coût.
statut_relecture: brouillon
