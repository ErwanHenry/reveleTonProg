redactions:
  resume: >-
    Christian Collovati veut freiner la dépense sociale ainsi que l'endettement de la sécurité sociale et des collectivités locales.
  detaille: >-
    Sur son site de campagne, dans une liste intitulée Constat de la situation actuelle en France, Christian Collovati inscrit le freinage de la dépense sociale, de l'endettement de la sécurité sociale et de celui des collectivités locales. La mention figure dans une liste de points, sans développement. Cette ligne ne dit pas quelles dépenses seraient concernées, de quel montant la dépense serait freinée, ni sur quelle durée. Elle ne précise pas non plus quelles économies sont attendues. Ailleurs sur la page, parmi les actions prévues dès sa prise de fonctions, le candidat prévoit de suspendre pendant un mois plusieurs versements, dont les remboursements de la sécurité sociale, le temps de contrôles.
  enfant: >-
    Christian Collovati veut freiner les dépenses sociales. Il veut aussi freiner les dettes de la [[Sécurité sociale|securite-sociale]]. Il parle aussi des dettes des [[collectivités locales|collectivite-locale]]. Cette phrase ne dit pas comment il ferait. Elle ne dit pas non plus quelles dépenses seraient touchées.
  aine: >-
    Christian Collovati veut freiner la dépense sociale, l'endettement de la sécurité sociale et celui des collectivités locales, c'est-à-dire des communes, des départements et des régions. Cette phrase figure dans une liste de points de son site de campagne, sans développement. Cette ligne ne précise pas quelles dépenses seraient concernées ni de combien elles baisseraient. Ailleurs sur la page, le candidat prévoit de suspendre pendant un mois plusieurs versements, dont les remboursements de la sécurité sociale, le temps de contrôles.
