titre: "Fin des 35 heures, retour à 39 heures"
texte_source: >-
  Fin des 35h, retour au 39h : travailler plus pour gagner plus , pouvoir d'achat augmenté, baisse des cotisations sociales et patronales liée à la baisse du financement de la dette sociale car moins d'individus immigrés et suppression des subventions tous azimuts
source: christian-collovati-site-campagne
source_localisation: "page d'accueil du site, liste d'actions de prise de fonctions, rubrique Economie"
redactions:
  resume: >-
    Christian Collovati veut mettre fin aux 35 heures et revenir à 39 heures, pour travailler plus et gagner plus.
  detaille: >-
    Sur son site de campagne, Christian Collovati écrit : « Fin des 35h, retour au 39h : travailler plus pour gagner plus ». Il indique que le pouvoir d'achat serait augmenté. Il annonce aussi une baisse des cotisations sociales et patronales, qu'il relie à la baisse du financement de la dette sociale, car il y aurait « moins d'individus immigrés » et une suppression des subventions « tous azimuts ». Le texte ne précise pas de combien les revenus ou les cotisations évolueraient, ni sur quelle période se compteraient les heures, ni la date de la mesure.
  enfant: >-
    Christian Collovati veut mettre fin aux 35 heures et revenir à 39 heures. Il veut travailler plus pour gagner plus. Il écrit que le [[pouvoir d'achat|pouvoir-d-achat]] serait augmenté. Il écrit aussi que les [[cotisations|cotisation]] baisseraient. Le texte ne dit pas de combien.
  aine: >-
    Sur son site de campagne, Christian Collovati propose la fin des 35 heures et le retour à 39 heures, afin de travailler plus pour gagner plus. Il écrit que le pouvoir d'achat serait augmenté et que les cotisations sociales et patronales baisseraient. Il explique cette baisse par celle du financement de la dette sociale, car il y aurait moins d'individus immigrés, et par la suppression des subventions tous azimuts. Le texte ne dit pas de combien ni à partir de quand.
statut_relecture: brouillon
