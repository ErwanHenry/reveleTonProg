titre: "État des lieux des pays et adaptation de la coopération internationale"
texte_source: >-
  Etat des lieux des pays pour et contre les intérêts de la France et ainsi adaptation de la
  coopération internationale en tenant compte des faits et des accords du passé vers une
  projection future des liens à maintenir, à tisser ou à rompre
source: christian-collovati-site-campagne
source_localisation: "section Actions par thématiques, rubrique International"
redactions:
  resume: >-
    Christian Collovati veut un état des lieux des pays pour et contre les intérêts de la France,
    puis adapter la coopération internationale.
  detaille: >-
    Dans la rubrique International de son site, Christian Collovati écrit : « Etat des lieux des
    pays pour et contre les intérêts de la France et ainsi adaptation de la coopération
    internationale en tenant compte des faits et des accords du passé vers une projection future des
    liens à maintenir, à tisser ou à rompre ». Il prévoit donc un état des lieux, puis une
    adaptation de la coopération internationale, qui tiendrait compte des faits et des accords du
    passé. Les liens seraient maintenus, créés ou rompus. Le texte ne dit pas quels pays seraient
    jugés pour ou contre les intérêts de la France, ni selon quels critères, ni à quelle date. Il ne
    donne aucun chiffre.
  enfant: >-
    Christian Collovati veut d’abord faire le point sur les pays. Il veut savoir lesquels sont pour,
    et lesquels sont contre les intérêts de la France. Ensuite, la coopération avec ces pays serait
    adaptée. Certains liens seraient gardés, d’autres créés ou rompus. Le texte ne dit pas quels
    pays.
  aine: >-
    Dans la rubrique International de son site de campagne, Christian Collovati veut dresser un état
    des lieux des pays pour et contre les intérêts de la France. Il veut ensuite adapter la
    coopération internationale en tenant compte des faits et des accords du passé. Les liens
    seraient maintenus, tissés ou rompus selon ce bilan. Le texte ne dit pas quels pays seraient
    concernés, ni selon quels critères, ni à quelle date. Il ne donne aucun chiffre.
statut_relecture: brouillon
