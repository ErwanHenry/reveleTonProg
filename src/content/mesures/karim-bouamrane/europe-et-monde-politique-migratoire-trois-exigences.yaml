titre: "Politique migratoire en trois exigences"
texte_source: >-
  Une politique migratoire juste repose sur trois exigences : accueillir dignement ceux qui ont le
  droit de rester, agir à la source des migrations par le développement et la coopération, et
  reconduire ceux qui se maintiennent irrégulièrement sur notre territoire.
source: karim-bouamrane-manifeste
source_localisation: "manifeste, partie I Une France humaine, page 4 du PDF"
redactions:
  resume: >-
    Karim Bouamrane juge qu’une politique migratoire juste repose sur trois exigences : accueillir
    dignement, agir à la source des migrations, reconduire.
  detaille: >-
    Dans son manifeste, Karim Bouamrane écrit : « Une politique migratoire juste repose sur trois
    exigences : accueillir dignement ceux qui ont le droit de rester, agir à la source des
    migrations par le développement et la coopération, et reconduire ceux qui se maintiennent
    irrégulièrement sur notre territoire ». Il énonce donc trois volets : l’accueil de ceux qui ont
    le droit de rester, l’action à la source des migrations, par le développement et la coopération,
    et le retour de ceux qui se maintiennent irrégulièrement. Le texte cité ne précise ni les
    moyens, ni le nombre de personnes concernées, ni la date. Il ne donne aucun chiffre.
  enfant: >-
    Karim Bouamrane propose une politique sur les [[migrations|migration]], avec trois exigences. Il
    faut bien accueillir ceux qui ont le droit de rester. Il faut agir à la source des migrations,
    par le développement et la coopération. Il faut aussi faire repartir ceux qui n’ont pas le droit
    de rester.
  aine: >-
