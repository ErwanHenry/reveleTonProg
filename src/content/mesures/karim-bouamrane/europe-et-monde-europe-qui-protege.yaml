id: karim-bouamrane/europe-et-monde-europe-qui-protege
candidat: karim-bouamrane
theme: europe-et-monde
sous_theme: construction-europeenne
titre: "Une Europe qui protège"
texte_source: >-
  Une France forte qui construit une Europe qui nous protège. Cette Europe concrète des peuples
  défendus, des frontières gardées, des crises surmontées ensemble, cette Europe qui tient ses
  citoyens à l'abri des tempêtes du monde.
source: karim-bouamrane-manifeste
source_localisation: "manifeste, partie II Une France forte, page 5 du PDF"
redactions:
  resume: >-
    Karim Bouamrane veut une France forte qui construit une Europe qui protège : des peuples
    défendus, des frontières gardées, des crises surmontées ensemble.
  detaille: >-
    Dans son manifeste, Karim Bouamrane écrit : « Une France forte qui construit une Europe qui nous
    protège ». Il décrit cette Europe comme « concrète » : « des peuples défendus, des frontières
    gardées, des crises surmontées ensemble », qui « tient ses citoyens à l'abri des tempêtes du
    monde ». Le texte énonce une orientation générale et non des mesures précises. Il ne dit pas
    quelles règles ou quels moyens seraient utilisés, ni quelles institutions européennes seraient
    concernées, ni à quelle date. Il ne donne aucun chiffre.
  enfant: >-
    Karim Bouamrane veut une France forte qui construit une Europe qui nous protège. Pour lui, c’est
    une Europe de peuples défendus et de frontières gardées. C’est aussi une Europe où les crises
    sont surmontées ensemble. Le texte ne dit pas comment.
  aine: >-
    Dans son manifeste, Karim Bouamrane écrit qu’une France forte construit une Europe qui protège.
    Il décrit une Europe concrète, faite de peuples défendus, de frontières gardées et de crises
    surmontées ensemble, qui tient ses citoyens à l’abri des tempêtes du monde. Ce passage donne une
    orientation. Il ne précise ni les mesures, ni les moyens, ni le calendrier. Il ne donne aucun
    chiffre.
statut_relecture: brouillon
