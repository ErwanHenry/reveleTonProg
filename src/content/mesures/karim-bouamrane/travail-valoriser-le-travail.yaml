id: karim-bouamrane/travail-valoriser-le-travail
candidat: karim-bouamrane
theme: travail
sous_theme: salaires
titre: "Reconnaissance du travail : que travailler paye et permette de vivre dignement"
texte_source: >-
  Une France qui reconnaît le travail, celui de l'ouvrier, de l'artisan, de l'employé qui se lève tôt et finit le mois à découvert. Celui de l'aide-soignante, du livreur, de l'agriculteur qui tient ce pays debout sans que leur salaire le reconnaisse. Je veux que travailler paye et permette de vivre dignement.
source: karim-bouamrane-manifeste
source_localisation: "manifeste, passage sur la valorisation du travail (Une France forte)"
redactions:
  resume: >-
    Karim Bouamrane veut que travailler paye et permette de vivre dignement, et que le travail soit reconnu.
  detaille: >-
    Dans son manifeste, Karim Bouamrane décrit une France où le travail de l'ouvrier, de l'artisan et de l'employé qui se lève tôt et finit le mois à découvert est pris en compte, ainsi que celui de l'aide-soignante, du livreur et de l'agriculteur, sans que leur salaire le reconnaisse. Il écrit : « Je veux que travailler paye et permette de vivre dignement ». Ce passage est un énoncé de principe. Le texte ne précise pas quelle mesure serait prise, ni de combien les salaires évolueraient, ni à quelle date.
  enfant: >-
    Karim Bouamrane veut que travailler paye. Il veut que l'on puisse vivre dignement avec son travail. Il parle de l'ouvrier, de l'artisan et de l'employé. Il parle aussi de l'aide-soignante, du livreur et de l'agriculteur. Il veut que leur travail soit reconnu. Le texte ne dit pas comment.
  aine: >-
    Dans son manifeste, Karim Bouamrane écrit qu'il veut une France qui valorise le travail, celui de l'ouvrier, de l'artisan et de l'employé, mais aussi celui de l'aide-soignante, du livreur et de l'agriculteur. Il ajoute : « Je veux que travailler paye et permette de vivre dignement ». Il s'agit d'un principe général. Le texte ne dit pas quelle mesure serait prise, ni de combien les salaires augmenteraient, ni à quelle date.
