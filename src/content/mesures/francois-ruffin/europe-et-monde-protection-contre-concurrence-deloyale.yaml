candidat: francois-ruffin
theme: europe-et-monde
sous_theme: commerce-et-protectionnisme
titre: "Protection des productions contre les concurrences déloyales"
texte_source: >-
  Protéger nos productions des concurrences déloyales croissantes par des mesures d’urgence : mettre fin aux négociations d’accords de libre-échange, mobiliser des aides d’urgence lorsque les protections douanières de l’UE sont insuffisantes et imposer les mêmes normes sanitaires à l’ensemble des aliments et autres produits importés.
source: francois-ruffin-livret-industrie
source_localisation: "section nos propositions, Protéger notre industrie, relocaliser 100 produits, premier point de la liste"
redactions:
  resume: >-
    François Ruffin propose d'arrêter les négociations d'accords de libre-échange et d'imposer les mêmes normes sanitaires aux produits importés.
  detaille: >-
    Dans son cahier de campagne Industrie, section nos propositions, François Ruffin propose de « Protéger nos productions des concurrences déloyales croissantes par des mesures d’urgence ». Le texte détaille ces mesures : mettre fin aux négociations d'accords de libre-échange, mobiliser des aides d'urgence lorsque les protections douanières de l'UE sont insuffisantes, et imposer les mêmes normes sanitaires à l'ensemble des aliments et autres produits importés. Le passage ne précise ni les accords concernés, ni le montant des aides, ni le calendrier. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    François Ruffin veut protéger les produits français de la concurrence déloyale. Il veut arrêter de négocier de nouveaux accords de [[libre-échange]]. Il veut des aides d'urgence. Elles viendraient si les protections de [[douane]] de l'[[UE|union-europeenne]] ne suffisent pas. Il veut les mêmes normes de santé pour les aliments importés.
  aine: >-
    Dans son cahier de campagne Industrie, François Ruffin propose de protéger les productions françaises des concurrences déloyales par des mesures d'urgence. Il veut mettre fin aux négociations d'accords de libre-échange, mobiliser des aides d'urgence lorsque les protections douanières de l'UE sont insuffisantes, et imposer les mêmes normes sanitaires à tous les aliments et autres produits importés. Le texte ne précise pas les montants des aides ni le calendrier.
statut_relecture: brouillon
