titre: "Pôle public du médicament à 2 étages"
texte_source: >-
  Lorsque les dépendances sont les plus « vitales » et que les
  grands groupes sont difficiles à contrôler ou sabotent l’outil de
  production national, il faut que l’État devienne majoritaire dans des
  pôles de production ciblés, en particulier dans la santé, la défense
  et le numérique.
  C’est notamment le cas pour la proposition de pôle public du
  médicament à « 2 étages » : une production publique à court terme
  pour les produits de base critiques et une participation majoritaire
  dans des pôles d’entreprises dédiés aux médicaments innovants pour
  le moyen terme.
source: francois-ruffin-livret-industrie
