version_schema: 1
id: francois-ruffin/travail-grilles-classification
candidat: francois-ruffin
theme: travail
sous_theme: salaires
titre: "Revalorisation des grilles de classification"
texte_source: >-
  Pour en finir avec les grilles salariales en dessous du SMIC et permettre plus de progression au cours de la carrière, nous revaloriserons les grilles de classification.
source: francois-ruffin-statut-travailleurs-essentiels
source_localisation: "cahier Pour un statut des travailleuses et travailleurs essentiels, rubrique Salaires : Désmicardisation et revalorisation, proposition 2"
redactions:
  resume: >-
    François Ruffin propose de revaloriser les grilles de classification, pour en finir avec les grilles salariales en dessous du SMIC.
  detaille: >-
    Dans le cahier de campagne Pour un statut des travailleuses et travailleurs essentiels, François Ruffin propose de revaloriser les grilles de classification, pour en finir avec les grilles salariales en dessous du SMIC et permettre plus de progression au cours de la carrière. Cette proposition figure dans la rubrique du cahier consacrée aux salaires. Le texte cité ne dit pas de combien les grilles seraient revalorisées, ni à quelle date, ni comment le coût serait financé, ni si cela concernerait tous les salariés ou seulement certains métiers.
  enfant: >-
    François Ruffin veut changer les grilles de salaires. Ces grilles disent combien gagne chacun selon son poste. Certaines sont plus basses que le [[salaire minimum|smic]]. Il veut en finir avec cela. Il veut aussi que l'on progresse plus dans sa carrière. Le texte ne dit pas de combien.
  aine: >-
    Dans le cahier de campagne Pour un statut des travailleuses et travailleurs essentiels, François Ruffin propose de revaloriser les grilles de classification, c'est-à-dire les grilles qui fixent les niveaux de salaire, pour en finir avec les grilles salariales en dessous du SMIC, le salaire minimum, et permettre plus de progression au cours de la carrière. Le texte cité ne précise pas de combien les grilles seraient revalorisées, ni la date, ni le financement.
statut_relecture: brouillon
