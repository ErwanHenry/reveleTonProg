  detaille: >-
    Dans son cahier de campagne Éducation, François Ruffin propose d'installer une véritable médecine du travail et des services unifiés de santé scolaire. Ils regrouperaient médecins, infirmiers, assistants sociaux et psychologues au sein d'une structure unique par rectorat. Ce service garantirait des visites médicales annuelles pour les enseignants et les élèves, mettrait en place des cellules d'écoute et organiserait un suivi de terrain, afin qu'aucun signalement d'enseignant en danger ne reste sans réponse. Le texte ne précise ni le nombre de postes, ni le coût, ni la date de mise en place.
