id: francois-ruffin/europe-et-monde-buy-french-act
candidat: francois-ruffin
theme: europe-et-monde
sous_theme: commerce-et-protectionnisme
titre: "Buy French Act et produits made in France"
texte_source: >-
  Favoriser les achats de produits « made in France » par tous les moyens : un « Buy French Act » pour aller vers 80% de commande publique localisée en France, 100% des aides à la transition conditionnées à des empreintes écologiques minimales et 100% des produits de grande consommation avec un étiquetage clair des origines.
source: francois-ruffin-livret-industrie
source_localisation: "section nos propositions, Protéger notre industrie, relocaliser 100 produits, deuxième point de la liste"
redactions:
  resume: >-
    François Ruffin propose un « Buy French Act » pour aller vers 80% de commande publique localisée en France et un étiquetage clair des origines.
  detaille: >-
    Dans son cahier de campagne Industrie, section nos propositions, François Ruffin propose de favoriser les achats de produits « made in France » par tous les moyens, avec un « Buy French Act » pour aller vers « 80% de commande publique localisée en France ». Il ajoute 100% des aides à la transition conditionnées à des empreintes écologiques minimales et 100% des produits de grande consommation avec un étiquetage clair des origines. Le passage ne précise pas à quelle date ces proportions seraient atteintes. Il ne donne aucun coût.
  enfant: >-
    François Ruffin veut qu'on achète plus de produits « made in France ». Il propose un « Buy French Act ». Il veut aller vers 80% de [[commande publique]] localisée en France. Il veut aussi 100% de produits avec une origine clairement indiquée. Le texte ne dit pas quand.
  aine: >-
    Dans son cahier de campagne Industrie, François Ruffin propose de favoriser par tous les moyens les achats de produits made in France. Il évoque un Buy French Act pour aller vers 80% de commande publique localisée en France, c'est-à-dire d'achats faits par l'État et les collectivités. Il y ajoute 100% des aides à la transition conditionnées à des empreintes écologiques minimales et 100% des produits de grande consommation avec un étiquetage clair des origines. Le texte ne donne pas de date.
statut_relecture: brouillon
