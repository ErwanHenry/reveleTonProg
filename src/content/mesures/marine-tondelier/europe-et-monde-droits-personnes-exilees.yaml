titre: "Droits fondamentaux des personnes exilées"
texte_source: >-
  Garantir les droits fondamentaux des personnes exilées : scolarisation de tous les enfants, accès à l’AME et PUMA, suppression des délais de carence, interdiction des expulsions des personnes vivant avec une Affection Longue Durée, accès à des hébergements dignes. Abroger les lois asile et immigration d’Emmanuel Macron et toutes les mesures prises visant à amoindrir les droits des personnes exilées sous son mandat.
source: marine-tondelier-programme-prosperite-ecologique
source_localisation: "chapitre 56 Garantir les libertés de migration, proposition 1"
redactions:
  resume: >-
    Dans le programme des Écologistes, garantir les droits fondamentaux des personnes exilées et abroger les lois asile et immigration d'Emmanuel Macron.
  detaille: >-
    Dans le programme Pour une prospérité écologique des Écologistes, le parti de Marine Tondelier, la proposition qui ouvre le chapitre sur les libertés de migration veut « Garantir les droits fondamentaux des personnes exilées ». Elle cite la scolarisation de tous les enfants, l'accès à l'AME et à la PUMA, la suppression des délais de carence, l'interdiction de certaines expulsions et l'accès à des hébergements dignes. Elle ajoute : « Abroger les lois asile et immigration d’Emmanuel Macron ». Le passage ne précise ni le calendrier, ni le coût. Il ne donne aucun chiffre.
  enfant: >-
    Marine Tondelier veut garantir les droits des [[personnes exilées|exil]]. Tous les enfants iraient à l'école. Elle veut aussi des hébergements dignes. Elle veut abroger les lois sur l'asile et l'[[immigration]] d'Emmanuel Macron. Le texte ne dit pas quand. Il ne dit pas combien cela coûterait.
  aine: >-
    Dans le programme Pour une prospérité écologique des Écologistes, le parti de Marine Tondelier, la proposition qui ouvre le chapitre sur les libertés de migration prévoit de garantir les droits fondamentaux des personnes exilées. Elle cite la scolarisation de tous les enfants, l'accès à l'AME et à la PUMA, que le texte n'explique pas, la suppression des délais de carence, l'interdiction de certaines expulsions et des hébergements dignes. Elle propose aussi d'abroger les lois asile et immigration d'Emmanuel Macron. Le texte ne donne ni calendrier ni coût.
