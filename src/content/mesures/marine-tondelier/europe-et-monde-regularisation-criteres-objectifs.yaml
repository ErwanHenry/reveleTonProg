candidat: marine-tondelier
theme: europe-et-monde
sous_theme: immigration-et-asile
titre: "Régularisation sur critères objectifs"
texte_source: >-
  Arrêter la fabrique juridique des sans-papiers par la complexification croissante du droit des étrangers. Régulariser les travailleur·ses, les étudiant·es et les parents d’enfants scolarisés sur la base de critères objectifs (durée de résidence, effectivité du lien familial, durée ou promesse d’activité professionnelle).
source: marine-tondelier-programme-prosperite-ecologique
source_localisation: "chapitre 56 Garantir les libertés de migration, proposition 2"
redactions:
  resume: >-
    Dans le programme des Écologistes, régulariser les travailleurs, les étudiants et les parents d'enfants scolarisés sur la base de critères objectifs.
  detaille: >-
    Dans le programme Pour une prospérité écologique des Écologistes, le parti de Marine Tondelier, la proposition qui suit, dans le chapitre sur les libertés de migration, veut « Arrêter la fabrique juridique des sans-papiers par la complexification croissante du droit des étrangers ». Elle propose de régulariser les travailleurs et travailleuses, les étudiants et étudiantes et les parents d'enfants scolarisés, sur la base de critères objectifs : durée de résidence, effectivité du lien familial, durée ou promesse d'activité professionnelle. Le passage ne donne pas de seuil pour ces critères. Il ne donne aucun coût.
  enfant: >-
    Marine Tondelier veut arrêter de rendre le droit des étrangers plus dur à suivre. Elle veut donner des papiers à des [[sans-papiers]]. Cela vise les travailleurs, les étudiants et les parents d'enfants scolarisés. Le choix se ferait selon des critères objectifs. Le texte cite le temps passé en France et le lien familial.
  aine: >-
    Dans le programme Pour une prospérité écologique des Écologistes, le parti de Marine Tondelier, la proposition qui suit, dans le chapitre sur les libertés de migration, veut arrêter la complexification croissante du droit des étrangers. Elle propose de régulariser les travailleurs et travailleuses, les étudiants et étudiantes et les parents d'enfants scolarisés, sur des critères objectifs : durée de résidence, lien familial, durée ou promesse d'activité professionnelle. Le texte ne fixe pas de seuil et ne donne aucun coût.
