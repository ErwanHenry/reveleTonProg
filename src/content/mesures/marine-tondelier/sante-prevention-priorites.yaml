titre: "Développement massif de la prévention autour de quelques priorités"
texte_source: >-
  Développer massivement la prévention autour de

  quelques priorités comme la prévention des cancers, la lutte contre l’obésité
  et la protection de la santé mentale. Adopter des plans cohérents conjuguant
  mesures d’éducation, d’incitation économique et d’action sur l’environnement.
source: marine-tondelier-programme-prosperite-ecologique
