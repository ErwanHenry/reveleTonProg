candidat: marine-tondelier
theme: travail
sous_theme: salaires
titre: "Salaire minimum à 2000 euros brut par mois"
texte_source: >-
  Passer le salaire minimum à 2000€ brut par mois dès 2027. Soutenir les Très Petites et les Petites et Moyennes Entreprises (TPE et PME) ainsi que les associations par des dispositifs de soutien ciblés, stables et proportionnés comme un ajustement à la baisse du taux réduit de l’impôt sur les sociétés et de la taxe sur les salaires.
source: marine-tondelier-programme-prosperite-ecologique
source_localisation: "chapitre 13 Assurer des rémunérations dignes, mesure 1, page 55 du programme"
redactions:
  resume: >-
    Dans le programme des Écologistes, Marine Tondelier propose de passer le salaire minimum à 2000€ brut par mois dès 2027.
  detaille: >-
    Dans le programme Pour une prospérité écologique, présenté par les Écologistes, parti de Marine Tondelier, le chapitre consacré aux rémunérations dignes propose de passer le salaire minimum à 2000€ brut par mois dès 2027. Le texte associe à cette hausse un soutien aux très petites et petites et moyennes entreprises ainsi qu'aux associations, par des dispositifs ciblés, stables et proportionnés, comme un ajustement à la baisse du taux réduit de l'impôt sur les sociétés et de la taxe sur les salaires. Le texte cité ne dit pas combien cette mesure coûterait.
  enfant: >-
    Le parti de Marine Tondelier veut un salaire minimum de 2000€ [[brut|salaire-brut]] par mois. Ce serait dès 2027. Il veut aussi aider les petites entreprises et les associations. Cela se ferait avec des impôts plus bas. Le texte ne dit pas le coût.
  aine: >-
    Dans le programme Pour une prospérité écologique, présenté par les Écologistes, parti de Marine Tondelier, le chapitre sur les rémunérations dignes propose de passer le salaire minimum à 2000€ brut par mois dès 2027. Le texte propose en même temps de soutenir les très petites et petites et moyennes entreprises ainsi que les associations, par exemple par un ajustement à la baisse du taux réduit de l'impôt sur les sociétés et de la taxe sur les salaires. Il ne précise pas le coût de la mesure.
