candidat: marine-tondelier
theme: travail
sous_theme: salaires
titre: "Amélioration des traitements des fonctionnaires"
texte_source: >-
  Améliorer les traitements des fonctionnaires par l’indexation du point d’indice des fonctionnaires sur l’inflation. Augmenter de 10 % la rémunération des catégories C et B et des catégories A qui ont perdu en pouvoir d’achat ces 20 dernières années – en particulier les enseignant·es dont le salaire doit être revalorisé de 15 % dans le quinquennat et les chercheur·ses de 10 %.
source: marine-tondelier-programme-prosperite-ecologique
source_localisation: "chapitre 13 Assurer des rémunérations dignes, mesure 2, page 55 du programme"
redactions:
  resume: >-
    Le programme de Marine Tondelier propose d'indexer le point d'indice sur l'inflation et d'augmenter de 10 % certaines rémunérations.
  detaille: >-
    Dans le programme Pour une prospérité écologique, présenté par les Écologistes, parti de Marine Tondelier, le chapitre sur les rémunérations dignes propose d'améliorer les traitements des fonctionnaires par l'indexation du point d'indice sur l'inflation. Le texte ajoute d'augmenter de 10 % la rémunération des catégories C et B et des catégories A qui ont perdu en pouvoir d'achat ces 20 dernières années. Il précise que le salaire des enseignants doit être revalorisé de 15 % dans le quinquennat, et celui des chercheurs de 10 %. Le texte cité ne dit pas quel serait le coût de ces hausses.
  enfant: >-
    Le parti de Marine Tondelier veut que le salaire des [[fonctionnaires|fonctionnaire]] suive l'[[inflation]]. Il veut aussi hausser de 10 % certains salaires. Pour les enseignants, ce serait 15 % pendant le mandat. Pour les chercheurs, ce serait 10 %. Le texte ne dit pas le coût.
  aine: >-
    Dans le programme Pour une prospérité écologique, présenté par les Écologistes, parti de Marine Tondelier, le chapitre sur les rémunérations dignes propose d'améliorer les traitements des fonctionnaires par l'indexation du point d'indice sur l'inflation. Il prévoit aussi d'augmenter de 10 % la rémunération des catégories C et B, et des catégories A qui ont perdu en pouvoir d'achat ces 20 dernières années. Le salaire des enseignants serait revalorisé de 15 % dans le quinquennat, celui des chercheurs de 10 %. Le coût n'est pas précisé.
