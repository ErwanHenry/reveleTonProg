titre: "Prise en charge de l'activité physique adaptée par la Sécurité sociale"
texte_source: >-
  Généraliser la prise en charge
  de l’activité physique adaptée par la Sécurité
  Sociale. Développer le sport sur ordonnance.
source: marine-tondelier-programme-prosperite-ecologique
source_localisation: "chapitre 29 Améliorer la prévention et le parcours de soin, proposition 2, page 111 du programme"
redactions:
  resume: >-
    Dans le programme des Écologistes, Marine Tondelier propose de généraliser la prise en charge de l'activité physique adaptée par la Sécurité sociale.
  detaille: >-
    Dans le programme des Écologistes, Pour une prospérité écologique, soutenu par Marine Tondelier, le chapitre sur la prévention et le parcours de soin propose de généraliser la prise en charge de l'activité physique adaptée par la Sécurité sociale, et de développer le sport sur ordonnance. Le texte cité ne précise pas quelles personnes ou quelles maladies seraient concernées, quel serait le niveau de prise en charge, ni qui pourrait prescrire cette activité. Il ne donne ni coût ni date de mise en place, et ne dit pas ce qu'est précisément le sport sur ordonnance.
  enfant: >-
    Marine Tondelier et son parti veulent que la [[Sécurité sociale|securite-sociale]] paie l'[[activité physique adaptée|activite-physique-adaptee]]. C'est du sport choisi selon l'état de santé de chacun. Ils veulent aussi développer le sport sur ordonnance. Le texte ne dit pas qui pourrait en profiter. Il ne dit pas combien cela coûterait.
  aine: >-
    Dans le programme des Écologistes, Pour une prospérité écologique, soutenu par Marine Tondelier, le chapitre sur la prévention et le parcours de soin propose de généraliser la prise en charge de l'activité physique adaptée par la Sécurité sociale et de développer le sport sur ordonnance. Le passage cité ne précise ni les personnes concernées, ni le niveau de remboursement, ni le coût, ni la date.
