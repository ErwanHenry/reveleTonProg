id: edouard-philippe/europe-et-monde-accord-1968-algerie
candidat: edouard-philippe
theme: europe-et-monde
sous_theme: immigration-et-asile
titre: "Dénonciation de l'accord de 1968 avec l'Algérie"
texte_source: >-
  Dénoncer l'accord de 1968 avec l'Algérie pour reprendre le contrôle des flux migratoires.
source: edouard-philippe-priorite-securite
source_localisation: "page Pour une France plus sûre, section Reprendre le contrôle de nos frontières, deuxième point"
redactions:
  resume: >-
    Édouard Philippe propose de dénoncer l'accord de 1968 avec l'Algérie pour reprendre le contrôle des flux migratoires.
  detaille: >-
    Sur la page Pour une France plus sûre de son site de campagne, dans la section Reprendre le contrôle de nos frontières, Édouard Philippe propose de « Dénoncer l'accord de 1968 avec l'Algérie pour reprendre le contrôle des flux migratoires ». Le texte cité nomme l'accord visé, celui de 1968 avec l'Algérie, et donne le but de cette dénonciation : reprendre le contrôle des flux migratoires. Il ne dit pas ce que contient cet accord, ni ce qui le remplacerait, ni la date de la dénonciation, ni les effets attendus. Il ne donne aucun chiffre autre que l'année de l'accord, ni aucun coût.
  enfant: >-
    Édouard Philippe veut dénoncer l'accord de 1968 avec l'Algérie. Dénoncer un accord, c'est annoncer qu'on le quitte. Le but est de reprendre le contrôle des [[flux migratoires|migration]]. Le texte ne dit pas ce qui remplacerait l'accord. Il ne dit pas quand.
  aine: >-
    Dans la section de son site de campagne consacrée aux frontières, Édouard Philippe propose de dénoncer l'accord de 1968 avec l'Algérie, c'est-à-dire d'annoncer que la France met fin à cet accord. Il indique que le but est de reprendre le contrôle des flux migratoires. Le texte cité ne dit pas ce que contient l'accord, ni ce qui le remplacerait, ni à quelle date cela se ferait. Il ne donne aucun coût.
statut_relecture: brouillon
