version_schema: 1
id: edouard-philippe/sante-stabiliser-depenses-prevention
candidat: edouard-philippe
theme: sante
sous_theme: prevention
titre: "Stabilisation des dépenses de santé par la prévention et les transformations technologiques"
texte_source: >-
  Stabiliser les dépenses de santé en dépensant mieux, en misant sur la prévention et les transformations technologiques plutôt que sur la seule hausse des moyens.
source: edouard-philippe-priorite-prosperite
source_localisation: "page Pour une France plus prospère, rubrique Rétablir nos comptes pour retrouver notre souveraineté"
redactions:
  resume: >-
    Édouard Philippe veut stabiliser les dépenses de santé en dépensant mieux, avec la prévention et les transformations technologiques.
  detaille: >-
    Sur la page Pour une France plus prospère de son site de campagne, Édouard Philippe propose de stabiliser les dépenses de santé en dépensant mieux. Il indique vouloir miser sur la prévention et sur les transformations technologiques, plutôt que sur la seule hausse des moyens. La phrase figure dans la rubrique consacrée au rétablissement des comptes. Le texte ne précise pas quelles dépenses seraient concernées, de quel montant serait la stabilisation, ni quelles technologies ou quelles actions de prévention seraient retenues. Il ne donne aucune date.
  enfant: >-
    Édouard Philippe veut que les dépenses de santé n'augmentent plus. Il veut dépenser mieux. Il veut compter sur la [[prévention]] et sur les nouvelles technologies. Il ne veut pas seulement donner plus de moyens à la santé. Le texte ne dit pas quelles actions il choisirait. Il ne donne pas de chiffre.
  aine: >-
    Sur la page Pour une France plus prospère de son site de campagne, Édouard Philippe propose de stabiliser les dépenses de santé en dépensant mieux, en s'appuyant sur la prévention et sur les transformations technologiques plutôt que sur la seule hausse des moyens. Le texte ne précise pas quelles dépenses de santé seraient concernées, quels montants seraient visés ni à quelle échéance. Il ne dit pas non plus quelles mesures de prévention ou quelles technologies seraient utilisées.
statut_relecture: brouillon
