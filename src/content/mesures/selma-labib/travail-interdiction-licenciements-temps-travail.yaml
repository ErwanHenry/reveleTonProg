id: selma-labib/travail-interdiction-licenciements-temps-travail
candidat: selma-labib
theme: travail
sous_theme: temps-de-travail
titre: "Interdiction des licenciements et baisse du temps de travail sans perte de salaire"
texte_source: >-
  Imposer l’interdiction des licenciements, l’arrêt de toutes les suppressions d’emplois et la baisse du temps de travail sans perte de salaire, jusqu’à l’extinction du chômage, c’est la seule manière de mettre fin au chômage de masse, pour les jeunes comme pour les anciens.
source: selma-labib-4-pages-campagne
source_localisation: "page 2, section sur la hausse et l'indexation des salaires, deuxième paragraphe"
redactions:
  resume: >-
    Selma Labib propose d'interdire les licenciements, d'arrêter les suppressions d'emplois et de baisser le temps de travail sans perte de salaire.
  detaille: >-
    Dans le document de campagne du NPA-Révolutionnaires qui soutient Selma Labib, il est proposé d'imposer l'interdiction des licenciements, l'arrêt de toutes les suppressions d'emplois et la baisse du temps de travail sans perte de salaire. Ces mesures seraient maintenues jusqu'à l'extinction du chômage. Le texte les présente comme la seule manière de mettre fin au chômage de masse, pour les jeunes comme pour les anciens. Le programme ne précise pas de quelle durée hebdomadaire serait la baisse du temps de travail, ni à partir de quelle date.
  enfant: >-
    Selma Labib veut interdire les [[licenciements|licenciement]]. Elle veut aussi arrêter la suppression d'emplois. Elle veut baisser le temps de travail sans baisser les salaires. Cela durerait jusqu'à la fin du chômage. Selon le texte, c'est la seule façon de finir avec le chômage de masse.
  aine: >-
    Dans le document de campagne du NPA-Révolutionnaires, qui soutient Selma Labib, il est proposé d'interdire les licenciements, d'arrêter toutes les suppressions d'emplois et de baisser le temps de travail sans perte de salaire. Cela durerait jusqu'à l'extinction du chômage, présentée comme la seule manière de mettre fin au chômage de masse, pour les jeunes comme pour les anciens. Le programme ne précise pas de combien d'heures le temps de travail baisserait, ni à partir de quand.
statut_relecture: brouillon
