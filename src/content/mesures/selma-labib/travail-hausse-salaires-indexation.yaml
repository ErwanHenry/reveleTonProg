version_schema: 1
id: selma-labib/travail-hausse-salaires-indexation
candidat: selma-labib
theme: travail
sous_theme: salaires
titre: "Augmentation générale des salaires, pensions et allocations, indexées sur les prix"
texte_source: >-
  Arracher 400 et même 500 euros d’augmentation, c’est ce qu’il nous faut pour nous en sortir. On ne peut pas vivre décemment aujourd’hui avec moins de 2 200 euros net par mois. L’augmentation massive, générale des salaires mais aussi des pensions et des allocations, et leur indexation sur les prix : c’est le premier objectif que doivent se fixer les travailleurs, c’est une urgence pour l’ensemble du monde du travail !
source: selma-labib-4-pages-campagne
source_localisation: "page 2, section sur la hausse et l'indexation des salaires"
redactions:
  resume: >-
    Selma Labib propose une hausse générale des salaires, pensions et allocations, de 400 à 500 euros, indexée sur les prix.
  detaille: >-
    Dans le document de campagne du NPA-Révolutionnaires qui soutient Selma Labib, la section consacrée aux salaires demande une augmentation de 400 et même 500 euros. Le texte indique qu'on ne peut pas vivre décemment aujourd'hui avec moins de 2 200 euros net par mois. Il demande une augmentation massive et générale des salaires, mais aussi des pensions et des allocations, ainsi que leur indexation sur les prix. Le texte en fait le premier objectif des travailleurs. Le programme ne précise pas qui financerait ces hausses, ni à quelle date elles s'appliqueraient.
  enfant: >-
    Selma Labib veut que les salaires, les pensions et les allocations augmentent. Elle parle de 400 à 500 euros de plus. Pour vivre décemment, il faut plus de 2 200 euros [[net|salaire-net]] par mois, dit le texte. Il veut aussi que ces sommes suivent la hausse des prix.
  aine: >-
    Dans le document de campagne du NPA-Révolutionnaires, qui soutient Selma Labib, une augmentation de 400 et même 500 euros est présentée comme nécessaire. Le texte indique qu'on ne peut pas vivre décemment aujourd'hui avec moins de 2 200 euros net par mois. Il demande une augmentation massive et générale des salaires, des pensions et des allocations, avec une indexation sur les prix, c'est-à-dire un ajustement à leur hausse. Le programme ne précise pas le financement ni le calendrier.
