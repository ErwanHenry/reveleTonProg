candidat: selma-labib
theme: sante
sous_theme: hopital-et-soignants
titre: "Besoins en embauches recensés par les travailleurs, notamment dans les hôpitaux"
texte_source: >-
  Dans chaque atelier, dans tous les services, dans toutes les écoles et les hôpitaux, c’est à nous-mêmes de recenser et de chiffrer les besoins en embauches : nous sommes les mieux placés pour savoir de combien de bras on a besoin pour faire tourner correctement les entreprises !
source: selma-labib-4-pages-campagne
source_localisation: "page 2 du PDF, rubrique Imposer l'interdiction des licenciements et des embauches massives "
redactions:
  resume: >-
    Le NPA-Révolutionnaires, parti de Selma Labib, veut que les travailleurs recensent eux-mêmes les besoins en embauches, notamment dans les hôpitaux.
  detaille: >-
    Dans son document de campagne, le NPA-Révolutionnaires, parti de Selma Labib, indique que, dans chaque atelier, dans tous les services, dans toutes les écoles et les hôpitaux, c'est aux travailleurs eux-mêmes de recenser et de chiffrer les besoins en embauches. Le texte justifie cela en disant qu'ils sont les mieux placés pour savoir de combien de personnes on a besoin. Il ne précise pas le nombre d'embauches pour les hôpitaux, ni qui les financerait, ni comment ces besoins seraient recensés.
  enfant: >-
    Selma Labib et son parti veulent que les travailleurs comptent eux-mêmes les embauches nécessaires. Cela vaut pour les services, les écoles et les hôpitaux. Pour le texte, ce sont eux qui savent le mieux combien de personnes il faut. Il ne dit pas qui paierait ces embauches.
  aine: >-
    Dans son document de campagne, le NPA-Révolutionnaires, parti de Selma Labib, écrit que, dans les ateliers, les services, les écoles et les hôpitaux, les travailleurs doivent eux-mêmes recenser et chiffrer les besoins en embauches. Ils sont, selon le texte, les mieux placés pour savoir de combien de personnes on a besoin. Le document ne donne aucun nombre d'embauches pour les hôpitaux et ne dit pas comment elles seraient financées.
statut_relecture: brouillon
