id: gabriel-attal/europe-et-monde-regroupement-familial
candidat: gabriel-attal
theme: europe-et-monde
sous_theme: immigration-et-asile
titre: "Encadrement et baisse du regroupement familial"
texte_source: >-
  Notre ligne est claire, ce que nous voulons, c’est accueillir moins pour accueillir mieux,
  privilégier l’immigration de travail au détriment d’autres types d’immigration comme le
  regroupement familial, qui doit être mieux encadré et qui doit donc diminuer.
source: gabriel-attal-europe-frontieres
source_localisation: "chantier capital Frontières, section Maîtriser l’immigration"
redactions:
  resume: >-
    Gabriel Attal veut accueillir moins pour accueillir mieux, privilégier l’immigration de travail
    et mieux encadrer le regroupement familial, qui doit diminuer.
  detaille: >-
    Dans le chantier capital Frontières de son programme, Gabriel Attal écrit : « accueillir moins
    pour accueillir mieux ». Il veut « privilégier l’immigration de travail au détriment d’autres
    types d’immigration comme le regroupement familial, qui doit être mieux encadré et qui doit donc
    diminuer ». Le texte fixe donc une orientation : donner la priorité à l’immigration de travail,
    et réduire le regroupement familial en l’encadrant davantage. Le texte cité ne précise pas
    quelles règles seraient changées, de combien le regroupement familial diminuerait, ni à partir
    de quelle date. Il ne donne aucun chiffre.
  enfant: >-
    Gabriel Attal veut accueillir moins pour accueillir mieux. Il veut donner la priorité à
    l’[[immigration]] de travail. Il veut mieux encadrer le [[regroupement familial]]. Pour lui, il
    doit baisser. Le texte ne dit pas de combien. Il ne dit pas quand.
  aine: >-
    Gabriel Attal indique que sa ligne est d’accueillir moins pour accueillir mieux. Il veut
    privilégier l’immigration de travail plutôt que d’autres types d’immigration, comme le
    regroupement familial. Selon le texte, le regroupement familial doit être mieux encadré et doit
    donc diminuer. Le texte cité ne précise pas quelles règles changeraient, ni de combien le
    regroupement familial diminuerait, ni à quelle date. Il ne donne aucun chiffre.
statut_relecture: brouillon
