titre: "Constitution du travail de cinquante pages au maximum"
texte_source: >-
  Une Constitution du travail de cinquante pages au maximum, qui fixe les grands principes et renvoie le reste à la négociation.
source: gabriel-attal-travail-constitution
source_localisation: "page de la mesure Remplacer le Code du travail par une Constitution du travail, chapeau"
redactions:
  resume: >-
    Gabriel Attal propose une Constitution du travail de cinquante pages au maximum, qui fixe les grands principes et renvoie le reste à la négociation.
  detaille: >-
    Gabriel Attal propose une « Constitution du travail » de cinquante pages au maximum. Ce texte fixerait les grands principes et renverrait le reste à la négociation. Le programme ne précise pas qui mènerait cette négociation, ni à quel niveau elle aurait lieu. Il ne dit pas non plus quels grands principes figureraient dans ce texte, ni ce que deviendraient les règles actuelles, ni à quelle date le changement serait prévu. Le texte ne dit pas non plus ce que le renvoi à la négociation changerait pour les salariés comme pour les employeurs.
  enfant: >-
    Gabriel Attal veut un texte sur le travail de cinquante pages au maximum. Ce texte dirait les grands principes. Le reste serait décidé par la négociation, c'est-à-dire par la discussion. Le texte ne dit pas qui discuterait. Il ne dit pas non plus quels seraient les grands principes.
  aine: >-
    Gabriel Attal propose une Constitution du travail de cinquante pages au maximum. Selon le texte, elle fixerait les grands principes et renverrait le reste à la négociation. Le programme ne précise pas qui négocierait, ni à quel niveau, ni quels seraient les grands principes retenus. Il ne dit pas non plus ce qui deviendrait des règles actuelles, ni à quelle date cette Constitution du travail serait mise en place.
statut_relecture: brouillon
