titre: "Droit à la climatisation : copropriétés et contraintes patrimoniales"
texte_source: >-
  Certaines copropriétés s'opposent sans raison aux installations individuelles : Gabriel Attal veut neutraliser ces blocages. Il veut aussi simplifier drastiquement les contraintes patrimoniales imposées par les Architectes des Bâtiments de France, qui empêchent trop souvent la pose de volets ou l'isolation des logements anciens.
source: gabriel-attal-sante-droit-climatisation
source_localisation: "page de la mesure Instaurer un droit à la climatisation , section Lever les blocages des copropriétés et des contraintes patrimoniales"
redactions:
  resume: >-
    Gabriel Attal veut neutraliser les blocages de copropriétés aux installations individuelles et simplifier les contraintes patrimoniales sur les volets et l'isolation.
  detaille: >-
    Sur la page de son site intitulée Instaurer un droit à la climatisation, Gabriel Attal vise des obstacles à ce droit. D'une part, il indique que certaines copropriétés s'opposent aux installations individuelles et qu'il veut neutraliser ces blocages. D'autre part, il veut simplifier fortement les contraintes patrimoniales imposées par les Architectes des Bâtiments de France, qui empêchent selon lui, trop souvent, la pose de volets ou l'isolation des logements anciens. Le passage ne dit pas comment les blocages seraient neutralisés, ni quelles règles patrimoniales seraient changées. Il ne chiffre pas le coût et ne donne pas de date d'application.
  enfant: >-
    Gabriel Attal propose un droit à la climatisation des logements. Parfois, la [[copropriété|copropriete]] refuse les installations individuelles. Il veut mettre fin à ces blocages. Il veut aussi simplifier des règles sur les logements anciens. Selon lui, elles empêchent trop souvent de poser des volets ou d'isoler.
  aine: >-
    Gabriel Attal propose un droit à la climatisation des logements. Il indique que certaines copropriétés s'opposent aux installations individuelles et veut neutraliser ces blocages. Il veut aussi simplifier fortement les contraintes patrimoniales imposées par les Architectes des Bâtiments de France. Selon lui, elles empêchent trop souvent la pose de volets ou l'isolation des logements anciens. Le texte ne dit pas comment ces blocages seraient levés ni à quelle date la mesure s'appliquerait.
