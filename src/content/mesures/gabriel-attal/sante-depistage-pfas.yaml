titre: "Dépistage automatique des polluants éternels dans les captages d'eau potable"
texte_source: >-
  Gabriel Attal veut rendre automatique le dépistage des PFAS dans tous les captages d'eau potable : il ne dépend plus d'un signalement, d'une alerte locale ou de la vigilance d'une collectivité. Le principe pollueur-payeur doit s'appliquer, avec des sanctions dissuasives contre ceux qui déversent et violent les règles.
source: gabriel-attal-sante-depistage-pfas
