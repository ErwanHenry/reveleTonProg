redactions:
  resume: >-
    Son parti, Debout la France, veut la suppression immédiate, intégrale et irréversible du passe sanitaire.
  detaille: >-
    Dans la page Santé du projet de Debout la France, parti de Nicolas Dupont-Aignan, la mesure qui ouvre la liste des mesures fortes consiste à prononcer la suppression immédiate, intégrale et irréversible du passe sanitaire. Le texte ne dit pas par quel acte juridique cette suppression serait décidée. Plus bas, la même page étend la mesure à tout passe sanitaire ou vaccinal et demande la réintégration des soignants exclus et le rétablissement de leurs trimestres de retraite perdus. La page ne porte pas de date de publication visible : elle est consultable sur le site du parti à la date de capture, sans autre indication de mise à jour.
  enfant: >-
    Son parti veut supprimer le [[passe sanitaire]]. Il l'écrit dans la page Santé de son projet. Cette suppression serait immédiate, totale et sans retour possible. Le texte ne dit pas comment elle serait décidée. Il ne donne pas de date.
  aine: >-
