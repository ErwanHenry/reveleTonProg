redactions:
  resume: >-
    Nicolas Dupont-Aignan propose d'organiser un référendum sur l'appartenance de la France à l'Union européenne.
  detaille: >-
    Dans le projet de Debout la France, présenté sur la page Affaires européennes, Nicolas Dupont-Aignan propose d'organiser un référendum sur l'appartenance de la France à l'Union européenne. Elle ouvre la liste des mesures de cette page, intitulée Nos mesures. Le texte cité ne dit pas quelle question serait posée, à quelle date le vote aurait lieu, ni ce qui se passerait selon le résultat. Le programme ne précise pas non plus le coût de cette mesure.
  enfant: >-
    Nicolas Dupont-Aignan veut organiser un [[référendum|referendum]]. Les Français voteraient sur une question. La question est de savoir si la France reste dans l'[[Union européenne|union-europeenne]]. Le texte ne dit pas quand ce vote aurait lieu. Il ne dit pas ce qui se passerait ensuite.
  aine: >-
    Dans le projet de Debout la France, Nicolas Dupont-Aignan propose d'organiser un référendum sur l'appartenance de la France à l'Union européenne. Un référendum est un vote par lequel les citoyens répondent directement à une question. Le texte cité ne précise ni la question exacte posée, ni la date du vote, ni les conséquences selon le résultat. Il ne donne aucun chiffre ni aucun coût.
