redactions:
  resume: >-
    Nicolas Dupont-Aignan propose de rétablir les frontières nationales en sortant de l'espace Schengen.
  detaille: >-
    Dans le projet de Debout la France, présenté sur la page Affaires européennes, Nicolas Dupont-Aignan propose de rétablir les frontières nationales de la France en sortant de l'espace Schengen. Elle figure dans la liste des mesures de cette page, intitulée Nos mesures, juste après le référendum. Le texte cité ne dit pas comment seraient organisés les contrôles, à partir de quelle date ils commenceraient, ni quels moyens y seraient consacrés. Le programme ne précise pas non plus le coût de cette mesure.
  enfant: >-
    Nicolas Dupont-Aignan veut rétablir les frontières de la France. Pour cela, la France quitterait l'[[espace Schengen|schengen]]. Le texte ne dit pas comment les contrôles seraient faits. Il ne dit pas non plus quand ils commenceraient. Il ne dit pas combien cela coûterait.
  aine: >-
    Dans le projet de Debout la France, Nicolas Dupont-Aignan propose de rétablir les frontières nationales en sortant de l'espace Schengen. L'espace Schengen est un ensemble de pays européens entre lesquels on circule sans contrôle systématique aux frontières. Le texte cité ne précise ni les modalités des contrôles, ni la date, ni les moyens prévus. Il ne donne aucun chiffre ni aucun coût.
statut_relecture: brouillon
