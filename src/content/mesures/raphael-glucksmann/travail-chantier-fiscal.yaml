version_schema: 1
id: raphael-glucksmann/travail-chantier-fiscal
candidat: raphael-glucksmann
theme: travail
sous_theme: fiscalite-et-financement
titre: "Grand chantier fiscal sur la taxation du travail, du capital, de l'héritage et des retraites"
texte_source: >-
  Lancer un grand chantier fiscal visant à rééquilibrer la répartition de la taxation entre le travail, le capital, l’héritage et les retraites pour sortir de cette impasse injuste qui favorise les héritiers ou les retraités aisés aux détriments des travailleurs.
source: raphael-glucksmann-projet-acte-1
source_localisation: "page 40, chantier 16, liste des propositions, deuxième élément"
redactions:
  resume: >-
    Raphaël Glucksmann propose un grand chantier fiscal pour rééquilibrer la taxation entre le travail, le capital, l'héritage et les retraites.
  detaille: >-
    Dans le projet Acte I de Place publique, Raphaël Glucksmann propose de lancer un grand chantier fiscal. Il vise à rééquilibrer la répartition de la taxation entre le travail, le capital, l'héritage et les retraites. Le texte décrit la situation actuelle comme une « impasse injuste » qui favorise les héritiers ou les retraités aisés aux détriments des travailleurs. Le programme ne précise pas quels impôts changeraient, de combien, ni qui paierait plus ou moins. Il ne donne pas non plus de date pour ce chantier.
  enfant: >-
    Raphaël Glucksmann veut un grand chantier sur les impôts. Il veut changer la façon de taxer le travail. Il parle aussi du [[capital]], de l'héritage et des retraites. Selon le texte, cela aide les héritiers ou les retraités aisés. Cela se fait au détriment des travailleurs.
  aine: >-
    Dans le projet Acte I de Place publique, Raphaël Glucksmann propose de lancer un grand chantier fiscal. Il s'agirait de rééquilibrer la taxation entre le travail, le capital, l'héritage et les retraites. Selon le texte, la situation actuelle favorise les héritiers ou les retraités aisés, aux détriments des travailleurs. Le programme ne précise pas quels impôts seraient modifiés, ni dans quelle mesure, ni à quelle date.
statut_relecture: brouillon
