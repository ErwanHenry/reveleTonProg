id: raphael-glucksmann/sante-projet-territorial-sante
candidat: raphael-glucksmann
theme: sante
sous_theme: gouvernance-sante
titre: "Modèle coopératif de santé piloté localement par un Projet territorial de santé"
texte_source: >-
  Bâtir un modèle coopératif de santé piloté localement, à travers un Projet territorial de Santé co-construit par les professionnels, les hôpitaux, les élus, les usagers et l’État, définissant les priorités selon les besoins réels de la population.
source: raphael-glucksmann-projet-acte-1
source_localisation: "page 50 du PDF, chantier 23 Bien soigner, partout !, premier paragraphe de propositions"
redactions:
  resume: >-
    Le projet de Place publique, parti de Raphaël Glucksmann, veut un modèle de santé piloté localement, avec un Projet territorial de Santé.
  detaille: >-
    Dans le projet Acte I de Place publique, parti de Raphaël Glucksmann, le chantier intitulé Bien soigner, partout prévoit de bâtir un modèle coopératif de santé piloté localement. Il passerait par un Projet territorial de Santé, construit ensemble par les professionnels, les hôpitaux, les élus, les usagers et l'État. Ce projet définirait les priorités selon les besoins réels de la population. Le texte ne précise ni la taille du territoire concerné, ni le calendrier, ni le coût, ni la façon dont les désaccords entre ces acteurs seraient tranchés.
  enfant: >-
    Raphaël Glucksmann et son parti veulent organiser la santé près des habitants. Chaque territoire aurait un projet de santé. Les soignants, les élus, les usagers et l'État le feraient ensemble. Il fixerait les priorités selon les besoins des habitants. Le texte ne dit pas le coût.
  aine: >-
    Le projet Acte I de Place publique, parti de Raphaël Glucksmann, propose un modèle de santé coopératif, piloté localement. Il repose sur un Projet territorial de Santé, construit conjointement par les professionnels, les hôpitaux, les élus, les usagers et l'État. Ce projet fixerait les priorités selon les besoins réels de la population. Le texte ne précise pas quel territoire serait concerné, qui aurait le dernier mot, ni quel serait le coût de cette organisation.
statut_relecture: brouillon
