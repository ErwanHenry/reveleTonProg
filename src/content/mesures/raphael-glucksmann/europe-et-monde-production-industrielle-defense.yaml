sous_theme: defense-et-alliances
titre: "Accélération de la production industrielle face à un conflit de haute intensité"
texte_source: >-
  Accélérer enfin la production industrielle pour faire face à un conflit de haute intensité sur le sol européen, signer des contrats de moyen et long terme avec nos industriels, mobiliser l’ensemble du tissu industriel, des grands groupes aux PME et start-ups.
source: raphael-glucksmann-projet-acte-1
source_localisation: "chantier Défendre la France et l’Europe, partie Adapter la défense française à la guerre contemporaine, rubrique Nous voulons, page 10 du PDF"
redactions:
  resume: >-
    Raphaël Glucksmann et son parti veulent accélérer la production industrielle pour faire face à un conflit de haute intensité sur le sol européen.
  detaille: >-
    Dans le projet Acte I de Place publique, parti de Raphaël Glucksmann, le chantier Défendre la France et l'Europe contient une partie intitulée Adapter la défense française à la guerre contemporaine. Sous la rubrique Nous voulons, le texte propose d'accélérer la production industrielle « pour faire face à un conflit de haute intensité sur le sol européen ». Il prévoit aussi de signer des contrats de moyen et long terme avec les industriels et de mobiliser « l'ensemble du tissu industriel, des grands groupes aux PME et start-ups ». Le texte cité ne précise ni les productions visées, ni les montants, ni les dates. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Raphaël Glucksmann et son parti veulent produire plus vite dans l'industrie. C'est pour faire face à un « conflit de haute intensité » en Europe. Ils veulent signer des contrats de long terme avec les entreprises. Ils veulent faire travailler les grandes et les petites entreprises. Le texte ne dit pas combien cela coûterait.
  aine: >-
    Dans le projet Acte I de Place publique, parti de Raphaël Glucksmann, le chantier consacré à la défense propose d'accélérer la production industrielle pour faire face à un conflit de haute intensité sur le sol européen. Le texte prévoit des contrats de moyen et long terme avec les industriels, et la mobilisation de l'ensemble du tissu industriel, des grands groupes aux petites et moyennes entreprises et aux jeunes entreprises. Il ne précise ni les productions concernées, ni les montants, ni le calendrier, ni le coût.
statut_relecture: brouillon
