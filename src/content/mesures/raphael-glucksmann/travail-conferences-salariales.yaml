titre: "Conférences salariales"
texte_source: >-
  Organiser immédiatement des conférences salariales dans tout le pays, visant d’abord les métiers utiles marqués par la précarité et la pénibilité, pour renégocier avec les branches professionnelles les grilles de rémunération et les hausses de salaire.
source: raphael-glucksmann-projet-acte-1
source_localisation: "page 40, chantier 16, liste des propositions, début"
redactions:
  resume: >-
    Raphaël Glucksmann propose d'organiser des conférences salariales dans tout le pays, d'abord pour les métiers marqués par la précarité et la pénibilité.
  detaille: >-
    Dans le projet Acte I de Place publique, Raphaël Glucksmann propose d'organiser immédiatement des conférences salariales dans tout le pays. Elles viseraient d'abord les métiers utiles marqués par la précarité et la pénibilité. Leur but est de renégocier avec les branches professionnelles les grilles de rémunération et les hausses de salaire. Le programme ne précise pas quels métiers seraient concernés d'abord, qui participerait à ces conférences, ni le calendrier au-delà du mot immédiatement. Il ne donne pas non plus le niveau des hausses visées pour cette mesure.
  enfant: >-
    Raphaël Glucksmann veut des réunions sur les salaires dans tout le pays. Il veut le faire tout de suite. Elles viseraient d'abord les métiers utiles, précaires et pénibles. Le texte parle des grilles de salaires et des hausses. On y rediscuterait des salaires avec les [[branches professionnelles|branche-professionnelle]].
  aine: >-
    Dans le projet Acte I de Place publique, Raphaël Glucksmann propose d'organiser immédiatement, dans tout le pays, des conférences salariales. Elles viseraient d'abord les métiers utiles marqués par la précarité et la pénibilité. L'objectif est de renégocier, avec les branches professionnelles, les grilles de rémunération et les hausses de salaire. Une branche professionnelle regroupe les entreprises d'un même secteur. Le programme ne précise pas la liste des métiers visés ni la date de la prochaine étape.
statut_relecture: brouillon
