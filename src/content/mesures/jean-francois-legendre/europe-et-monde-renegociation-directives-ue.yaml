sous_theme: construction-europeenne
titre: "Renégociation de certaines législations et directives de l'Union européenne"
texte_source: >-
  Cependant, certaines législations ou directives éditées par l'Union sont trop pénalisantes pour les États et devront être renégociées.
source: jean-francois-legendre-manifeste
source_localisation: "manifeste 64 %, section L'Europe"
redactions:
  resume: >-
    Jean-François Legendre indique que certaines législations ou directives de l'Union européenne, trop pénalisantes pour les États, devront être renégociées.
  detaille: >-
    Dans son manifeste, section L'Europe, Jean-François Legendre écrit : « certaines législations ou directives éditées par l'Union sont trop pénalisantes pour les États et devront être renégociées ». Le texte cité ne dit pas quelles législations ou directives seraient concernées dans ce passage, ni comment la renégociation serait menée, ni avec quels partenaires, ni à quelle date. Le passage figure dans la section consacrée à l'Europe, après un constat sur la souveraineté cédée à l'Union. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Jean-François Legendre veut rediscuter certaines règles de l'[[Union européenne|union-europeenne]]. Pour lui, elles pèsent trop sur les États. Le texte ne dit pas quelles règles. Il ne dit pas comment les rediscuter. Il ne dit pas avec qui. Il ne dit pas quand.
  aine: >-
    Dans son manifeste, Jean-François Legendre estime que certaines législations ou directives éditées par l'Union européenne sont trop pénalisantes pour les États et devront être renégociées. Le passage figure dans la section consacrée à l'Europe. Il ne précise pas lesquelles, ni comment se déroulerait la renégociation, ni avec quels partenaires, ni à quelle date. Il ne donne aucun chiffre ni aucun coût.
statut_relecture: brouillon
