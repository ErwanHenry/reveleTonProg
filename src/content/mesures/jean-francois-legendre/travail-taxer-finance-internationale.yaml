candidat: jean-francois-legendre
theme: travail
sous_theme: fiscalite-et-financement
titre: "Taxation de la finance internationale pour équilibrer l'État providence"
texte_source: >-
  Il faut des recettes d’une autre nature pour équilibrer l’action de l’État Providence. La seule activité capable de procurer des montants suffisants est la finance internationale. Il faut donc la taxer et limiter les fabuleux montants qui disparaissent dans les paradis fiscaux.
source: jean-francois-legendre-manifeste
source_localisation: "section consacrée au travail"
redactions:
  resume: >-
    Jean-François Legendre propose de taxer la finance internationale et de limiter les montants qui disparaissent dans les paradis fiscaux.
  detaille: >-
    Dans son manifeste, à la section consacrée au travail, Jean-François Legendre écrit qu'il faut des recettes d'une autre nature pour équilibrer l'action de l'État Providence. Selon lui, la seule activité capable de procurer des montants suffisants est la finance internationale. Il en conclut qu'il faut la taxer et limiter les « fabuleux montants » qui disparaissent dans les paradis fiscaux. Le programme ne précise pas quelle taxe serait créée, à quel taux, ni comment les montants versés vers les paradis fiscaux seraient limités. Il ne donne pas de date.
  enfant: >-
    Jean-François Legendre veut trouver d'autres recettes pour l'[[État providence|etat-providence]]. Il pense que seule la [[finance]] du monde entier peut en donner assez. Il veut donc la taxer. Il veut aussi limiter l'argent qui part dans les [[paradis fiscaux|paradis-fiscal]]. Le texte ne dit pas comment.
  aine: >-
    Dans son manifeste, à la section consacrée au travail, Jean-François Legendre écrit qu'il faut des recettes d'une autre nature pour équilibrer l'action de l'État providence, c'est-à-dire l'ensemble des protections financées par l'État. Selon lui, seule la finance internationale peut fournir des montants suffisants. Il propose donc de la taxer et de limiter les montants qui disparaissent dans les paradis fiscaux. Le programme ne précise ni les taux, ni les moyens, ni la date.
statut_relecture: brouillon
