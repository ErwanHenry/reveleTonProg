candidat: jean-francois-legendre
theme: sante
sous_theme: assurance-maladie
titre: "Préservation du système de prise en charge de la santé par des organismes de l'État"
texte_source: >-
  De notre naissance à notre mort, quel que soit le problème de santé que nous rencontrons, il est pris en charge intégralement par des organismes mis en place par l’État : on a juste à montrer sa carte Vitale et le reste à charge est de… 0€. C'est merveilleux, il faut préserver ce système, mais il faut savoir que cela n'existe que dans de très rares pays.
source: jean-francois-legendre-manifeste
source_localisation: "manifeste, paragraphe La santé de la partie sur l'assistanat"
redactions:
  resume: >-
    Jean-François Legendre écrit qu'il faut préserver le système où l'État prend en charge la santé, rare selon lui dans le monde.
  detaille: >-
    Dans son manifeste, Jean-François Legendre décrit le système de santé français : quel que soit le problème de santé, la prise en charge est intégrale par des organismes mis en place par l'État, il suffit de montrer sa carte Vitale. Il écrit que ce système est merveilleux et qu'il faut le préserver, tout en précisant qu'il n'existe que dans de très rares pays. Le passage figure dans une partie consacrée à l'assistanat. Après les paragraphes sur la santé, l'éducation, le logement et les transports, le manifeste écrit que, pour que tout cela continue, il faudra faire des choix, tous ensemble. Plus haut, parmi les efforts demandés pour réduire les déficits, il prévoit moins de remboursements pour les actes médicaux et les médicaments.
  enfant: >-
    Jean-François Legendre décrit le système de santé français. Selon lui, des organismes de l'État paient tous les soins. D'après lui, il suffit de montrer sa carte Vitale. Il écrit qu'il faut préserver ce système. Il note que très peu de pays font pareil. Le même texte prévoit aussi moins de remboursements de soins et de médicaments.
  aine: >-
    Dans son manifeste, Jean-François Legendre décrit le système de santé français, où des organismes mis en place par l'État prennent en charge les soins sans reste à payer : il suffit de présenter sa carte Vitale. Il écrit qu'il faut préserver ce système, tout en rappelant qu'il n'existe que dans de très rares pays. Le texte ne précise pas les moyens de cette préservation. Plus haut, parmi les efforts demandés pour réduire les déficits, le manifeste prévoit moins de remboursements pour les actes médicaux et les médicaments.
