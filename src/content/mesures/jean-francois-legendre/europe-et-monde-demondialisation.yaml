sous_theme: commerce-et-protectionnisme
titre: "Démondialisation et rapatriement des activités de base"
texte_source: >-
  Nous prônons la démondialisation. Il est vital de rapatrier les activités de base que nous maîtrisions et que nous avons peu à peu laissées partir en imaginant que cela ne poserait pas de problème.
source: jean-francois-legendre-manifeste
source_localisation: "manifeste 64 %, section La mondialisation, paragraphe La démondialisation"
redactions:
  resume: >-
    Jean-François Legendre prône la démondialisation et le rapatriement des activités de base que la France maîtrisait.
  detaille: >-
    Dans son manifeste, section La mondialisation, Jean-François Legendre écrit : « Nous prônons la démondialisation ». Il ajoute qu'il est « vital de rapatrier les activités de base que nous maîtrisions et que nous avons peu à peu laissées partir en imaginant que cela ne poserait pas de problème ». Le passage cité ne donne pas la liste des activités concernées, ni les moyens de les rapatrier, ni les pays où elles seraient installées, ni la date. Il ne donne aucun chiffre ni aucun coût. Ce paragraphe fait suite à un constat du texte sur les effets de la mondialisation, que cette rédaction ne reprend pas.
  enfant: >-
    Jean-François Legendre veut la [[démondialisation]]. Il veut ramener en France des activités de base. La France savait les faire. Elle les a laissées partir peu à peu. Le texte ne dit pas lesquelles. Il ne dit pas comment. Il ne dit pas quand.
  aine: >-
    Dans son manifeste, section La mondialisation, Jean-François Legendre se prononce pour la démondialisation. Il juge vital de rapatrier les activités de base que la France maîtrisait et qu'elle a peu à peu laissé partir, en imaginant que cela ne poserait pas de problème. Le passage cité ne précise pas quelles activités seraient rapatriées, par quels moyens, ni à quelle date. Il ne donne aucun chiffre ni aucun coût.
statut_relecture: brouillon
