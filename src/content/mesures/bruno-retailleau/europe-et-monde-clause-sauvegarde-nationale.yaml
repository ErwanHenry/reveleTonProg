titre: "Clause de sauvegarde nationale dans la Constitution"
texte_source: >-
  Nous introduirons dans la Constitution une clause de sauvegarde nationale. Son mécanisme est le suivant : lorsqu’une interprétation jurisprudentielle d’un traité international fera obstacle à une loi que les Français ont souhaitée, le peuple, par référendum, ou le Parlement, par une loi organique, pourra proposer de faire primer la loi française sur cette interprétation.
source: bruno-retailleau-manifeste-peuple-souverain
source_localisation: "page 12, partie 2 Tous nos engagements internationaux, point a"
redactions:
  resume: >-
    Bruno Retailleau veut inscrire dans la Constitution une clause de sauvegarde nationale, pour faire primer la loi française sur une interprétation d'un traité.
  detaille: >-
    Dans son Manifeste du peuple souverain, Bruno Retailleau écrit : « Nous introduirons dans la Constitution une clause de sauvegarde nationale ». Le mécanisme décrit est le suivant : lorsqu'une interprétation jurisprudentielle d'un traité international fera obstacle à une loi que les Français ont souhaitée, le peuple, par référendum, ou le Parlement, par une loi organique, pourra proposer de faire primer la loi française sur cette interprétation. Le passage cité ne précise pas quels traités seraient concernés ni la date de cette réforme. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Bruno Retailleau veut ajouter une règle à la [[Constitution]]. Elle s'appelle la clause de sauvegarde nationale. Elle vise la façon dont les juges lisent un [[traité]]. Cette lecture peut bloquer une loi voulue par les Français. Alors, le peuple, par [[référendum]], pourrait proposer de faire passer la loi française avant. Le [[Parlement]] aussi.
  aine: >-
    Dans son Manifeste du peuple souverain, Bruno Retailleau propose d'introduire dans la Constitution une clause de sauvegarde nationale. Elle s'appliquerait lorsque l'interprétation d'un traité international par la jurisprudence fait obstacle à une loi que les Français ont souhaitée. Le peuple, par référendum, ou le Parlement, par une loi organique, pourrait alors proposer de faire primer la loi française sur cette interprétation. Le texte cité ne dit pas quels traités seraient concernés.
