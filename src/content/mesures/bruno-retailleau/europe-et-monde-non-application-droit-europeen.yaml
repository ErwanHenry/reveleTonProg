version_schema: 1
id: bruno-retailleau/europe-et-monde-non-application-droit-europeen
candidat: bruno-retailleau
theme: europe-et-monde
sous_theme: souverainete-et-traites
titre: "Non-application du droit européen hors des compétences de l'Union"
texte_source: >-
  Nous ferons interdiction à toute administration, au Parlement et aux juridictions d’appliquer les règlements européens, les directives européennes et les jurisprudences de la Cour de justice de l’Union européenne dans deux cas. Lorsqu’ils sont contraires à la Constitution et lorsqu’ils sortent du champ de compétences que les traités reconnaissent à l’Union européenne.
source: bruno-retailleau-manifeste-peuple-souverain
source_localisation: "page 13, partie 2 Tous nos engagements internationaux, point b"
redactions:
  resume: >-
    Bruno Retailleau veut interdire d'appliquer le droit européen s'il est contraire à la Constitution ou s'il sort des compétences de l'Union.
  detaille: >-
    Dans son Manifeste du peuple souverain, Bruno Retailleau écrit : « Nous ferons interdiction à toute administration, au Parlement et aux juridictions d’appliquer les règlements européens, les directives européennes et les jurisprudences de la Cour de justice de l’Union européenne dans deux cas ». Les deux cas cités sont : lorsqu'ils sont contraires à la Constitution, et lorsqu'ils sortent du champ de compétences que les traités attribuent à l'Union européenne. Le passage cité ne précise ni la date de mise en œuvre, ni qui constaterait qu'un cas est réuni. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Bruno Retailleau veut interdire des règles européennes. L'administration, le [[Parlement]] et les juges ne les suivraient pas. Il cite deux cas. Une règle va contre la [[Constitution]]. Ou elle dépasse ce que les [[traités|traite]] donnent à l'[[Union européenne|union-europeenne]].
  aine: >-
    Dans son Manifeste du peuple souverain, Bruno Retailleau propose d'interdire à toute administration, au Parlement et aux juridictions d'appliquer les règlements européens, les directives européennes et les jurisprudences de la Cour de justice de l'Union européenne dans deux cas. Un cas est celui où ces textes sont contraires à la Constitution. L'autre est celui où ils sortent du champ de compétences que les traités attribuent à l'Union. Le passage cité ne précise pas qui constaterait ces cas.
statut_relecture: brouillon
