titre: "Une santé plus proche des gens"
texte_source: >-
  Je veux une santé plus proche des gens. Elle ne doit pas être enfermée dans de grands centres éloignés, où l’on finit par aller trop tard, trop fatigué ou trop inquiet. Elle doit être présente près des communes, près des familles, près des personnes âgées, près des enfants, près des territoires isolés et des Outre-mer.
source: emmanuel-dubuisson-sante-publique-medecine
source_localisation: "dossier 3 Santé publique et médecine , section Une santé plus proche des gens"
redactions:
  resume: >-
    Emmanuel Dubuisson veut une santé plus proche des gens, des communes, des familles et des territoires isolés.
  detaille: >-
    Dans son dossier Santé publique et médecine, Emmanuel Dubuisson écrit vouloir une santé plus proche des gens. Selon lui, elle ne doit pas être enfermée dans de grands centres éloignés, où l'on finit par aller trop tard, trop fatigué ou trop inquiet. Elle doit être présente près des communes, des familles, des personnes âgées, des enfants, des territoires isolés et des Outre-mer. Le texte ne dit pas quels équipements ou quels professionnels seraient installés, ni combien de lieux seraient concernés. Il ne donne ni budget ni calendrier.
  enfant: >-
    Emmanuel Dubuisson veut une santé plus proche des gens. Il ne veut pas qu'elle soit enfermée dans de grands centres éloignés. Elle serait présente près des communes, des familles, des personnes âgées et des enfants. Elle serait aussi près des territoires isolés et des Outre-mer.
  aine: >-
    Emmanuel Dubuisson écrit qu'il veut une santé plus proche des gens. Il ne souhaite pas qu'elle soit enfermée dans de grands centres éloignés, où l'on finit par aller trop tard, trop fatigué ou trop inquiet. Elle devrait être présente près des communes, des familles, des personnes âgées, des enfants, des territoires isolés et des Outre-mer. Le texte ne précise pas quels moyens seraient mis en place ni à quelle date.
