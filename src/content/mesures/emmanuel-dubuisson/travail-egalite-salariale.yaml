titre: "Égalité salariale : comparaison des situations équivalentes et correction des écarts"
texte_source: >-
  Le talent mérite la même reconnaissance. Comparer les situations équivalentes, contrôler les écarts et organiser une correction qui se voit dans la paie et le parcours.
source: emmanuel-dubuisson-ce-qui-change
