redactions:
  resume: >-
    Emmanuel Dubuisson veut comparer les situations équivalentes, contrôler les écarts et organiser une correction qui se voit dans la paie et le parcours.
  detaille: >-
    Sur la page de son site consacrée à ce qui change pour les Français, Emmanuel Dubuisson écrit : « Le talent mérite la même reconnaissance ». Il propose de comparer les situations équivalentes, de contrôler les écarts et d'organiser une correction qui se voit dans la paie et le parcours. Le texte ne précise pas quels écarts sont visés, entre quelles personnes ils seraient mesurés, qui ferait les contrôles, ni comment la correction serait organisée. Il ne donne pas de date, ni de méthode pour effectuer la comparaison.
  enfant: >-
    Emmanuel Dubuisson écrit que le talent mérite la même reconnaissance. Il veut comparer des situations équivalentes. Il veut aussi contrôler les écarts. Puis une correction serait faite. Elle se verrait dans la paie. Elle se verrait aussi dans le parcours. Le texte ne dit pas quels écarts.
