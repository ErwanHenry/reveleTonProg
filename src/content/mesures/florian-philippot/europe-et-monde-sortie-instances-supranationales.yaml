sous_theme: souverainete-et-traites
titre: "Sortie des instances supranationales"
texte_source: >-
  La France doit retrouver sa souveraineté nationale en quittant toutes les instances supranationales : UE, Euro, Schengen, CEDH, OTAN, OMS. Le peuple français pourra alors reprendre en main son destin.
source: florian-philippot-projet-pour-la-france
source_localisation: "page 2, chapitre Démocratie, institutions, corruption, premier paragraphe"
redactions:
  resume: >-
    Dans le projet des Patriotes, la France quitterait toutes les instances supranationales, dont l'UE, l'euro, Schengen et l'OTAN.
  detaille: >-
    Dans le projet des Patriotes, le mouvement de Florian Philippot, le chapitre Démocratie, institutions, corruption s'ouvre ainsi : « La France doit retrouver sa souveraineté nationale en quittant toutes les instances supranationales : UE, Euro, Schengen, CEDH, OTAN, OMS ». Le texte ajoute que « Le peuple français pourra alors reprendre en main son destin ». La liste cite plusieurs organisations ou dispositifs, désignés par des sigles ou des noms courts que le passage n'explique pas. Il ne précise ni la procédure de sortie, ni le calendrier, ni les conséquences prévues pour chacun. Il ne donne aucun coût.
  enfant: >-
    Florian Philippot veut que la France quitte plusieurs organisations. Il cite l'[[UE|union-europeenne]] et l'euro. Il cite aussi [[Schengen|schengen]] et l'[[OTAN|otan]]. Le texte en nomme d'autres par des sigles. Le peuple pourrait alors reprendre en main son destin.
  aine: >-
    Dans le projet des Patriotes, le mouvement de Florian Philippot, la France doit retrouver sa souveraineté nationale en quittant toutes les instances supranationales. Le texte cite l'UE, l'euro, Schengen, la CEDH, l'OTAN et l'OMS, sans expliquer ces sigles. Il ajoute que le peuple français pourra alors reprendre en main son destin. Le passage ne précise ni la procédure ni le calendrier.
statut_relecture: brouillon
