titre: "Objectif du Frexit"
texte_source: >-
  L’objectif du Frexit (sortie de la France de l’Union européenne) est simple : retrouver notre souveraineté nationale, c’est-à-dire notre capacité à décider de nos politiques, en tout domaine. Une fois le Frexit réalisé, la France retrouvera l’ensemble des compétences qu’elle a transférées en tout ou partie à l’Union européenne, à commencer par les compétences économiques essentielles (monnaie, banque, commerce extérieur, règles budgétaires, marché, concurrence, etc.), mais aussi la politique agricole et la pêche, la politique environnementale, la politique énergétique, l’immigration et l’asile, la régulation du numérique, etc.
source: florian-philippot-projet-pour-la-france
source_localisation: "page 25, partie Le Frexit en 10 questions, question 1 Dans quel but"
redactions:
  resume: >-
    Dans le projet des Patriotes, le Frexit, sortie de l'Union européenne, vise à retrouver la capacité de décider de ses politiques en tout domaine.
  detaille: >-
    Dans le projet des Patriotes, le mouvement de Florian Philippot, la partie de questions et réponses consacrée au Frexit commence par la question du but. Elle écrit : « L’objectif du Frexit (sortie de la France de l’Union européenne) est simple : retrouver notre souveraineté nationale, c’est-à-dire notre capacité à décider de nos politiques, en tout domaine ». Le texte énumère ensuite les compétences que la France retrouverait, dont la monnaie, le commerce extérieur, l'immigration et l'asile. Ce passage ne donne ni date de sortie, ni coût. Il ne dit pas comment la sortie serait décidée.
  enfant: >-
    Florian Philippot veut le « Frexit ». C'est la sortie de la France de l'[[Union européenne|union-europeenne]]. Le but est de décider de ses politiques dans tous les domaines. La France retrouverait des pouvoirs, comme la monnaie ou le commerce extérieur. Elle retrouverait aussi l'[[immigration]] et l'asile. Le texte ne dit pas quand.
