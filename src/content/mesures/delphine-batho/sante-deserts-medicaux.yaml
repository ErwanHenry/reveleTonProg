version_schema: 1
id: delphine-batho/sante-deserts-medicaux
candidat: delphine-batho
theme: sante
sous_theme: acces-aux-soins
titre: "Proposition de loi contre les déserts médicaux : installation des médecins et centres de santé"
texte_source: >-
  Une proposition de loi détaillée est prête, pour réguler l’installation des médecins et créer des centres de santé, soutenue par 86 % de la population. Elle deviendra la loi de la République.
source: delphine-batho-priorite-1
source_localisation: "page de la priorité 1 La pleine santé , proposition 04 Mettre fin aux déserts médicaux"
redactions:
  resume: >-
    Delphine Batho veut faire adopter une proposition de loi qui régule l'installation des médecins et crée des centres de santé.
  detaille: >-
    Dans la priorité de son site de campagne intitulée La pleine santé, Delphine Batho présente une proposition de loi, qu'elle dit détaillée et prête, pour réguler l'installation des médecins et créer des centres de santé. Le texte indique qu'elle serait soutenue par 86 % de la population et qu'elle deviendra la loi de la République. L'extrait ne précise pas comment l'installation des médecins serait régulée, ni combien de centres de santé seraient créés, ni qui les financerait. Il ne donne pas non plus de calendrier pour le vote de cette loi.
  enfant: >-
    Delphine Batho veut une nouvelle loi contre les [[déserts médicaux|desert-medical]]. Un texte de loi est déjà écrit. Il fixerait des règles pour l'installation des médecins. Il permettrait aussi de créer des centres de santé. Selon le texte, 86 % de la population le soutient.
  aine: >-
    Delphine Batho annonce qu'une proposition de loi détaillée est prête. Son objectif est de réguler l'installation des médecins et de créer des centres de santé. Elle écrit que ce texte est soutenu par 86 % de la population et qu'il deviendra la loi de la République. Le programme ne précise pas les règles d'installation prévues, ni le nombre de centres de santé, ni leur financement, ni la date du vote.
statut_relecture: brouillon
