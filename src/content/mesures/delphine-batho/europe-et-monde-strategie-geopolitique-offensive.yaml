candidat: delphine-batho
theme: europe-et-monde
sous_theme: diplomatie-et-multilateralisme
titre: "Stratégie géopolitique offensive de la France"
texte_source: >-
  Face à l’internationale réactionnaire, la stratégie géopolitique de la France doit être
  offensive et porter un projet alternatif pour la vie sur Terre. Notre nation doit déployer le
  drapeau d’une espérance pour la jeunesse et l’humanité tout entière : celui de la préservation
  des biens communs, de l’émancipation des femmes, des droits humains, de la paix avec la nature
  et entre les peuples.
source: delphine-batho-priorite-4
source_localisation: "Priorité 4 La République terrestre, première proposition n° 08 Porter haut la voix d’une nouvelle harmonie pour l’humanité sur Terre"
redactions:
  resume: >-
    Delphine Batho veut que la stratégie géopolitique de la France soit offensive et porte un projet
    alternatif pour la vie sur Terre.
  detaille: >-
    Dans l’une de ses propositions, Delphine Batho écrit : « Face à l’internationale réactionnaire,
    la stratégie géopolitique de la France doit être offensive et porter un projet alternatif pour
    la vie sur Terre ». Elle ajoute que la nation doit déployer « le drapeau d’une espérance pour la
    jeunesse et l’humanité tout entière », celui de la préservation des biens communs, de
    l’émancipation des femmes, des droits humains, de la paix avec la nature et entre les peuples.
    Le texte cité décrit une orientation générale. Il ne précise pas quelles actions diplomatiques
    seraient menées, avec quels pays, ni quand. Il ne donne aucun chiffre.
  enfant: >-
    Delphine Batho veut que la France mène une stratégie « offensive » dans le monde. Elle veut
    proposer un autre projet, pour la vie sur Terre. Elle cite la préservation des biens communs,
    les droits humains et la paix. Le texte ne dit pas quelles actions seraient menées.
  aine: >-
    Delphine Batho écrit que la stratégie géopolitique de la France doit être offensive et porter un
    projet alternatif pour la vie sur Terre, face à ce qu’elle nomme l’internationale réactionnaire.
    Elle veut que la nation déploie le drapeau d’une espérance pour la jeunesse et l’humanité : la
    préservation des biens communs, l’émancipation des femmes, les droits humains, la paix avec la
    nature et entre les peuples. Le texte ne précise ni les actions concrètes, ni les pays
    concernés, ni le calendrier.
