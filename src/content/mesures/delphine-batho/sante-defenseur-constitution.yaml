titre: "Défenseur de la santé humaine et animale et inscription de la pleine santé dans la Constitution"
texte_source: >-
  Nous créerons une ou un Défenseur de la santé humaine et animale, doté de pouvoirs d’enquête, qui pourra être saisi par les citoyennes et citoyens. La pleine santé et le principe d’habitabilité seront inscrits dans la Constitution pour guider toutes les politiques publiques, reconnaître notre interdépendance à l’ensemble du vivant et empêcher l’adoption de lois toxiques.
source: delphine-batho-priorite-1
source_localisation: "page de la priorité 1 La pleine santé , proposition 05"
redactions:
  resume: >-
    Delphine Batho veut créer un Défenseur de la santé humaine et animale et inscrire la pleine santé dans la Constitution.
  detaille: >-
    Delphine Batho annonce la création d'un Défenseur de la santé humaine et animale, doté de pouvoirs d'enquête, que les citoyennes et citoyens pourraient saisir. Elle prévoit aussi d'inscrire la pleine santé et le principe d'habitabilité dans la Constitution. Le texte donne pour buts à cette inscription guider toutes les politiques publiques, reconnaître l'interdépendance avec l'ensemble du vivant et empêcher l'adoption de lois toxiques. L'extrait ne définit ni la pleine santé ni l'habitabilité. Il ne dit pas comment le Défenseur serait désigné, ni quand la Constitution serait modifiée.
  enfant: >-
    Delphine Batho veut créer un Défenseur de la santé des humains et des animaux. Il pourrait enquêter. Les citoyens pourraient lui demander d'agir. Elle veut aussi écrire la pleine santé dans la [[Constitution]]. Cela guiderait toutes les décisions publiques.
  aine: >-
    Delphine Batho annonce la création d'un Défenseur de la santé humaine et animale. Cette personne aurait des pouvoirs d'enquête et pourrait être saisie par les citoyennes et les citoyens. Elle veut aussi inscrire la pleine santé et le principe d'habitabilité dans la Constitution, pour guider toutes les politiques publiques et empêcher l'adoption de lois toxiques. Le programme ne définit pas ces notions et ne dit pas quand la Constitution serait modifiée.
statut_relecture: brouillon
