titre: "Défenseur de la santé humaine et animale et inscription de la pleine santé dans la Constitution"
texte_source: >-
  Nous créerons une ou un Défenseur de la santé humaine et animale, doté de pouvoirs d’enquête, qui pourra être saisi par les citoyennes et citoyens. La pleine santé et le principe d’habitabilité seront inscrits dans la Constitution pour guider toutes les politiques publiques, reconnaître notre interdépendance à l’ensemble du vivant et empêcher l’adoption de lois toxiques.
source: delphine-batho-priorite-1
source_localisation: "page La pleine santé (rubrique Priorités du site), proposition 05 Inscrire la pleine santé et le respect de l'habitabilité dans la Constitution"
redactions:
  resume: >-
    Delphine Batho veut créer un Défenseur de la santé humaine et animale et inscrire la pleine santé dans la Constitution.
  detaille: >-
    Delphine Batho annonce la création d'un Défenseur de la santé humaine et animale, doté de pouvoirs d'enquête, que les citoyennes et citoyens pourraient saisir. Elle prévoit aussi d'inscrire la pleine santé et le principe d'habitabilité dans la Constitution. Selon le texte, cette inscription doit guider toutes les politiques publiques, reconnaître l'interdépendance avec l'ensemble du vivant et empêcher l'adoption de lois toxiques. La proposition ne définit ni la pleine santé ni l'habitabilité. Elle ne dit pas comment le Défenseur serait désigné, ni quand la Constitution serait modifiée.
  enfant: >-
    Delphine Batho veut créer un Défenseur de la santé des humains et des animaux. Il pourrait enquêter. Les citoyens pourraient lui demander d'agir. Elle veut aussi écrire la pleine santé dans la [[Constitution]]. Selon elle, cela guiderait toutes les décisions publiques.
  aine: >-
    Delphine Batho annonce la création d'un Défenseur de la santé humaine et animale. Cette personne aurait des pouvoirs d'enquête et pourrait être saisie par les citoyennes et les citoyens. Delphine Batho veut aussi inscrire la pleine santé et le principe d'habitabilité dans la Constitution, pour guider toutes les politiques publiques et empêcher l'adoption de lois toxiques. La proposition ne définit pas ces notions et ne dit pas quand la Constitution serait modifiée.
