candidat: nathalie-arthaud
theme: travail
sous_theme: salaires
titre: "Augmentation massive des salaires, des allocations et des pensions, indexée sur les prix"
texte_source: >-
  Nous devons imposer une augmentation massive des salaires, des allocations et des pensions et leur indexation sur la hausse des prix : quand les prix montent, notre salaire doit suivre !
source: nathalie-arthaud-brochure-campagne
source_localisation: "brochure de campagne, page 9 (numérotation imprimée), rubrique sur la hausse des prix et des salaires"
redactions:
  resume: >-
    Nathalie Arthaud veut imposer une augmentation massive des salaires, des allocations et des pensions, avec une indexation sur la hausse des prix.
  detaille: >-
    Dans sa brochure de campagne, Nathalie Arthaud écrit : « Nous devons imposer une augmentation massive des salaires, des allocations et des pensions ». Elle demande aussi leur indexation sur la hausse des prix. Selon le texte, quand les prix montent, le salaire doit suivre. Le texte ne précise ni le montant de l'augmentation, ni l'indice de prix qui servirait de référence, ni la manière dont cette hausse serait financée. Il ne dit pas non plus qui serait chargé de l'appliquer ni à partir de quelle date.
  enfant: >-
    Nathalie Arthaud veut une forte hausse des salaires. Elle veut aussi plus d'argent pour les aides et les [[pensions|pension]]. Quand les prix montent, le salaire doit suivre. Le salaire, c'est l'argent que l'on gagne en travaillant. Le texte ne dit pas de combien ce serait. Il ne dit pas qui paierait.
  aine: >-
    Nathalie Arthaud écrit, dans sa brochure de campagne : « Nous devons imposer une augmentation massive des salaires, des allocations et des pensions ». Elle demande que cette hausse suive celle des prix. Selon le texte, quand les prix montent, le salaire doit suivre. Le texte ne dit pas de combien les salaires, les allocations et les pensions augmenteraient. Il ne dit pas non plus comment cette hausse serait payée, ni à partir de quelle date elle s'appliquerait.
statut_relecture: brouillon
