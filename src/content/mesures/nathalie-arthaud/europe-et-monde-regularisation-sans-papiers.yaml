version_schema: 1
id: nathalie-arthaud/europe-et-monde-regularisation-sans-papiers
candidat: nathalie-arthaud
theme: europe-et-monde
sous_theme: immigration-et-asile
titre: "Régularisation des sans-papiers et liberté de circulation"
texte_source: >-
  À bas les barbelés, les traques, les expulsions ! À bas l’Europe-forteresse ! Régularisation de
  tous les sans-papiers, liberté de circulation et d’installation pour chaque être humain de cette
  planète !
source: nathalie-arthaud-brochure-campagne
source_localisation: "brochure de campagne, page 14 (numérotation imprimée)"
redactions:
  resume: >-
    Nathalie Arthaud demande la régularisation de tous les sans-papiers et la liberté de circulation
    et d’installation pour chaque être humain.
  detaille: >-
    Dans sa brochure de campagne, Nathalie Arthaud écrit : « Régularisation de tous les
    sans-papiers, liberté de circulation et d’installation pour chaque être humain de cette planète
    ». Ce passage suit des refus introduits par « À bas » : les barbelés, les traques, les
    expulsions, puis l’Europe-forteresse. La demande porte donc, d’une part, sur la régularisation
    de tous les sans-papiers et, d’autre part, sur la liberté de circulation et d’installation pour
    chaque être humain. Le texte ne précise pas par quelle loi la régularisation serait faite, ni à
    quelle date, ni selon quelles conditions. Il ne donne aucun chiffre.
  enfant: >-
    Nathalie Arthaud veut des papiers en règle pour tous les [[sans-papiers]]. Cela s’appelle la
    régularisation. Elle veut aussi la liberté de circuler et de s’installer. Cela vaudrait pour
    chaque être humain de la planète. Le texte ne dit pas comment cela serait fait.
  aine: >-
    Dans sa brochure de campagne, Nathalie Arthaud écrit « À bas les barbelés, les traques, les
    expulsions » et « À bas l’Europe-forteresse ». Elle demande la régularisation de tous les
    sans-papiers, ainsi que la liberté de circulation et d’installation pour chaque être humain de
    la planète. Le texte ne dit ni par quelle loi ni à quelle date ces mesures seraient mises en
    place, ni selon quelles conditions. Il ne donne aucun chiffre.
statut_relecture: brouillon
