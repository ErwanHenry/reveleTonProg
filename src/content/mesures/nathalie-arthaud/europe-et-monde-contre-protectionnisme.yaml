version_schema: 1
id: nathalie-arthaud/europe-et-monde-contre-protectionnisme
candidat: nathalie-arthaud
theme: europe-et-monde
sous_theme: commerce-et-protectionnisme
titre: "Opposition au protectionnisme"
texte_source: >-
  Le protectionnisme ne protège ni l’emploi ni les salaires, il est une arme des capitalistes dans
  leur guerre contre d’autres capitalistes.
source: nathalie-arthaud-brochure-campagne
source_localisation: "brochure de campagne, page 16 (numérotation imprimée), rubrique Contre le protectionnisme"
redactions:
  resume: >-
    Nathalie Arthaud s’oppose au protectionnisme : selon elle, il ne protège ni l’emploi ni les
    salaires.
  detaille: >-
    Dans une rubrique de sa brochure de campagne consacrée au protectionnisme, Nathalie Arthaud
    écrit : « Le protectionnisme ne protège ni l’emploi ni les salaires, il est une arme des
    capitalistes dans leur guerre contre d’autres capitalistes ». C’est une prise de position qui
    rejette le protectionnisme, et non une liste de mesures. Le passage cité ne dit pas quelles
    règles de commerce elle voudrait à la place, ni pour quels produits ou quels pays, ni à partir
    de quand. Il ne donne aucun chiffre.
  enfant: >-
    Nathalie Arthaud n’est pas pour le [[protectionnisme]]. Selon elle, il ne protège ni l’emploi ni
    les salaires. Elle écrit que c’est une arme des [[capitalistes|capitaliste]]. Ils sont en guerre
    contre d’autres capitalistes, dit-elle. Le texte ne dit pas ce qu’elle ferait à la place.
  aine: >-
    Dans sa brochure de campagne, Nathalie Arthaud écrit que le protectionnisme ne protège ni
    l’emploi ni les salaires. Elle ajoute qu’il est une arme des capitalistes dans leur guerre
    contre d’autres capitalistes. Elle rejette donc cette politique, sans proposer de mesure précise
    dans ce passage. Le texte cité ne dit pas quelles règles de commerce elle voudrait à la place,
    ni pour quels produits, ni à partir de quand. Il ne donne aucun chiffre.
statut_relecture: brouillon
