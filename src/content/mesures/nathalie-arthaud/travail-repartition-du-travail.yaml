candidat: nathalie-arthaud
theme: travail
sous_theme: temps-de-travail
titre: "Recensement des besoins et répartition du travail entre tous"
texte_source: >-
  Alors, pour que personne ne soit condamné au chômage, il faut recenser les besoins et imposer que le travail soit réparti entre tous.
source: nathalie-arthaud-brochure-campagne
source_localisation: "brochure de campagne, page 10 (numérotation imprimée), rubrique Face au chômage et aux licenciements"
redactions:
  resume: >-
    Nathalie Arthaud veut recenser les besoins et imposer que le travail soit réparti entre tous, pour que personne ne soit condamné au chômage.
  detaille: >-
    Dans sa brochure de campagne, Nathalie Arthaud écrit : « pour que personne ne soit condamné au chômage, il faut recenser les besoins et imposer que le travail soit réparti entre tous ». Elle décrit ainsi une démarche : recenser les besoins, puis imposer une répartition du travail entre toutes les personnes. Le texte ne précise pas qui ferait ce recensement, ni comment la répartition serait imposée, ni si les salaires seraient maintenus. Il ne dit pas non plus dans quels secteurs ni à quelle date cette mesure s'appliquerait.
  enfant: >-
    Nathalie Arthaud veut que personne ne soit au chômage. Être au chômage, c'est ne pas avoir d'emploi. Pour cela, il faut d'abord compter les besoins. Ensuite, le travail doit être partagé entre tous. Le texte ne dit pas qui compterait. Il ne dit pas comment ce partage serait imposé.
  aine: >-
    Nathalie Arthaud écrit, dans sa brochure de campagne, que pour que personne ne soit condamné au chômage, il faut recenser les besoins et imposer que le travail soit réparti entre tous. Il s'agit d'abord de compter les besoins, puis de répartir le travail entre toutes les personnes. Le texte ne dit pas qui ferait ce recensement, ni comment la répartition serait imposée, ni si les salaires resteraient les mêmes. Il ne donne pas de date.
statut_relecture: brouillon
