version_schema: 1
id: erwan-rohou/sante-usagers-conseil-administration
candidat: erwan-rohou
theme: sante
sous_theme: gouvernance-sante
titre: "Entrée des usagers dans le conseil d'administration des assurances sociales"
texte_source: >-
  Les usagers (association de chômeurs à l'UNEDIC, association de patients à l'assurance maladie …) sont introduits dans le conseil d'administration des assurances sociales, au côté des représentants des salariés et du patronat.
source: erwan-rohou-programme-mei
source_localisation: "proposition n° 38 du programme"
redactions:
  resume: >-
    Le programme du mouvement d'Erwan Rohou veut faire entrer les usagers, dont des associations de patients, dans le conseil d'administration des assurances sociales.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est le candidat selon l'accueil du mouvement, propose d'introduire les usagers dans le conseil d'administration des assurances sociales, au côté des représentants des salariés et du patronat. Il donne des exemples : une association de chômeurs à l'assurance chômage et une association de patients à l'assurance maladie. Le texte ne précise pas combien de sièges leur reviendraient, comment ces associations seraient choisies, ni quelles décisions elles pourraient prendre.
  enfant: >-
    Le programme du mouvement d'Erwan Rohou veut des usagers dans les assurances sociales. Les usagers sont les personnes qui utilisent ces services. Par exemple, des patients de l'[[assurance maladie]]. Ils siégeraient au [[conseil d'administration|conseil-d-administration]]. Ils y seraient avec les représentants des salariés et des employeurs.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est présenté comme le candidat sur la page d'accueil du mouvement, propose que les usagers entrent dans le conseil d'administration des assurances sociales, aux côtés des représentants des salariés et du patronat. Le texte cite en exemple une association de chômeurs et une association de patients de l'assurance maladie. Il ne précise ni le nombre de sièges, ni le mode de désignation de ces représentants.
statut_relecture: brouillon
