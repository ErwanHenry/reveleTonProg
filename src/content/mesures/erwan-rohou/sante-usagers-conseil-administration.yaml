id: erwan-rohou/sante-usagers-conseil-administration
candidat: erwan-rohou
theme: sante
sous_theme: gouvernance-sante
titre: "Entrée des usagers dans le conseil d'administration des assurances sociales"
texte_source: >-
  Les usagers (association de chômeurs à l'UNEDIC, association de patients à l'assurance maladie …) sont introduits dans le conseil d'administration des assurances sociales, au côté des représentants des salariés et du patronat.
source: erwan-rohou-programme-mei
source_localisation: "proposition n° 39 du programme"
redactions:
  resume: >-
    Son parti, le Mouvement Écologiste Indépendant, veut faire entrer les usagers, dont des associations de patients, dans le conseil d'administration des assurances sociales.
  detaille: >-
    Son parti, le Mouvement Écologiste Indépendant, propose dans son programme d'introduire les usagers dans le conseil d'administration des assurances sociales, au côté des représentants des salariés et du patronat. Il donne des exemples : une association de chômeurs à l'UNEDIC et une association de patients à l'assurance maladie. La proposition figure dans la partie du programme intitulée La démocratie pour construire le compromis. Le texte ne précise pas combien de sièges leur reviendraient, comment ces associations seraient choisies, ni quelles décisions elles pourraient prendre.
  enfant: >-
    Son parti a fait un programme. Il veut des usagers dans les assurances sociales. Les usagers sont les personnes qui utilisent ces services. Par exemple, une association de patients à l'[[assurance maladie]]. Ils siégeraient au [[conseil d'administration|conseil-d-administration]]. Ils y seraient avec les représentants des salariés et des employeurs.
  aine: >-
    Son parti, le Mouvement Écologiste Indépendant, propose dans son programme que les usagers entrent dans le conseil d'administration des assurances sociales, aux côtés des représentants des salariés et du patronat. Le texte cite en exemple une association de chômeurs et une association de patients de l'assurance maladie. Il ne précise ni le nombre de sièges, ni le mode de désignation de ces représentants.
statut_relecture: relu
relecteur: l'agent d'IA Claude
date_relecture: 2026-11-17
