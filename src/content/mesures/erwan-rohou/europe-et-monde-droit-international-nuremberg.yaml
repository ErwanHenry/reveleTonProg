version_schema: 1
id: erwan-rohou/europe-et-monde-droit-international-nuremberg
candidat: erwan-rohou
theme: europe-et-monde
sous_theme: diplomatie-et-multilateralisme
titre: "Droit international et compétences du Tribunal International"
texte_source: >-
  L’élaboration d’un droit international à partir des prémisses de Nuremberg est une priorité. Les compétences du Tribunal International sont élargies aux délits écologiques, dès lors que l’avenir de l’Humanité est affecté. Nous contribuons par nos moyens militaires à l’application de ce droit, sous l’égide des Nations Unies.
source: erwan-rohou-programme-mei
source_localisation: "section La nécessité d'une gouvernance mondiale et le respect du droit, proposition n° 31"
redactions:
  resume: >-
    Le programme du mouvement d'Erwan Rohou fait de l'élaboration d'un droit international une priorité et élargit le Tribunal International aux délits écologiques.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est le candidat selon l'accueil du mouvement, écrit que « L’élaboration d’un droit international à partir des prémisses de Nuremberg est une priorité ». Les compétences du Tribunal International seraient élargies aux délits écologiques, dès lors que l'avenir de l'Humanité est affecté. Le texte ajoute : « Nous contribuons par nos moyens militaires à l’application de ce droit, sous l’égide des Nations Unies ». Il ne précise ni la liste des délits écologiques, ni les moyens militaires concernés, ni la date. Il ne donne aucun coût.
  enfant: >-
    Le programme d'Erwan Rohou veut un [[droit international]]. Il part de Nuremberg. C'est une priorité. Le Tribunal International jugerait aussi les délits écologiques. La France aiderait à le faire appliquer, avec ses moyens militaires. Le texte ne dit pas quand.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est présenté comme le candidat, fait de l'élaboration d'un droit international une priorité, à partir des prémisses de Nuremberg. Les compétences du Tribunal International seraient élargies aux délits écologiques, dès lors que l'avenir de l'Humanité est affecté. La France contribuerait par ses moyens militaires à l'application de ce droit, sous l'égide des Nations Unies. Le texte ne donne ni calendrier ni coût.
statut_relecture: brouillon
