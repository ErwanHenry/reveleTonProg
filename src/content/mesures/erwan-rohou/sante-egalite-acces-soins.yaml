id: erwan-rohou/sante-egalite-acces-soins
candidat: erwan-rohou
theme: sante
sous_theme: acces-aux-soins
titre: "Accès aux soins parmi les quatre égalités fondamentales à garantir"
texte_source: >-
  Les quatre égalités fondamentales à garantir sont l'accès aux soins (sans ignorer la nécessité de contenir les dépenses), à une alimentation de qualité, à l'école et au logement.
source: erwan-rohou-programme-mei
source_localisation: "proposition n° 6 du programme"
redactions:
  resume: >-
    Le programme du mouvement d'Erwan Rohou place l'accès aux soins parmi quatre égalités à garantir, en contenant les dépenses.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est le candidat selon l'accueil du mouvement, énumère quatre égalités fondamentales à garantir : l'accès aux soins, à une alimentation de qualité, à l'école et au logement. Il précise pour les soins qu'il ne faut pas ignorer la nécessité de contenir les dépenses. Le texte ne dit pas comment l'accès aux soins serait garanti, par quels moyens ni à quelle date. Il ne chiffre pas la limite de dépenses.
  enfant: >-
    Le programme du mouvement d'Erwan Rohou cite quatre égalités à garantir. Parmi elles, il y a l'accès aux soins. Il y a aussi une alimentation de qualité, l'école et le logement. Le texte ajoute qu'il faut contenir les dépenses. Il ne dit pas comment.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est présenté comme le candidat sur la page d'accueil du mouvement, cite quatre égalités fondamentales à garantir : l'accès aux soins, à une alimentation de qualité, à l'école et au logement. Pour les soins, le texte ajoute qu'il faut tenir compte de la nécessité de contenir les dépenses. Il ne précise ni les moyens, ni le calendrier, ni le niveau de dépenses visé.
statut_relecture: brouillon
