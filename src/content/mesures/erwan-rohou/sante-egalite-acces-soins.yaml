titre: "Accès aux soins parmi les quatre égalités fondamentales à garantir"
texte_source: >-
  Les quatre égalités fondamentales à garantir sont l'accès aux soins (sans ignorer la nécessité de contenir les dépenses), à une alimentation de qualité, à l'école et au logement.
source: erwan-rohou-programme-mei
source_localisation: "proposition n° 6 du programme"
redactions:
  resume: >-
    Son parti, le Mouvement Écologiste Indépendant, place l'accès aux soins parmi quatre égalités à garantir, sans ignorer la nécessité de contenir les dépenses.
  detaille: >-
    Son parti, le Mouvement Écologiste Indépendant, énumère dans son programme quatre égalités fondamentales à garantir : l'accès aux soins, à une alimentation de qualité, à l'école et au logement. Il précise pour les soins qu'il ne faut pas ignorer la nécessité de contenir les dépenses. La proposition figure dans la partie du programme intitulée Consolider le lien social. Le texte ne dit pas comment l'accès aux soins serait garanti, par quels moyens ni à quelle date. Cette proposition ne donne aucun chiffre.
  enfant: >-
    Son parti a fait un programme. Il dit qu'il faut garantir quatre égalités. Parmi elles, il y a l'accès aux soins. Il y a aussi une alimentation de qualité, l'école et le logement. Pour les soins, le texte ajoute qu'il faut aussi contenir les dépenses. Il ne dit pas comment.
  aine: >-
    Son parti, le Mouvement Écologiste Indépendant, cite dans son programme quatre égalités fondamentales à garantir : l'accès aux soins, à une alimentation de qualité, à l'école et au logement. Pour les soins, le texte ajoute qu'il faut tenir compte de la nécessité de contenir les dépenses. Il ne précise ni les moyens, ni le calendrier, ni le niveau de dépenses visé.
