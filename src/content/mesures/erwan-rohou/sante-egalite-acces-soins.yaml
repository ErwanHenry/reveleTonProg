candidat: erwan-rohou
theme: sante
sous_theme: acces-aux-soins
titre: "Accès aux soins parmi les quatre égalités fondamentales à garantir"
texte_source: >-
  Les quatre égalités fondamentales à garantir sont l'accès aux soins (sans ignorer la nécessité de contenir les dépenses), à une alimentation de qualité, à l'école et au logement.
source: erwan-rohou-programme-mei
source_localisation: "proposition n° 6 du programme"
redactions:
  resume: >-
    Le programme du Mouvement des Écologistes Indépendants place l'accès aux soins parmi quatre égalités à garantir, sans ignorer la nécessité de contenir les dépenses.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants énumère quatre égalités fondamentales à garantir : l'accès aux soins, à une alimentation de qualité, à l'école et au logement. Il précise pour les soins qu'il ne faut pas ignorer la nécessité de contenir les dépenses. La proposition figure dans la partie du programme intitulée Consolider le lien social. Le texte ne dit pas comment l'accès aux soins serait garanti, par quels moyens ni à quelle date. Cette proposition ne donne aucun chiffre.
  enfant: >-
    Le Mouvement des Écologistes Indépendants a fait un programme. Il dit qu'il faut garantir quatre égalités. Parmi elles, il y a l'accès aux soins. Il y a aussi une alimentation de qualité, l'école et le logement. Le texte ajoute qu'il faut contenir les dépenses. Il ne dit pas comment.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants cite quatre égalités fondamentales à garantir : l'accès aux soins, à une alimentation de qualité, à l'école et au logement. Pour les soins, le texte ajoute qu'il faut tenir compte de la nécessité de contenir les dépenses. Il ne précise ni les moyens, ni le calendrier, ni le niveau de dépenses visé.
statut_relecture: brouillon
