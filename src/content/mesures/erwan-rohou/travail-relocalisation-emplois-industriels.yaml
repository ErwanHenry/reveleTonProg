id: erwan-rohou/travail-relocalisation-emplois-industriels
candidat: erwan-rohou
theme: travail
sous_theme: chomage-et-emploi
titre: "Relocalisation de l'économie et emplois industriels"
texte_source: >-
  Le retour des productions de biens de base doit être un objectif de la politique économique : il s'agit de "relocaliser l'économie", à la fois pour réduire les coûts de transport, sécuriser l'approvisionnement du pays et conforter sa souveraineté : cette démarche restituera aussi des emplois industriels à la France.
source: erwan-rohou-programme-mei
source_localisation: "section Assurer le plein emploi sans croissance, proposition n° 1"
redactions:
  resume: >-
    Le programme du mouvement d'Erwan Rohou veut relocaliser l'économie, ce qui restituerait aussi des emplois industriels à la France.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est le candidat selon l'accueil du mouvement, place le retour des productions de biens de base comme objectif de la politique économique. Le texte parle de relocaliser l'économie, à la fois pour réduire les coûts de transport, sécuriser l'approvisionnement du pays et conforter sa souveraineté. Il ajoute que cette démarche restituera aussi des emplois industriels à la France. Le texte ne dit pas quels biens seraient concernés, ni combien d'emplois seraient créés, ni à quelle date.
  enfant: >-
    Le programme d'Erwan Rohou veut produire en France les biens de base. Cela réduirait les coûts de transport. Le pays serait sûr de recevoir ses produits. Cela redonnerait aussi des emplois dans l'industrie à la France. Le texte ne dit pas combien d'emplois.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est présenté comme le candidat sur la page d'accueil du mouvement, fait du retour des productions de biens de base un objectif de la politique économique. Il s'agit de relocaliser l'économie pour réduire les coûts de transport, sécuriser l'approvisionnement du pays et conforter sa souveraineté. Le texte ajoute que cette démarche restituera aussi des emplois industriels à la France. Il ne précise ni les biens concernés, ni le nombre d'emplois, ni le calendrier.
statut_relecture: brouillon
