titre: "Soutien aux petites entreprises et réhabilitation du travail manuel qualifié"
texte_source: >-
  Les dispositifs d'aide au développement et à la pérennité du tissu des TPE et des PME seront renforcés. Le travail manuel qualifié sera socialement réhabilité.
source: erwan-rohou-programme-mei
source_localisation: "section Assurer le plein emploi sans croissance, proposition n° 2"
redactions:
  resume: >-
    Le programme du mouvement d'Erwan Rohou veut renforcer les aides aux petites entreprises et réhabiliter socialement le travail manuel qualifié.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est le candidat selon l'accueil du mouvement, écrit que les dispositifs d'aide au développement et à la pérennité du tissu des TPE et des PME seront renforcés, c'est-à-dire des très petites, petites et moyennes entreprises. Il ajoute que le travail manuel qualifié sera socialement réhabilité. Le texte ne dit pas quelles aides seraient renforcées ni de combien, ni comment le travail manuel qualifié serait réhabilité, ni à quelle date.
  enfant: >-
    Le programme d'Erwan Rohou veut plus d'aides pour les entreprises petites ou moyennes. Il veut aussi redonner de la valeur au travail manuel qualifié. Le texte ne dit pas quelles aides seraient données. Il ne dit pas comment on y arriverait.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est présenté comme le candidat sur la page d'accueil du mouvement, écrit que les aides au développement et à la pérennité des très petites, petites et moyennes entreprises seront renforcées. Il ajoute que le travail manuel qualifié sera socialement réhabilité. Le texte ne précise ni la nature ni le montant des aides, ni les moyens de cette réhabilitation, ni le calendrier.
statut_relecture: brouillon
