titre: "Siège des Nations Unies à Oslo et réforme des statuts"
texte_source: >-
  Le siège des Nations Unies est transféré à Oslo afin de marquer l’indépendance de cette organisation vis-à-vis des Etats-Unis. Ses statuts sont modifiés pour rendre plus démocratiques les prises de décision et élargir ainsi sa légitimité. Le droit de veto est reconsidéré dans ses modalités.
source: erwan-rohou-programme-mei
source_localisation: "section La nécessité d'une gouvernance mondiale et le respect du droit, proposition n° 30"
redactions:
  resume: >-
    Le programme du mouvement d'Erwan Rohou transfère le siège des Nations Unies à Oslo et modifie ses statuts pour rendre les décisions plus démocratiques.
  detaille: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est le candidat selon l'accueil du mouvement, propose que le siège des Nations Unies soit transféré à Oslo « afin de marquer l’indépendance de cette organisation vis-à-vis des Etats-Unis ». Les statuts seraient modifiés pour rendre plus démocratiques les prises de décision et élargir la légitimité de l'organisation. Le texte ajoute que le droit de veto serait reconsidéré dans ses modalités. Il ne précise ni comment ces changements seraient obtenus, ni quels pays devraient les approuver, ni la date. Il ne donne aucun coût.
  enfant: >-
    Le programme d'Erwan Rohou veut déplacer le siège des [[Nations unies|nations-unies]] à Oslo. Le but est de montrer leur indépendance vis-à-vis des États-Unis. Les règles de l'organisation changeraient pour des décisions plus démocratiques. Le droit de veto serait revu. Le texte ne dit pas comment ni quand.
  aine: >-
    Dans son programme, le Mouvement des Écologistes Indépendants, dont Erwan Rohou est présenté comme le candidat, propose de transférer le siège des Nations Unies à Oslo, pour marquer l'indépendance de cette organisation vis-à-vis des États-Unis. Ses statuts seraient modifiés pour rendre les prises de décision plus démocratiques et élargir sa légitimité. Le droit de veto serait reconsidéré dans ses modalités. Le texte ne précise ni la manière d'y parvenir, ni la date.
