titre: "Europe en trois cercles"
texte_source: >-
  Nous avons besoin d’une Europe des 3 cercles, claire, démocratique et puissante. Un premier
  cercle à fonder, un noyau dur d’États prêts à aller plus loin pour bâtir une véritable puissance
  politique. Un deuxième cercle, l’Union à 27, dont le marché reste notre prospérité.
source: olivier-becht-livre-partie-9
source_localisation: "partie 9 Un nouveau modèle de rayonnement, section Une nouvelle Europe, page 9 du PDF"
redactions:
  resume: >-
    Olivier Becht veut une Europe des 3 cercles, claire, démocratique et puissante, avec un noyau
    dur d’États et l’Union à 27.
  detaille: >-
    Dans son livre, Olivier Becht écrit : « Nous avons besoin d’une Europe des 3 cercles, claire,
    démocratique et puissante ». Le premier cercle est « à fonder » : « un noyau dur d’États prêts à
    aller plus loin pour bâtir une véritable puissance politique ». Le deuxième cercle est « l’Union
    à 27, dont le marché reste notre prospérité ». Le passage cité annonce 3 cercles mais ne décrit
    que le premier et le deuxième. Il ne précise pas quels États formeraient le noyau dur, ni
    comment il serait créé, ni à quelle date. Aucun coût n’est donné.
  enfant: >-
    Olivier Becht veut une Europe des 3 cercles. Elle serait claire, démocratique et puissante. Le
    premier cercle serait un petit groupe d’États prêts à aller plus loin. Le deuxième serait
    l’[[Union européenne]] à 27. Selon lui, son marché reste notre [[prospérité]].
  aine: >-
    Olivier Becht écrit dans son livre qu’il faut une Europe des 3 cercles, claire, démocratique et
    puissante. Le premier cercle reste à fonder : un noyau dur d’États prêts à aller plus loin, pour
    bâtir une véritable puissance politique. Le deuxième cercle est l’Union européenne à 27, dont le
    marché reste, selon lui, la prospérité. Le texte cité annonce 3 cercles mais ne décrit que le
    premier et le deuxième, et ne dit pas quels États formeraient le premier cercle.
