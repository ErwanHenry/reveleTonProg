titre: "Priorité à la prévention et cours d'hygiène et de santé dès le plus jeune âge"
texte_source: >-
  Ce nouveau modèle donnera la priorité à la prévention, aujourd’hui trop souvent reléguée au second plan. Des cours d’hygiène et de santé seront dispensés dès le plus jeune âge, ainsi qu’une véritable politique de sensibilisation à l’activité sportive, aux addictions et à une alimentation saine et responsable, pour agir en amont plutôt que d’en subir les conséquences.
source: olivier-becht-refondation-sante
source_localisation: "page La santé des 5 refondations, section Un nouveau modèle de prévention"
