  detaille: >-
    Olivier Becht écrit que son modèle de santé donnera la priorité à la prévention, qu'il juge aujourd'hui trop souvent reléguée au second plan. Il prévoit des cours d'hygiène et de santé dès le plus jeune âge. Il prévoit aussi une politique de sensibilisation à l'activité sportive, aux addictions et à une alimentation saine et responsable. L'objectif indiqué est d'agir en amont plutôt que d'en subir les conséquences. Le texte ne précise pas à quel âge commenceraient ces cours, qui les donnerait, ni quel budget serait consacré à la prévention.
