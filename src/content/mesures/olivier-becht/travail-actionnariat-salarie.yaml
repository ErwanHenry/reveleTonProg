titre: "Salariés actionnaires de leur entreprise, intéressement et participation renforcés"
texte_source: >-
  Plutôt que d’alourdir sans cesse l’impôt sur ceux qui investissent, au risque de les voir partir et d’aggraver notre retard, nous associerons les salariés à la valeur qu’ils créent en les faisant devenir actionnaires de leur entreprise. Nous renforcerons l’intéressement et la participation, jusqu’à l’actionnariat salarié, sans droit de vote en assemblée pour sécuriser les PME mais avec une voix au conseil d’administration, et nous lèverons l’obligation de bloquer les fonds cinq ans.
source: olivier-becht-livre-partie-4
source_localisation: "livre Projet France, partie 4, rubrique sur l'augmentation du pouvoir d'achat"
redactions:
  resume: >-
    Olivier Becht veut associer les salariés à la valeur qu'ils créent en les faisant devenir actionnaires, et renforcer l'intéressement et la participation.
  detaille: >-
    Dans une partie de son livre Projet France, Olivier Becht écrit que plutôt que d'alourdir sans cesse l'impôt sur ceux qui investissent, il associera les salariés à la valeur qu'ils créent, en les faisant devenir actionnaires de leur entreprise. Il veut renforcer l'intéressement et la participation, jusqu'à l'actionnariat salarié, sans droit de vote en assemblée pour sécuriser les petites et moyennes entreprises, mais avec une voix au conseil d'administration. Il veut aussi lever l'obligation de bloquer les fonds cinq ans. Le texte ne précise ni la part du capital concernée ni la date de mise en oeuvre.
  enfant: >-
    Olivier Becht veut que les salariés deviennent [[actionnaires|actionnaire]] de leur entreprise. Il veut aussi plus d'[[intéressement|interessement]]. Les salariés auraient une voix au [[conseil d'administration|conseil-d-administration]]. Leur argent ne serait plus bloqué cinq ans. Le texte ne dit pas quelle part ils auraient.
  aine: >-
    Dans une partie de son livre Projet France, Olivier Becht propose de faire devenir les salariés actionnaires de leur entreprise, plutôt que d'alourdir l'impôt sur ceux qui investissent. Il veut renforcer l'intéressement et la participation, jusqu'à l'actionnariat salarié. Cet actionnariat n'ouvrirait pas de droit de vote en assemblée, mais donnerait une voix au conseil d'administration. L'obligation de bloquer les fonds pendant cinq ans serait levée. Le texte ne dit pas quelle part du capital serait détenue par les salariés ni à partir de quand.
