sous_theme: construction-europeenne
titre: "Confédération européenne"
texte_source: >-
  Seul le premier cercle est à créer, et ce serait une révolution : une véritable Confédération.
  Contrairement à la Fédération, qui absorbe ses États, la Confédération respecterait leur
  indépendance tout en formant un ensemble capable de déployer une puissance technologique,
  économique, diplomatique et militaire face aux États-Unis, à la Chine et à la Russie.
source: olivier-becht-livre-partie-9
source_localisation: "partie 9 Un nouveau modèle de rayonnement, section Une Confédération européenne, page 10 du PDF"
redactions:
  resume: >-
    Olivier Becht veut créer une véritable Confédération : le premier cercle de son Europe, qui
    respecterait l’indépendance de ses États.
  detaille: >-
    Olivier Becht écrit : « Seul le premier cercle est à créer, et ce serait une révolution : une
    véritable Confédération ». Il oppose la Confédération à la Fédération, « qui absorbe ses États »
    : la Confédération « respecterait leur indépendance tout en formant un ensemble capable de
    déployer une puissance technologique, économique, diplomatique et militaire face aux États-Unis,
    à la Chine et à la Russie ». Le passage cité ne précise pas quels États en feraient partie, ni à
    quelle date elle serait créée. Il ne donne aucun chiffre.
  enfant: >-
    Olivier Becht veut créer une [[Confédération]] européenne. Chaque État y garde son indépendance.
    Tous ensemble, ils seraient forts en technologie, en économie et en diplomatie. Ils seraient
    forts aussi pour l’armée. Le texte ne dit pas quels pays en feraient partie.
  aine: >-
    Olivier Becht écrit que seul le premier cercle de son Europe est à créer, et qu’il s’agirait
    d’une véritable Confédération. À la différence d’une Fédération, qui absorbe ses États, elle
    respecterait leur indépendance. Elle formerait un ensemble capable de déployer une puissance
    technologique, économique, diplomatique et militaire face aux États-Unis, à la Chine et à la
    Russie. Le texte cité ne dit pas quels États en feraient partie, ni quand elle serait créée.
statut_relecture: brouillon
