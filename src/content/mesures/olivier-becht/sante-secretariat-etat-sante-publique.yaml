titre: "Secrétariat d'État à la santé publique et fusion des cinq grandes agences"
texte_source: >-
  Le système de santé doit être repensé de fond en comble et doit être élevé au rang de priorité régalienne, car il est une part de la sécurité des Français. Cela suppose une organisation centrée sur l’humain et plus responsable. Un secrétariat d’État à la santé publique fusionnera les cinq grandes agences existantes sous un même contrat d’objectifs, pour mettre fin à l’éparpillement des responsabilités et donner enfin de la cohérence à notre politique de santé.
source: olivier-becht-refondation-sante
source_localisation: "page La santé des 5 refondations, section Une priorité régalienne"
redactions:
  resume: >-
    Olivier Becht veut un secrétariat d'État à la santé publique qui fusionnerait les cinq grandes agences existantes sous un même contrat d'objectifs.
  detaille: >-
    Dans la page consacrée à la santé de ses cinq refondations, Olivier Becht écrit que le système de santé doit être repensé de fond en comble et élevé au rang de priorité régalienne, car il fait partie de la sécurité des Français. Il propose une organisation centrée sur l'humain et plus responsable. Un secrétariat d'État à la santé publique fusionnerait les cinq grandes agences existantes sous un même contrat d'objectifs, afin de mettre fin à l'éparpillement des responsabilités. Le texte ne nomme pas les cinq agences, ne donne pas le calendrier de la fusion et n'en indique ni le coût ni les économies attendues.
  enfant: >-
    Olivier Becht veut faire de la santé une priorité de l'État. Il veut créer un [[secrétariat d'État|secretariat-d-etat]] à la santé publique. Il réunirait les cinq grandes agences. Elles auraient un seul contrat d'objectifs. Il veut ainsi ne plus disperser les responsabilités.
  aine: >-
    Olivier Becht écrit que le système de santé doit être repensé de fond en comble. Il veut l'élever au rang de priorité régalienne, c'est-à-dire de mission essentielle de l'État, car il fait partie de la sécurité des Français. Il propose un secrétariat d'État à la santé publique, qui fusionnerait les cinq grandes agences existantes sous un même contrat d'objectifs. Le texte ne nomme pas ces agences et ne donne ni calendrier ni coût.
