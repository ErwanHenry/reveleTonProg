candidat: olivier-becht
theme: travail
sous_theme: droit-du-travail
titre: "Contrat unique de travail"
texte_source: >-
  Lors de la vie active, nous proposons un élément absolument essentiel pour assurer la sécurité de tous et qui vient remplacer tous les contrats que nous connaissons aujourd’hui : le contrat unique. Celui-ci est fondé sur les notions d’engagement et de réciprocité pour chaque Française et Français. Il s’agit en quelques mots d’un contrat de travail qui nous suit toute notre vie, transférable d’un établissement à un autre, qui nous garantit un revenu permanent jamais en deçà du salaire minimum.
source: olivier-becht-refondation-sociale
source_localisation: "page La refondation sociale, section Refonder la société autour d'un Contrat unique de travail"
redactions:
  resume: >-
    Olivier Becht propose un contrat unique de travail, transférable d'un établissement à un autre, avec un revenu jamais en deçà du salaire minimum.
  detaille: >-
    Sur la page de son projet consacrée à la refondation sociale, Olivier Becht propose un « contrat unique », qui viendrait remplacer tous les contrats que nous connaissons aujourd'hui. Le texte le décrit comme un contrat de travail qui nous suit toute notre vie, transférable d'un établissement à un autre, et qui garantit un revenu permanent jamais en deçà du salaire minimum. Il serait fondé sur les notions d'engagement et de réciprocité. Le programme ne précise pas qui paierait ce revenu permanent, ni ce qui se passerait en cas de perte d'emploi. Il ne donne pas de date.
  enfant: >-
    Olivier Becht veut un seul contrat de travail pour tout le monde. Il remplacerait tous les contrats d'aujourd'hui. Ce contrat suivrait la personne toute sa vie. Il passerait d'un lieu de travail à un autre. Le revenu ne serait jamais plus bas que le salaire minimum. Le texte ne dit pas qui paierait.
  aine: >-
    Sur la page de son projet consacrée à la refondation sociale, Olivier Becht propose un contrat unique, qui remplacerait tous les contrats actuels. Ce contrat de travail suivrait chacun toute sa vie et serait transférable d'un établissement à un autre. Il garantirait un revenu permanent, jamais en deçà du salaire minimum. Le texte ne dit pas qui financerait ce revenu, ni ce qui se passerait si une personne perd son emploi, ni à partir de quelle date ce contrat existerait.
