titre: "Soutien aux TPE, PME et artisans : baisse des charges"
texte_source: >-
  Soutien aux TPE/PME et artisans : Baisse drastique des charges et fin de la concurrence déloyale des multinationales.
source: francis-lalanne-programme
source_localisation: "page Le Projet, axe 5 (impôts), troisième ligne"
redactions:
  resume: >-
    Francis Lalanne propose un soutien aux TPE, PME et artisans, avec une baisse drastique des charges.
  detaille: >-
    Dans le projet de la campagne de Francis Lalanne, un soutien aux TPE, aux PME et aux artisans est annoncé. Il comprend une baisse drastique des charges et la fin de la concurrence déloyale des multinationales. Le texte tient en une seule ligne. Le programme ne précise pas de quelles charges il s'agit, de quel montant elles baisseraient, ni par quels moyens la concurrence des multinationales serait traitée. Il ne donne pas non plus de date pour cette mesure.
  enfant: >-
    Francis Lalanne veut aider les petites entreprises et les artisans. Il veut que leurs charges baissent beaucoup. Il veut aussi finir avec ce qu'il appelle une concurrence déloyale. Cela viendrait des grandes entreprises présentes dans plusieurs pays. Le texte ne dit pas comment.
  aine: >-
    Dans le projet de la campagne de Francis Lalanne, un soutien est prévu pour les TPE et PME, c'est-à-dire les très petites, petites et moyennes entreprises, ainsi que pour les artisans. Il comprendrait une baisse drastique des charges et la fin de la concurrence déloyale des multinationales. Le programme ne précise pas de quelles charges il s'agit, ni de combien elles baisseraient, ni comment cette concurrence serait traitée, ni à quelle date.
statut_relecture: brouillon
