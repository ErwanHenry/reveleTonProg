titre: "Sortie de l'OTAN"
texte_source: >-
  Sortie de l'OTAN : Retrouver notre indépendance militaire et diplomatique, refuser de participer aux guerres impérialistes.
source: francis-lalanne-programme
source_localisation: "page Le Projet 2027, axe 1 Souveraineté, deuxième point"
redactions:
  resume: >-
    Francis Lalanne propose de sortir de l'OTAN pour retrouver l'indépendance militaire et diplomatique et refuser de participer aux guerres impérialistes.
  detaille: >-
    Sur la page Le Projet de son site de campagne, dans l'axe Souveraineté, Francis Lalanne propose une « Sortie de l'OTAN : Retrouver notre indépendance militaire et diplomatique, refuser de participer aux guerres impérialistes ». Le texte cité donne pour buts à cette sortie de retrouver l'indépendance militaire et diplomatique et de refuser de participer à des guerres qu'il qualifie d'impérialistes. Il ne précise ni les guerres visées, ni la procédure de sortie, ni la date. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Francis Lalanne veut que la France quitte l'[[Organisation du traité de l'Atlantique Nord|otan]]. Le but est de retrouver sa liberté sur la défense et la diplomatie. Il veut aussi refuser les guerres « impérialistes ». Le texte ne dit pas quelles guerres. Il ne dit pas quand.
  aine: >-
    Sur la page Le Projet de son site de campagne, Francis Lalanne propose de sortir de l'OTAN, l'Organisation du traité de l'Atlantique Nord. Il veut ainsi retrouver l'indépendance militaire et diplomatique de la France et refuser de participer aux guerres impérialistes. Le texte cité ne précise ni les guerres concernées, ni la procédure de sortie, ni la date. Il ne donne aucun chiffre ni aucun coût.
statut_relecture: brouillon
