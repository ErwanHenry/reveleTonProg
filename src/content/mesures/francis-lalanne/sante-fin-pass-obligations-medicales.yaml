titre: "Fin du pass et des obligations médicales, interdiction de la discrimination sur le statut médical"
texte_source: >-
  Fin du pass et des obligations médicales : Interdiction constitutionnelle de toute discrimination basée sur le statut médical.
source: francis-lalanne-programme
source_localisation: "page Le Projet 2027, axe 3 Liberté !, cinquième point"
redactions:
  resume: >-
    Francis Lalanne veut la fin du pass et des obligations médicales, et une interdiction constitutionnelle de la discrimination fondée sur le statut médical.
  detaille: >-
    Sur le site de sa campagne, dans l'axe consacré à la liberté, Francis Lalanne propose la fin du pass et des obligations médicales. Il y ajoute une interdiction constitutionnelle de toute discrimination basée sur le statut médical. Le texte ne précise pas de quel pass il s'agit, quelles obligations médicales sont visées, ni ce que recouvre l'expression statut médical. Il ne dit pas non plus selon quelle procédure l'interdiction serait inscrite dans la Constitution. Le programme ne donne pas de calendrier.
  enfant: >-
    Francis Lalanne veut la fin du pass et des obligations médicales. Il veut aussi écrire dans la [[Constitution]] une règle. Elle interdirait toute [[discrimination]] fondée sur le statut médical. Le texte ne dit pas de quel pass il parle. Il ne dit pas ce que veut dire statut médical.
  aine: >-
    Sur le site de sa campagne, Francis Lalanne propose de mettre fin au pass et aux obligations médicales. Il souhaite aussi l'inscription dans la Constitution d'une interdiction de toute discrimination basée sur le statut médical. Le texte ne dit pas de quel pass il s'agit, ni quelles obligations médicales il vise, ni ce qu'il entend par statut médical.
statut_relecture: brouillon
