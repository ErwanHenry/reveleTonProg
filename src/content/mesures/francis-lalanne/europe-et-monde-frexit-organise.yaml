titre: "Sortie organisée de l'Union européenne"
texte_source: >-
  Frexit organisé : Sortie de l'Union Européenne pour retrouver la maîtrise de nos lois et de nos frontières.
source: francis-lalanne-programme
source_localisation: "page Le Projet 2027, axe 1 Souveraineté, premier point"
redactions:
  resume: >-
    Francis Lalanne propose un Frexit organisé : sortir de l'Union européenne pour retrouver la maîtrise des lois et des frontières.
  detaille: >-
    Sur la page Le Projet de son site de campagne, dans l'axe Souveraineté, Francis Lalanne propose un « Frexit organisé : Sortie de l'Union Européenne pour retrouver la maîtrise de nos lois et de nos frontières ». Le texte cité indique le but de cette sortie : retrouver la maîtrise des lois et des frontières. Il ne précise pas comment la sortie serait organisée, par quelle procédure, ni à quelle date. Il ne dit pas non plus si les Français seraient consultés par un vote. Il ne donne aucun chiffre ni aucun coût.
  enfant: >-
    Francis Lalanne veut que la France quitte l'[[Union européenne|union-europeenne]]. Il appelle cela un « Frexit organisé ». Le but est de retrouver la maîtrise des lois et des frontières. Le texte ne dit pas comment cela serait fait. Il ne dit pas quand.
  aine: >-
    Sur la page Le Projet de son site de campagne, Francis Lalanne propose un Frexit organisé, c'est-à-dire une sortie de l'Union européenne, pour retrouver la maîtrise des lois et des frontières. Le texte cité ne précise ni la procédure de sortie, ni la date, ni la manière dont elle serait organisée. Il ne dit pas non plus si un vote des citoyens serait prévu. Il ne donne aucun chiffre ni aucun coût.
