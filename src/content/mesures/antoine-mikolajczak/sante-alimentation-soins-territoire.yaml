candidat: antoine-mikolajczak
theme: sante
sous_theme: acces-aux-soins
titre: "Accès à une alimentation de qualité et aux soins sur l'ensemble du territoire"
texte_source: >-
  Garantir lʼaccès à une alimentation de qualité et aux soins sur lʼensemble
  du territoire, améliorer la qualité de lʼair, de vie et de travail.
source: antoine-mikolajczak-tract-campagne
source_localisation: "page 1 du tract, rubrique Vivre en bonne santé"
redactions:
  resume: >-
    Antoine Mikolajczak veut garantir l'accès à une alimentation de qualité et aux soins sur l'ensemble du territoire.
  detaille: >-
    Dans le tract de campagne du parti Équinoxe, Antoine Mikolajczak consacre une rubrique à la santé, intitulée Vivre en bonne santé. Elle propose de garantir l'accès à une alimentation de qualité et aux soins sur l'ensemble du territoire. Elle propose aussi d'améliorer la qualité de l'air, de vie et de travail. Le texte ne précise pas comment l'accès aux soins serait garanti, avec quels moyens ni à quelle date. Il ne dit pas ce que recouvre une alimentation de qualité. Il ne donne aucun chiffre.
  enfant: >-
    Antoine Mikolajczak veut garantir l'accès à une alimentation de qualité. Il veut aussi garantir l'accès aux soins sur tout le territoire. Il veut améliorer la qualité de l'air, de vie et de travail. Le tract ne dit pas comment il y arriverait. Il ne donne ni date ni chiffre.
  aine: >-
    Dans le tract de campagne du parti Équinoxe, Antoine Mikolajczak propose, dans une rubrique consacrée à la santé, de garantir l'accès à une alimentation de qualité et aux soins sur l'ensemble du territoire, et d'améliorer la qualité de l'air, de vie et de travail. Le texte ne précise ni les moyens, ni le calendrier, ni le coût de ces orientations, et ne dit pas quelles zones du territoire seraient concernées en priorité.
statut_relecture: brouillon
