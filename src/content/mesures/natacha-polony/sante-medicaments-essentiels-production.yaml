titre: "Production en France des médicaments essentiels"
texte_source: >-
  Produire son énergie. Ses médicaments essentiels. Les machines et les technologies dont dépend notre souveraineté. Produire une alimentation de qualité.
source: natacha-polony-ma-vision
source_localisation: "lettre Ma vision pour la France, paragraphe sur la production, après la phrase sur la puissance industrielle"
redactions:
  resume: >-
    Natacha Polony veut que la France produise ses médicaments essentiels, comme son énergie, ses machines et une alimentation de qualité.
  detaille: >-
    Dans la lettre Ma vision pour la France de son site de campagne, Natacha Polony écrit que la France doit produire son énergie, ses médicaments essentiels, les machines et les technologies dont dépend sa souveraineté, ainsi qu'une alimentation de qualité. Le passage suit une phrase qui fixe une échéance pour que la France ait retrouvé sa puissance industrielle. Le paragraphe suivant ajoute que l'État doit redevenir stratège et planifier les investissements essentiels, sans détail propre aux médicaments. Le texte ne précise pas quels médicaments seraient concernés, ni quelle part de la consommation serait visée.
  enfant: >-
    Natacha Polony veut que la France fabrique ses médicaments essentiels. Elle veut aussi que la France produise son énergie et sa nourriture. Elle cite aussi des machines. Le texte ne dit pas quels médicaments seraient fabriqués. Selon elle, l'État doit faire des plans.
  aine: >-
    Dans la lettre Ma vision pour la France de son site de campagne, Natacha Polony écrit que la France doit produire son énergie, ses médicaments essentiels, les machines et les technologies dont dépend sa souveraineté, et produire une alimentation de qualité. Ce passage suit l'objectif, assorti d'une échéance, de retrouver la puissance industrielle. Le texte ne précise pas quels médicaments seraient fabriqués en France. Il ajoute que l'État doit redevenir stratège et planifier les investissements essentiels, sans détail propre aux médicaments.
