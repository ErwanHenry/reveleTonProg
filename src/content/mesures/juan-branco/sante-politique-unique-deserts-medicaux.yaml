titre: "Politique unique de lutte contre les déserts médicaux dirigée par des centres de santé départementaux"
texte_source: >-
  Fusion des dispositifs de lutte contre les déserts médicaux (maisons de santé, aides à l’installation, contrats d’engagement, primes, zonages, communautés professionnelles territoriales, dispositifs étudiants, guichets régionaux…) en une politique unique, dirigée par des centres de santé départementaux dotés d’antennes, accompagnés d’obligations d’exercice en zones sous-dotées, d’une régulation de l’installation décennale, et la création d’un corps de médecins généralistes et ambulatoires d’État.
source: juan-branco-la-voie-programme
source_localisation: "programme La Voie, section 07 · La Santé , deuxième mesure de la liste"
redactions:
  resume: >-
    Le programme La Voie veut fusionner les dispositifs contre les déserts médicaux en une politique unique, dirigée par des centres de santé départementaux.
  detaille: >-
    Dans le programme La Voie, publié par le mouvement Les Ruches qui soutient Juan Branco, une mesure prévoit de fusionner en une politique unique les dispositifs de lutte contre les déserts médicaux : maisons de santé, aides à l'installation, contrats d'engagement, primes, zonages, communautés professionnelles territoriales, dispositifs étudiants et guichets régionaux. Cette politique serait dirigée par des centres de santé départementaux dotés d'antennes. Le texte y associe des obligations d'exercice en zones sous-dotées, une régulation de l'installation décennale et la création d'un corps de médecins généralistes et ambulatoires d'État. Il ne précise ni le coût, ni le calendrier.
  enfant: >-
    Plusieurs aides existent contre les [[déserts médicaux|desert-medical]]. Le programme La Voie veut les réunir en une seule politique. Des centres de santé la dirigeraient, dans chaque département. Il y aurait des obligations d'exercer là où il manque de médecins. L'État créerait aussi un corps de médecins généralistes.
  aine: >-
    Le programme La Voie, publié par le mouvement Les Ruches qui soutient Juan Branco, veut fusionner en une politique unique les dispositifs de lutte contre les déserts médicaux : maisons de santé, aides à l'installation, primes, zonages, guichets régionaux, entre autres. Cette politique serait dirigée par des centres de santé départementaux dotés d'antennes. Le texte ajoute des obligations d'exercice en zones sous-dotées et la création d'un corps de médecins généralistes et ambulatoires d'État. Il ne donne ni coût ni calendrier.
