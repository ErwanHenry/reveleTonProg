titre: "Intégration aux BRICS"
texte_source: >-
  Intégration aux BRICS en tant que tête de file de l’UPF.
source: juan-branco-la-voie-programme
source_localisation: "section 03 · L’Extérieur et la Défense, deuxième mesure de la liste"
redactions:
  resume: >-
    Le programme du mouvement Les Ruches prévoit une intégration aux BRICS, en tant que tête de file
    de l’UPF.
  detaille: >-
    Dans La Voie, programme du mouvement Les Ruches auquel Juan Branco est associé, on lit : «
    Intégration aux BRICS en tant que tête de file de l’UPF ». Le texte ne précise pas qui serait
    intégré, ni selon quelles conditions, ni à quelle date. Il ne dit pas non plus ce que signifie
    être « tête de file ». L’UPF est l’Union des Pays Francophones, que la mesure précédente de la
    même liste propose de créer. Aucun chiffre ni coût n’est donné.
  enfant: >-
    Le mouvement Les Ruches, qui soutient Juan Branco, propose une intégration aux [[BRICS]]. Ce
    serait « en tant que tête de file » de l’Union des Pays Francophones. Le texte ne dit pas qui
    entrerait dans les BRICS. Il ne dit pas non plus quand.
  aine: >-
    Dans La Voie, programme du mouvement Les Ruches que soutient Juan Branco, on lit une intégration
    aux BRICS, en tant que tête de file de l’UPF, l’Union des Pays Francophones. Les BRICS sont un
    groupe de pays qui coopèrent entre eux. Le texte ne précise pas qui serait intégré, ni selon
    quelles conditions, ni à quelle date, ni ce que signifie être tête de file. Il ne donne aucun
    chiffre ni aucun coût.
statut_relecture: brouillon
