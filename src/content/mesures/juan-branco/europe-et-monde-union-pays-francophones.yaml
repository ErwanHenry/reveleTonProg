candidat: juan-branco
theme: europe-et-monde
sous_theme: diplomatie-et-multilateralisme
titre: "Union des Pays Francophones"
texte_source: >-
  Création d’une Union des Pays Francophones (UPF) remplaçant l’OIF et proposant une intégration
  politico-économique sur le modèle du Commonwealth.
source: juan-branco-la-voie-programme
source_localisation: "section 03 · L’Extérieur et la Défense, première mesure de la liste"
redactions:
  resume: >-
    Le programme La Voie propose de créer une Union des Pays Francophones, qui remplacerait l’OIF,
    sur le modèle du Commonwealth.
  detaille: >-
    Dans La Voie, programme du mouvement Les Ruches auquel Juan Branco est associé, on lit : «
    Création d’une Union des Pays Francophones (UPF) remplaçant l’OIF et proposant une intégration
    politico-économique sur le modèle du Commonwealth ». Le texte ne précise pas quels pays en
    feraient partie, ce que recouvre l’intégration politico-économique, ni comment l’OIF serait
    remplacée, ni à quelle date. Il ne donne aucun chiffre ni coût. Le sigle OIF n’est pas développé
    dans le texte cité.
  enfant: >-
    Le programme des Ruches, que soutient Juan Branco, prévoit une Union des Pays Francophones. Elle
    remplacerait l’[[Organisation internationale de la Francophonie|oif]]. Les pays seraient unis
    par la politique et l’économie. Ce serait comme dans le [[Commonwealth]]. Le texte ne dit pas
    quels pays.
  aine: >-
    Dans La Voie, programme du mouvement Les Ruches que soutient Juan Branco, on lit qu’il faudrait
    créer une Union des Pays Francophones, appelée UPF. Elle remplacerait l’OIF, l’Organisation
    internationale de la Francophonie, et proposerait une intégration politique et économique sur le
    modèle du Commonwealth, un groupe de pays qui coopèrent entre eux. Le texte ne dit pas quels
    pays en feraient partie, ni quand cette union serait créée. Il ne donne aucun chiffre.
statut_relecture: brouillon
