titre: "Grand service public de l'emploi"
texte_source: >-
  Création d’un grand service public de l’emploi, rassemblant les ressources des missions locales, de l’AFPA, GRETA, France Travail, France Compétences et de l’Éducation nationale liées à la formation professionnelle et réformant leur mode de fonctionnement (suppression des formations administratives et commerciales, etc).
source: juan-branco-la-voie-programme
source_localisation: "programme La Voie, section 04 · L'Économie, rubrique Travail, première mesure de la liste"
redactions:
  resume: >-
    La Voie, programme publié par Les Ruches qui soutiennent Juan Branco, prévoit un grand service public de l'emploi.
  detaille: >-
    Le programme La Voie, publié par le mouvement Les Ruches qui soutient Juan Branco, prévoit la création d'un grand service public de l'emploi. Il rassemblerait les ressources des missions locales, de l'AFPA, des GRETA, de France Travail, de France Compétences et de l'Éducation nationale liées à la formation professionnelle. Le texte indique aussi qu'il réformerait leur mode de fonctionnement, avec la suppression des formations administratives et commerciales. Le programme ne précise pas combien d'agents seraient concernés, quel serait le coût de cette réorganisation, ni à quelle date elle aurait lieu.
  enfant: >-
    Le programme La Voie soutient Juan Branco. Il veut un grand service public de l'emploi. Ce service réunirait plusieurs organismes. Ils aident à se former et à trouver un emploi. Le texte cite les missions locales et France Travail. Il veut changer leur façon de travailler. Il ne dit pas ce que cela coûterait.
  aine: >-
    La Voie, le programme publié par le mouvement Les Ruches qui soutient Juan Branco, prévoit un grand service public de l'emploi. Il réunirait les ressources de plusieurs organismes cités dans le texte : missions locales, AFPA, GRETA, France Travail, France Compétences et Éducation nationale, pour ce qui concerne la formation professionnelle. Leur mode de fonctionnement serait réformé, avec la suppression des formations administratives et commerciales. Le texte ne dit ni le coût, ni le nombre d'agents concernés, ni la date de mise en place.
