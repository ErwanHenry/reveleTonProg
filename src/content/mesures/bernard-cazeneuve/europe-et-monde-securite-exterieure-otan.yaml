titre: "Sécurité extérieure, OTAN et Europe de la défense"
texte_source: >-
  réarmement à proportion de la menace, moyens rendus aux forces ; industrie de défense
  consolidée, coopérations européennes planifiées, préférence aux productions nationales et
  continentales ; dans l’OTAN sans rien y abdiquer, pour l’Europe de la défense sans prétendre s’y
  substituer ; architecture européenne de sécurité : réflexion sur l’apport de la dissuasion, y
  compris avec le Royaume-Uni, protection antimissile coordonnée du continent
source: bernard-cazeneuve-lettre
source_localisation: "liste finale des propositions, proposition 25 (page 84 du PDF)"
redactions:
  resume: >-
    Bernard Cazeneuve propose un réarmement à proportion de la menace, une présence dans l’OTAN sans
    rien y abdiquer et l’Europe de la défense.
  detaille: >-
    Dans la liste finale de propositions de sa lettre, Bernard Cazeneuve écrit : « réarmement à
    proportion de la menace, moyens rendus aux forces ». Il ajoute : « industrie de défense
    consolidée, coopérations européennes planifiées, préférence aux productions nationales et
    continentales ». Sur l’alliance, il écrit « dans l’OTAN sans rien y abdiquer, pour l’Europe de
    la défense sans prétendre s’y substituer ». Il mentionne aussi une « architecture européenne de
    sécurité » : une réflexion sur l’apport de la dissuasion, y compris avec le Royaume-Uni, et une
    protection antimissile coordonnée du continent. Le texte ne donne aucun chiffre de dépenses ni
    de calendrier.
  enfant: >-
    Bernard Cazeneuve veut réarmer la France, à la mesure de la menace. Il veut rendre des moyens
    aux forces armées. Il veut rester dans l’[[Organisation du traité de l’Atlantique Nord|otan]],
    sans rien céder. Il veut aussi une protection contre les missiles pour tout le continent.
  aine: >-
    Dans la liste finale de sa lettre, Bernard Cazeneuve propose un réarmement à proportion de la
    menace, avec des moyens rendus aux forces, une industrie de défense consolidée et des
    coopérations européennes planifiées. Il veut rester dans l’Organisation du traité de
    l’Atlantique Nord, l’OTAN, sans rien y abdiquer, et agir pour l’Europe de la défense sans
    prétendre s’y substituer. Il évoque aussi une réflexion sur l’apport de la dissuasion, y compris
    avec le Royaume-Uni, et une protection antimissile coordonnée du continent. Aucun chiffre ni
    calendrier n’est donné.
statut_relecture: brouillon
