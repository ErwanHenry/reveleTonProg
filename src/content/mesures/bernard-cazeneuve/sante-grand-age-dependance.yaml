titre: "Prise en charge du grand âge, de la dépendance et soutien aux aidants familiaux"
texte_source: >-
  prise en charge du grand âge, de la dépendance et du soutien aux aidants familiaux : un chantier considérable, dont la soutenabilité financière sera garantie aux familles les plus modestes.
source: bernard-cazeneuve-lettre
source_localisation: "liste Les propositions de Bernard Cazeneuve , proposition n° 5 Protéger à chaque âge de la vie - le grand âge et la fin de vie"
redactions:
  resume: >-
    Bernard Cazeneuve veut prendre en charge le grand âge et la dépendance et soutenir les aidants familiaux, avec une soutenabilité financière garantie aux familles modestes.
  detaille: >-
    Dans la liste des propositions de sa lettre, Bernard Cazeneuve inscrit la prise en charge du grand âge, de la dépendance et du soutien aux aidants familiaux. Il parle d'un chantier considérable. Il écrit que la soutenabilité financière de ce chantier sera garantie aux familles les plus modestes. Le texte ne dit pas en quoi consisterait cette prise en charge, ni comment la soutenabilité financière serait assurée. Il ne donne ni chiffre, ni calendrier, ni mode de financement, et il ne dit pas qui assurerait cette prise en charge.
  enfant: >-
    Bernard Cazeneuve parle des personnes très âgées. Il veut mieux les prendre en charge quand elles sont en situation de [[dépendance]]. Il veut aussi soutenir les [[aidants familiaux|aidant-familial]]. Il veut garantir que cela reste finançable pour les familles les plus modestes.
  aine: >-
    Bernard Cazeneuve propose de mieux prendre en charge le grand âge et la dépendance, c'est-à-dire le besoin d'aide des personnes âgées dans la vie quotidienne. Il propose aussi de soutenir les aidants familiaux, ces proches qui s'occupent d'une personne dépendante. Il parle d'un chantier considérable et écrit que sa soutenabilité financière sera garantie aux familles les plus modestes. Le texte ne détaille ni les moyens, ni le calendrier.
statut_relecture: brouillon
