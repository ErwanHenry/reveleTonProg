titre: "Apprentissage généralisé, encadrement des stages, CDI comme norme pour les jeunes"
texte_source: >-
  apprentissage généralisé dès le premier cycle universitaire ; encadrement du recours abusif aux stages ; CDI redevenu la norme pour les jeunes
source: bernard-cazeneuve-lettre
source_localisation: "lettre La Convention, liste finale des propositions, proposition 24 (Travailler)"
redactions:
  resume: >-
    Bernard Cazeneuve propose de généraliser l'apprentissage, d'encadrer le recours abusif aux stages et de faire du CDI la norme pour les jeunes.
  detaille: >-
    Dans la liste finale de sa lettre, Bernard Cazeneuve propose un « apprentissage généralisé dès le premier cycle universitaire », l'« encadrement du recours abusif aux stages » et un « CDI redevenu la norme pour les jeunes ». Le CDI est le contrat à durée indéterminée. Le texte ne précise pas comment l'apprentissage serait généralisé, ce que serait l'encadrement des stages, ni par quels moyens le CDI redeviendrait la norme. Ces propositions figurent dans une même rubrique consacrée au travail. Il ne donne pas de date.
  enfant: >-
    Bernard Cazeneuve veut l'[[apprentissage|apprentissage]] pour tous, dès le premier cycle de l'université. Il veut aussi encadrer les stages quand on en abuse. Pour les jeunes, il veut le [[contrat à durée indéterminée|contrat-a-duree-indeterminee]] comme règle. C'est un contrat de travail sans date de fin. Le texte ne dit pas comment.
  aine: >-
    Dans la liste finale de sa lettre, Bernard Cazeneuve propose de généraliser l'apprentissage dès le premier cycle universitaire, d'encadrer le recours abusif aux stages et de faire redevenir le CDI, contrat à durée indéterminée, la norme pour les jeunes. Le texte ne dit pas comment l'apprentissage serait étendu, quelles règles encadreraient les stages, ni par quels moyens le CDI redeviendrait la norme. Il ne donne pas de date.
