candidat: bernard-cazeneuve
theme: sante
sous_theme: hopital-et-soignants
titre: "Reconnaissance des soignants et santé mentale érigée en grande cause nationale"
texte_source: >-
  restauration du sens des métiers du soin et reconnaissance de la Nation aux soignants, dans tous les territoires ; la santé mentale, épreuve silencieuse de la jeunesse, érigée en grande cause nationale, avec formation des personnels de santé et de l’éducation.
source: bernard-cazeneuve-lettre
source_localisation: "liste Les propositions de Bernard Cazeneuve , proposition n° 4 Protéger à chaque âge de la vie - la santé"
redactions:
  resume: >-
    Bernard Cazeneuve propose de reconnaître les soignants et de faire de la santé mentale une grande cause nationale.
  detaille: >-
    Dans la liste des propositions de sa lettre, Bernard Cazeneuve consacre un point à la santé. Il y cite la restauration du sens des métiers du soin et la reconnaissance de la Nation aux soignants, dans tous les territoires. Il y cite aussi la santé mentale, qu'il décrit comme l'épreuve silencieuse de la jeunesse : elle serait érigée en grande cause nationale, avec une formation des personnels de santé et de l'éducation. Le texte ne précise pas comment la reconnaissance se traduirait, quels moyens financiers seraient prévus ni quel serait le calendrier.
  enfant: >-
    Bernard Cazeneuve veut que le pays reconnaisse les soignants. Il veut redonner du sens à leur métier, partout en France. Il veut aussi que la [[santé mentale|sante-mentale]] devienne une [[grande cause nationale|grande-cause-nationale]]. On formerait les personnels de santé et de l'éducation.
  aine: >-
    Bernard Cazeneuve propose de restaurer le sens des métiers du soin et de manifester la reconnaissance de la Nation aux soignants, dans tous les territoires. Il décrit la santé mentale comme l'épreuve silencieuse de la jeunesse et veut en faire une grande cause nationale, avec une formation des personnels de santé et de l'éducation. Le texte ne dit pas quels moyens financiers seraient consacrés à ces mesures ni à quelle date elles commenceraient.
statut_relecture: brouillon
