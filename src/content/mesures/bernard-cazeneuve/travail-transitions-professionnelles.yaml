titre: "Protection des transitions professionnelles et formation tout au long de la vie"
texte_source: >-
  protection des transitions professionnelles, à la manière scandinave, et formation tout au long de la vie
source: bernard-cazeneuve-lettre
source_localisation: "lettre La Convention, liste finale des propositions, proposition 24 (Travailler)"
redactions:
  resume: >-
    Bernard Cazeneuve propose la protection des transitions professionnelles, à la manière scandinave, et la formation tout au long de la vie.
  detaille: >-
    Dans la liste finale de sa lettre, à la proposition consacrée au travail, Bernard Cazeneuve propose la « protection des transitions professionnelles, à la manière scandinave », et la formation tout au long de la vie. Le texte ne définit pas ce qu'il entend par transitions professionnelles ; il fait référence au modèle des pays scandinaves. Il ne précise pas quels dispositifs seraient créés, qui serait protégé, comment cette protection serait financée, ni à quelle date elle serait mise en place. Le texte ne définit pas non plus ce que serait la formation tout au long de la vie.
  enfant: >-
    Bernard Cazeneuve veut protéger les [[transitions professionnelles|transition-professionnelle]]. C'est le passage d'un emploi à un autre. Il veut le faire à la manière des pays scandinaves. Il veut aussi que l'on puisse se former tout au long de sa vie. Le texte ne dit pas comment ce serait payé.
  aine: >-
    Dans la liste finale de sa lettre, Bernard Cazeneuve propose la protection des transitions professionnelles, à la manière scandinave, ainsi que la formation tout au long de la vie. Une transition professionnelle désigne le passage d'un emploi ou d'un métier à un autre. Le texte ne précise pas quels dispositifs seraient créés, qui en bénéficierait, comment ils seraient financés, ni à partir de quand ils s'appliqueraient.
statut_relecture: brouillon
