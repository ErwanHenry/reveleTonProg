version_schema: 1
id: bernard-cazeneuve/europe-et-monde-multilateralisme
candidat: bernard-cazeneuve
theme: europe-et-monde
sous_theme: diplomatie-et-multilateralisme
titre: "Multilatéralisme et réforme du Conseil de sécurité des Nations unies"
texte_source: >-
  Multilatéralisme : défense de l’ordre international fondé sur le droit ; réforme du Conseil de
  sécurité des Nations unies ; nouveau partenariat, débarrassé du paternalisme, avec les pays du
  Sud global.
source: bernard-cazeneuve-lettre
source_localisation: "liste finale des propositions, proposition 26 (page 84 du PDF)"
redactions:
  resume: >-
    Bernard Cazeneuve propose de défendre l’ordre international fondé sur le droit et de réformer le
    Conseil de sécurité des Nations unies.
  detaille: >-
    Dans la liste finale de propositions de sa lettre, Bernard Cazeneuve écrit : « Multilatéralisme
    : défense de l’ordre international fondé sur le droit ; réforme du Conseil de sécurité des
    Nations unies ; nouveau partenariat, débarrassé du paternalisme, avec les pays du Sud global ».
    Il énonce donc ces points : la défense de l’ordre international fondé sur le droit, la réforme
    du Conseil de sécurité, et un nouveau partenariat avec les pays du Sud global. Le texte cité ne
    précise pas la forme de la réforme du Conseil de sécurité, ni le contenu du partenariat, ni le
    calendrier. Il ne donne aucun chiffre.
  enfant: >-
    Bernard Cazeneuve veut défendre un ordre international fondé sur le droit. Il veut changer le
    [[Conseil de sécurité]] des [[Nations unies]]. Il veut un nouveau lien avec les pays du [[Sud
    global]]. Il ne veut pas de [[paternalisme]] dans ce lien.
  aine: >-
    Dans la liste finale de sa lettre, Bernard Cazeneuve propose plusieurs choses en matière de
    multilatéralisme, c’est-à-dire de coopération entre de nombreux pays. Il veut défendre l’ordre
    international fondé sur le droit. Il veut réformer le Conseil de sécurité des Nations unies. Il
    veut un nouveau partenariat avec les pays du Sud global, débarrassé du paternalisme. Le texte ne
    dit pas quelle réforme du Conseil de sécurité il souhaite, ni à quelle date.
statut_relecture: brouillon
