titre: "Plan d'urgence contre les canicules commençant par les hôpitaux et les Ehpad"
texte_source: >-
  Il faut d’urgence financer les moyens pour s’adapter aux prochaines canicules, incendies, sécheresses, car l’année 2026 n’aura bientôt plus rien d’exceptionnel. Ce plan d’urgence contre les canicules commencera par équiper les hôpitaux, Ehpad, écoles et logements dits « bouilloires thermiques » contre les incendies.
source: jean-luc-melenchon-comptes-publics
source_localisation: "page 11 du PDF, section Enclencher la planification écologique "
redactions:
  resume: >-
    Son parti, La France insoumise, veut un plan d'urgence contre les canicules, commençant par équiper hôpitaux, Ehpad, écoles et certains logements contre les incendies.
  detaille: >-
    Dans le document sur les comptes publics publié sur le site de campagne du candidat, son parti, La France insoumise, écrit qu'il faut financer d'urgence les moyens de s'adapter aux prochaines canicules, incendies et sécheresses. Il indique que ce plan d'urgence contre les canicules commencerait par équiper les hôpitaux, les Ehpad, les écoles et les logements dits « bouilloires thermiques » contre les incendies. Le texte ne précise pas quel matériel serait installé, ni le coût propre à ce plan. Le document présente ses orientations budgétaires pour l'année de l'élection présidentielle, sans calendrier propre à ce plan.
  enfant: >-
    Son parti veut un plan d'urgence contre les canicules. Il parle aussi des incendies et des sécheresses. Le plan commencerait par les hôpitaux, les [[Ehpad]], les écoles et des logements. Ces lieux seraient équipés contre les incendies. Le texte ne dit pas quel matériel serait acheté.
  aine: >-
    Dans le document sur les comptes publics, son parti, La France insoumise, écrit qu'il faut financer d'urgence l'adaptation aux canicules, aux incendies et aux sécheresses. Le plan d'urgence contre les canicules commencerait par équiper les hôpitaux, les Ehpad (établissements d'hébergement pour personnes âgées dépendantes), les écoles et les logements dits « bouilloires thermiques » contre les incendies. Le texte ne précise ni le matériel prévu, ni le coût de ce plan. Le document présente ses orientations pour l'année de l'élection présidentielle, sans calendrier propre à ce plan.
