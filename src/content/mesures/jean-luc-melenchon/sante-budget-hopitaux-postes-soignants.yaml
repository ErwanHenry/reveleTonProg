titre: "Hausse du budget des hôpitaux et créations de postes de personnel soignant"
texte_source: >-
  Nous proposons une hausse globale de 3 milliards d’euros du budget des hôpitaux avec au moins 10 000 créations de postes de personnel soignant.
source: jean-luc-melenchon-comptes-publics
source_localisation: "page 10 du PDF, section Répondre aux urgences en renforçant les services publics "
redactions:
  resume: >-
    Jean-Luc Mélenchon propose 3 milliards d'euros de plus pour le budget des hôpitaux, avec au moins 10 000 créations de postes de soignants.
  detaille: >-
    Dans le document sur les comptes publics publié sur son site de campagne, Jean-Luc Mélenchon propose une hausse globale de 3 milliards d'euros du budget des hôpitaux, avec au moins 10 000 créations de postes de personnel soignant. Le texte ne précise pas dans quels hôpitaux ces postes seraient créés, sur quelle durée, ni comment les professionnels seraient recrutés. Il ne dit pas non plus quelles catégories de personnel soignant seraient concernées. Le texte indique le montant de la hausse du budget, mais pas le calendrier de cette hausse.
  enfant: >-
    Jean-Luc Mélenchon veut donner plus d'argent aux hôpitaux. Leur budget augmenterait de 3 milliards d'euros. Il veut aussi créer au moins 10 000 postes de soignants. Le texte ne dit pas où seraient ces postes. Il ne dit pas combien de temps cela prendrait.
  aine: >-
    Dans son document sur les comptes publics, Jean-Luc Mélenchon propose d'augmenter de 3 milliards d'euros le budget des hôpitaux, avec au moins 10 000 créations de postes de personnel soignant. Le texte ne précise pas dans quels établissements ces postes seraient créés, ni sur combien d'années, ni quelles professions seraient recrutées. Il ne dit pas comment cette hausse serait financée.
statut_relecture: brouillon
