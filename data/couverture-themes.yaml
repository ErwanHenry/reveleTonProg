      logement:
        niveau: partiel
        note: "index du programme : « Instaurer un droit à la climatisation » (protection des logements contre les canicules), énoncé indirect ; aucune mesure de logement proprement dite, pas de thématique logement"
      ecole:
        niveau: fort
        note: "thématique « Éducation » : 16 mesures annoncées (Plan Voltaire, remplacement des enseignants absents, redoublement, certificat d'études...), plus un chantier capital « École »"
      retraites:
        niveau: fort
        note: "index du programme : capitalisation fléchée vers l'innovation, intéressement vers l'épargne retraite, petites pensions protégées, âge légal remplacé par la durée de cotisation (4 énoncés)"
      sante:
        niveau: fort
        note: "page de la thématique « Santé » : 5 mesures (assistant médical IA, équilibre des comptes de la Sécurité sociale, droit à la climatisation, polluants éternels dans l'eau)"
      securite:
        niveau: fort
        note: "thématiques « Justice » (14 mesures), « Sécurité et ordre public » (8 mesures) et « Défense » : comparution immédiate des mineurs, magistrats supplémentaires, etc."
      climat:
        niveau: fort
        note: thématiques « Écologie » (9 mesures dont le plan Eau) et « Énergie » (7 mesures dont géoénergie et fusion nucléaire), plus un chantier « Dette écologique »
      travail:
        niveau: fort
        note: "thématique « Travail » (12 mesures : treizième mois pour les classes moyennes, Constitution du travail, assurance chômage) et chantier capital « Travail & salaires »"
      impots:
        niveau: fort
        note: "thématique « Finances publiques » (9 mesures) : aucune hausse d'impôts pendant 5 ans, loi de programmation fiscale sur dix ans, déficit sous 3 %"
      europe-et-monde:
        niveau: fort
        note: "thématiques « Politique étrangère » (12 mesures : traité Mercosur, clauses miroir, dôme de fer européen), « Immigration » (3 mesures) et chantier « Frontières »"
      institutions:
        niveau: fort
        note: "thématique « Démocratie » (7 mesures : journée référendaire annuelle, référendums locaux, nominations aux hautes fonctions, maire)"
