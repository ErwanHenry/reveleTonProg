      - https://attalpresident.fr/programme?thematique=education (liste filtrée, lue en direct, non archivée ; idem pour travail, economie, finances-publiques, justice, securite-et-ordre-public, immigration, ecologie, energie, democratie, politique-etrangere, familles)
