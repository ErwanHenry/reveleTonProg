candidats:
  - id: nathalie-arthaud
    acces: ok
    urls_bloquees: []
    sources:
      - nathalie-arthaud-brochure-campagne
    urls_consultees:
      - "https://www.nathalie-arthaud.info/ (page d'accueil : texte de campagne court, pas de programme thématique)"
      - https://www.nathalie-arthaud.info/portail/breves/brochure-campagne-196541.html (renvoie vers lutte-ouvriere.org ; annonce du 25/08/2026 de la brochure de campagne)
      - https://www.nathalie-arthaud.info/medias/document/fichiers/2026/06/brochure-ete-2026.pdf (brochure de campagne, archivée)
      - https://www.lutte-ouvriere.org/ (site du parti, militant, non archivé)
      - https://www.lutte-ouvriere.org/portail/qui-sommes-nous/index.html (présentation du parti, « Nos positions », non archivée)
    cellules:
      logement:
        niveau: silence
        note: "aucun passage de programme sur le logement dans la brochure de campagne (seule mention : des personnes à la rue, en constat)"
      ecole:
        niveau: partiel
        note: "brochure p. 12 et 14 : embauches à recenser avec le personnel de l'éducation ; « milliards pour les hôpitaux, les écoles » via la confiscation des bénéfices ; 2 énoncés indirects"
      retraites:
        niveau: partiel
        note: "brochure p. 11 : « augmentation massive des salaires, des allocations et des pensions » indexée sur les prix ; un seul énoncé"
      sante:
        niveau: partiel
        note: "brochure p. 12 et 14 : embauches à recenser dans les hôpitaux et Ehpad ; « milliards pour les hôpitaux » ; 2 énoncés indirects"
      securite:
        niveau: partiel
        note: "brochure p. 25 : refus de l'unité nationale derrière les généraux et de la rallonge militaire ; aucune position sur police ni justice ; 1 énoncé de principe"
      climat:
        niveau: silence
        note: "brochure : le climat n'apparaît qu'en constat (réchauffement, transition), aucun engagement"
      travail:
        niveau: fort
        note: "brochure p. 10-12 : section « Le programme que les travailleurs devront imposer » : hausse massive des salaires indexée, répartition du travail entre tous, baisse du temps de travail sans perte de salaire, plus de 3 énoncés"
      impots:
        niveau: partiel
        note: "brochure p. 14 : confiscation des bénéfices des « profiteurs de guerre » et levée du secret des affaires ; énoncé indirect, pas de mesure fiscale détaillée"
      europe-et-monde:
        niveau: fort
        note: "brochure p. 16-18 et 25 : régularisation de tous les sans-papiers, liberté de circulation et d'installation, contre le protectionnisme, refus de l'unité nationale ; plus de 3 énoncés"
      institutions:
        niveau: silence
        note: "brochure p. 26-27 : rappelle que le programme ne passe pas par les élections ; aucune mesure sur les institutions"
