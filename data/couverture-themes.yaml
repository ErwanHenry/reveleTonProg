    urls_consultees:
      - https://becht2027.fr/ (accueil du site de campagne)
      - https://becht2027.fr/projet-france/les-5-refondations/ (index des 5 refondations, archivé)
      - https://becht2027.fr/projet-france/les-5-refondations/refondation-energie/ (page lue en direct, non archivée ; idem refondation-sociale, refondation-sante, refondation-securite, refondation-democratique-territoriale)
      - https://becht2027.fr/projet-france/le-livre/ (page de présentation du livre)
      - "https://becht2027.fr/wp-content/uploads/livre/olivier-becht-projet-france-partie-1-0d37b44fd60e9388.pdf (partie 1 « Reprendre la route », récit sans engagement, non archivée ; idem parties 2 et 3 : récit et diagnostic, « Je ne vais pas vous infliger ici un catalogue de mesures »)"
      - https://becht2027.fr/wp-content/uploads/livre/olivier-becht-projet-france-partie-4-d23eb5f5d21db80b.pdf (partie 4, archivée ; parties 5 à 9 archivées de même)
    cellules:
      logement:
        niveau: fort
        note: "partie 5, section « Vivre et vieillir dans la dignité » : « une autre politique du logement » (rénover l'existant, friches et bureaux vides, logement social en petites unités, communes à offre excédentaire) ; plus de 3 énoncés"
      ecole:
        niveau: fort
        note: "parties 4, 5, 7 et 9 : plus de 10 énoncés sur l'éducation (reprendre l'éducation « à la base » dans le plan de sécurité, apprentissage, université) ; thème traité à plusieurs endroits"
      retraites:
        niveau: fort
        note: "partie 5, section « Vivre et vieillir dans la dignité » : retraite par points, âge de départ au choix, pension indexée sur le rapport actifs/retraités, minimum de 1 200 euros, soumis à référendum ; le scanner ne détecte aucun engagement (formulation en « je propose »)"
      sante:
        niveau: fort
        note: "partie 6 « Un nouveau modèle de santé » (9 pages) et page « La santé » des 5 refondations : refondation du système de soins, alimentation sans phytosanitaires, défi technologique"
      securite:
        niveau: fort
        note: "partie 7 « Un nouveau modèle de sécurité » (14 pages) et page « La sécurité » : plan de sécurité, peines de prison, centres de redressement"
      climat:
        niveau: fort
        note: "page « L'énergie » (refondation énergie) et partie 4 : carburants de synthèse décarbonés, indépendance énergétique ; partie 9 : taxe environnementale européenne"
      travail:
        niveau: fort
        note: "parties 4 et 5 : actionnariat salarié, intéressement et participation, contrat universel, indemnité d'activité, plus de 3 énoncés ; page « La refondation sociale »"
      impots:
        niveau: fort
        note: "pas de section dédiée ; énoncés dispersés : plutôt que d'alourdir l'impôt, salariés actionnaires et avantage fiscal relevé des primes (partie 4), épargne retraite abondée en franchise d'impôt (partie 5), récapitulatif annuel des prélèvements (partie 8), taxe data (partie 9) ; limite de la mesure : à relire"
      europe-et-monde:
        niveau: fort
        note: "partie 9 « Un nouveau modèle de rayonnement » (14 pages) : puissance technologique européenne, harmonisation fiscale, taxe sur les géants du numérique, pression migratoire"
      institutions:
        niveau: fort
        note: "partie 8 « Un nouveau modèle d'organisation de la République et des Libertés » (12 pages) et page « Le pacte démocratique et territorial » : référendum d'initiative citoyenne, autonomie des collectivités"
