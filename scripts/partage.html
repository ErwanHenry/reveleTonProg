<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Image de partage</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    background: {{FOND}};
    color: {{ENCRE}};
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  .barre { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: {{ENCRE_DOUCE}}; }
  .repere { position: absolute; top: 80px; left: 80px; right: 80px; margin: 0; font-size: 34px; line-height: 1.3; color: {{ENCRE_DOUCE}}; }
  .promesse { position: absolute; top: 150px; left: 80px; right: 80px; margin: 0; font-size: 80px; line-height: 1.15; font-weight: 700; }
  .domaine { position: absolute; bottom: 70px; left: 80px; right: 80px; margin: 0; padding-top: 24px; border-top: 2px solid {{ENCRE_DOUCE}}; font-size: 38px; color: {{ENCRE_DOUCE}}; }
</style>
</head>
<body>
  <div class="barre"></div>
  <p class="repere">{{REPERE}}</p>
  <p class="promesse">{{PROMESSE}}</p>
  <p class="domaine">{{DOMAINE}}</p>
</body>
</html>
