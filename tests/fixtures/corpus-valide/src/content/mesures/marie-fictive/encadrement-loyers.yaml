titre: Encadrement des loyers dans les villes moyennes (fictif)
texte_source: Nous encadrerons les loyers dans toutes les villes de plus de 50 000 habitants, avec un plafond fixé chaque année par le préfet.
source: marie-fictive-programme
source_localisation: page 3 (fictive)
redactions:
  resume: Marie Fictive propose de plafonner les loyers dans les villes de plus de 50 000 habitants. Le préfet fixerait le plafond chaque année.
  detaille: >-
    Dans son programme fictif, Marie Fictive prévoit d'encadrer les loyers. La mesure concernerait toutes les villes de plus de 50 000 habitants. Le texte indique : « un plafond fixé chaque année par le préfet ». Autrement dit, le préfet déciderait chaque année du montant maximal qu'un propriétaire peut demander pour un logement loué. Dans l'extrait étudié, le programme ne donne ni le montant du plafond, ni la liste des villes concernées. Il ne précise pas non plus ce qui se passerait pour un propriétaire qui dépasserait ce plafond. Les villes plus petites ne seraient pas touchées par cette mesure.
  enfant: >-
    Marie Fictive veut limiter le prix des loyers. Cela concerne les villes de plus de 50 000 habitants. Chaque année, le préfet choisit le prix le plus haut permis. Un propriétaire ne pourrait pas demander plus que ce prix. Le préfet est la personne qui représente l'État dans le département.
  aine: >-
    Marie Fictive propose d'encadrer les loyers. Cela veut dire qu'un plafond serait fixé : un prix de loyer à ne pas dépasser. Cette règle s'appliquerait dans toutes les villes de plus de 50 000 habitants. Le préfet, qui représente l'État dans le département, fixerait ce plafond chaque année. Le programme ne donne pas encore le montant de ce plafond. Il n'indique pas si les loyers déjà en cours seraient modifiés.
