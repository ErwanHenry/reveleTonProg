version_schema: 1
id: elise-erard/guichet-unique
candidat: elise-erard
theme: logement
sous_theme: loyers
titre: Guichet unique départemental du logement social (fictif)
texte_source: Nous créerons un guichet unique départemental pour toutes les demandes de logement social.
source: programme-commun-fictif
source_localisation: page 2 (fictive)
redactions:
  resume: Élise Érard propose de créer un guichet unique par département pour toutes les demandes de logement social.
  detaille: >-
    Dans le programme commun fictif qu'elle présente avec Jean Imaginaire, Élise Érard prévoit de créer un guichet unique pour les demandes de logement social. Le texte indique que ce guichet serait organisé au niveau de chaque département. Autrement dit, une personne qui cherche un logement social déposerait sa demande à un seul endroit, quel que soit le type de demande. Le programme précise que l'organisation détaillée serait définie après une concertation avec les associations de locataires. Dans l'extrait étudié, il ne donne ni la date d'ouverture, ni le nombre de guichets, ni le coût de la mesure.
  enfant: >-
    Élise Érard veut créer un guichet unique dans chaque département. Un guichet est un endroit où l'on dépose une demande. Ici, il s'agirait des demandes de logement social. Un logement social est un logement dont le loyer est moins cher. Le programme ne dit pas où seraient ces guichets. Il ne dit pas non plus quand ils ouvriraient.
  aine: >-
    Élise Érard propose de créer un guichet unique dans chaque département pour toutes les demandes de logement social. Cela veut dire qu'une personne qui cherche un logement social déposerait sa demande à un seul endroit. Le programme indique que l'organisation précise de ce guichet serait définie après une concertation avec les associations de locataires. Il ne donne pas encore la date d'ouverture, ni le nombre de guichets prévus.
statut_relecture: brouillon
