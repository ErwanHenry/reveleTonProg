# Configuration publique du site (lue depuis la racine du projet, jamais depuis la racine de contenu).
#
# domaine : nom d'hôte du site, déclaré ici et nulle part ailleurs. Apex sans « www. », en minuscules,
#   sans schéma (https://), port ni chemin. Valeur RÉELLE depuis le 2026-11-09 (domaine acheté par
