name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancement à la main (onglet Actions, branche main) : relance les vérifications ; deployer coché redéploie la
  # tête de main (même approbation), et retrait_urgence coché avec une justification écrite retire un contenu pendant
  # un gel des scrutins (D-10, scripts/garde-gel.ts) et déploie aussi.
  workflow_dispatch:
    inputs:
      deployer:
        description: "Déployer la tête de main (après approbation), même si elle ne change que la documentation"
        type: boolean
        default: false
      retrait_urgence:
        description: "Retrait d'urgence pendant un gel des scrutins (justification obligatoire)"
        type: boolean
        default: false
      justification:
        description: "Justification écrite du retrait d'urgence (20 caractères au moins, affichée dans le résumé)"
        type: string
        default: ""

permissions:
  contents: read

# Un groupe par pull request (un nouveau push annule l'ancien run) et un groupe par exécution sur main (github.run_id) :
# un run de main qui attend l'approbation du déploiement ne met jamais en file ni n'annule le run suivant, et chaque
# push sur main reste comparé à son commit de base (ids.lock). Les déploiements se sérialisent par la concurrence du
# job deploy (deploy-production), pas par celle du workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Sur main, ne jamais annuler : un push annulé ne serait jamais comparé à son commit de base (ids.lock).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Paris
  ASTRO_TELEMETRY_DISABLED: "1"
  # Chemins qui ne changent pas le site servi, définis une seule fois ici et lus par ops/site-touche.sh dans les jobs
  # changements (un push qui ne touche qu'eux ne demande aucun déploiement) et deploy (une tête de main plus récente
  # qui ne touche qu'eux n'invalide pas l'approbation). « dossier/ » : dossier de la racine ; autre motif : fichier
  # de la racine seulement (« *.md » ne couvre pas src/x.md). Liste prudente : tout chemin absent compte comme le site.
  # .gitattributes n'y est pas (IN-04) : eol, encodage ou filtres changent les octets extraits de src/, donc le site.
  CHEMINS_HORS_SITE: ".planning/ docs/ tests/ e2e/ audit/ ops/ deploy/ .github/ README.md LICENSE *.md .editorconfig"

jobs:
  verifier:
    name: Vérifier (migrate, validate, check, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt (historique complet, pour comparer ids.lock au commit de base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances (npm ci)
        run: npm ci
      - name: Vérifier les signatures des paquets
        run: npm audit signatures
      - name: migrate (corpus fictif)
        run: npm run migrate -- --check
        env:
          RTP_CONTENT_ROOT: tests/fixtures/corpus-valide
      - name: migrate (corpus réel)
        run: npm run migrate -- --check
        env:
          RTP_CONTENT_ROOT: "."
      - name: validate (corpus fictif, mode production)
        run: npm run validate -- --mode production --format github
        env:
          RTP_CONTENT_ROOT: tests/fixtures/corpus-valide
      - name: validate (corpus réel, mode production)
        run: npm run validate -- --mode production --format github
        env:
          RTP_CONTENT_ROOT: "."
      - name: ids.lock en ajout seul (comparé au commit de base)
        env:
          RTP_CONTENT_ROOT: "."
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Échec fermé : sans commit de base, une PR qui retire un id passerait sans comparaison.
            BASE=$(git merge-base "origin/${BASE_REF}" HEAD) || { echo "::error::merge-base avec origin/${BASE_REF} introuvable : impossible de comparer ids.lock."; exit 1; }
            if [ -z "$BASE" ]; then
              echo "::error::merge-base vide : impossible de comparer ids.lock."
              exit 1
            fi
          else
            BASE="$PUSH_BEFORE"
            # Seule la création d'une branche (avant = 40 zéros) n'a pas de commit de base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "Création de branche (pas de commit de base) : comparaison ignorée."
              exit 0
            fi
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::Commit de base ${BASE} introuvable (réécriture d'historique ?) : comparaison de ids.lock impossible, la CI échoue plutôt que de la sauter."
            exit 1
          fi
          if ! git cat-file -e "${BASE}:ids.lock" 2>/dev/null; then
            echo "ids.lock n'existe pas dans le commit de base ${BASE} (introduction du fichier) : comparaison ignorée."
            exit 0
          fi
          git show "${BASE}:ids.lock" > "$RUNNER_TEMP/ids-base.lock"
          npm run ids -- --check --base "$RUNNER_TEMP/ids-base.lock"
      - name: Vérifier les types (astro check)
        run: npm run check
      - name: Lancer les tests
        run: npm test
      - name: Construire le site (corpus fictif)
        run: npm run build
        env:
          RTP_CONTENT_ROOT: tests/fixtures/corpus-valide
      - name: Contrôler le site construit (corpus fictif, poids, tiers, sources datées, cellules, brouillons)
        run: npm run check-dist
        env:
          RTP_CONTENT_ROOT: tests/fixtures/corpus-valide
      - name: Construire le site du corpus réel (production)
        run: npm run build -- --outDir dist-reel
        env:
          RTP_CONTENT_ROOT: "."
      - name: Contrôler le site du corpus réel (production)
        run: npm run check-dist -- --dist dist-reel --mode production
        env:
          RTP_CONTENT_ROOT: "."
      - name: Construire le site du corpus réel (preview)
        run: npm run build -- --outDir dist-preview
        env:
          RTP_CONTENT_ROOT: "."
          RTP_MODE: preview
      - name: Contrôler le site du corpus réel (preview, noindex et robots.txt)
        run: npm run check-dist -- --dist dist-preview --mode preview
        env:
          RTP_CONTENT_ROOT: "."
      - name: Publier la build preview (artefact site-preview, URL de test du lot 2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: dist-preview
          retention-days: 14
          if-no-files-found: error

  e2e:
    name: Tests navigateur (Playwright, axe, 4G)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances (npm ci)
        run: npm ci
      - name: Vérifier les signatures des paquets
        run: npm audit signatures
      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium
      - name: Lancer les tests navigateur (fixture et corpus réel)
        run: npm run e2e
      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Chercher des secrets (gitleaks, historique complet)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (binaire épinglé, somme de contrôle vérifiée)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Analyser l'historique git
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact -v .'

  # Le site est-il touché par ce push ? Aucun secret, aucun Environment. site=true si un fichier changé entre
  # github.event.before et github.sha est hors de CHEMINS_HORS_SITE, et par prudence quand le commit de base manque,
  # vaut 40 zéros ou n'est pas un ancêtre (création de branche, push forcé) ; toujours true pour un lancement à la
  # main (seule l'entrée deployer ou retrait_urgence décide alors). Les renommages comptent des deux côtés.
  changements:
    name: Changements du site (le push touche-t-il le site servi ?)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.classer.outputs.site }}
    steps:
      - name: Récupérer le dépôt (historique complet, pour comparer au commit de base du push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classer les fichiers changés (site ou hors site)
        id: classer
        env:
          EVENT_NAME: ${{ github.event_name }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
        run: |
          set -euo pipefail
          SITE=true
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Lancement à la main : site=true (l'entrée deployer ou retrait_urgence décide du déploiement)."
          elif [ -z "$AVANT" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ]; then
            echo "Pas de commit de base (création de branche) : site=true par prudence."
          elif ! git cat-file -e "${AVANT}^{commit}" 2>/dev/null; then
            echo "Commit de base $AVANT introuvable (historique réécrit ?) : site=true par prudence."
          elif ! git merge-base --is-ancestor "$AVANT" "$APRES"; then
            echo "Commit de base $AVANT hors de l'historique de $APRES (push forcé) : site=true par prudence."
          else
            SITE=$(git diff --no-renames --name-only -z "$AVANT" "$APRES" | bash ops/site-touche.sh)
            git diff --no-renames --name-only "$AVANT" "$APRES"
          fi
          case "$SITE" in
            true|false) ;;
            *) echo "::error::Verdict inattendu de ops/site-touche.sh : $SITE"; exit 1 ;;
          esac
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "- Site touché par ce push : $SITE" >> "$GITHUB_STEP_SUMMARY"

  gel:
    name: Garde de gel des scrutins (17-19 avril, 1-3 mai 2027)
    needs: [verifier, e2e, secrets, changements]
    # En sommeil tant que la variable de dépôt DEPLOY_CIBLE n'existe pas : le job est sauté, la CI reste verte.
    # Seulement pour un push sur main qui touche le site, ou un lancement à la main avec deployer (ou retrait_urgence)
    # coché : un push de documentation seule saute gel et deploy, donc ne demande aucune approbation.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_CIBLE != '' && ((github.event_name == 'push' && needs.changements.outputs.site == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.deployer == true || inputs.retrait_urgence == true)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gel.outputs.ok }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Appliquer la garde de gel (dates de Paris, retrait d'urgence justifié)
        id: gel
        env:
          URGENCE: ${{ inputs.retrait_urgence }}
          JUSTIFICATION: ${{ inputs.justification }}
        run: node scripts/garde-gel.ts --urgence "$URGENCE" --justification "$JUSTIFICATION"

  # Build de déploiement (revue de code WR-04) : construite et contrôlée dans un job sans secret ni Environment, qui
  # seul exécute du code de dépendances (npm ci --ignore-scripts, Astro, Vite). Le job deploy, qui reçoit la clé SSH,
  # ne lance ni npm ni la build : il télécharge cet artefact (nom propre à la tentative, jamais site-preview),
  # vérifie l'empreinte de l'arbre publiée ici et la cible, puis l'envoie. Conservé 30 jours, durée maximale
  # d'attente d'une approbation.
  construire:
    name: Construire la build de déploiement (sans secret ni Environment)
    needs: [verifier, e2e, secrets, changements, gel]
    if: needs.gel.outputs.ok == 'true' && ((github.event_name == 'push' && needs.changements.outputs.site == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.deployer == true || inputs.retrait_urgence == true)))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artefact: ${{ steps.empreinte.outputs.nom }}
      empreinte: ${{ steps.empreinte.outputs.empreinte }}
      cible: ${{ steps.empreinte.outputs.cible }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances (npm ci, sans script de cycle de vie)
        run: npm ci --ignore-scripts
      - name: Vérifier les signatures des paquets
        run: npm audit signatures
      - name: Construire le site (corpus réel ; RTP_DEPLOIEMENT=1 pour la production, 0 pour essai)
        run: npm run build
        env:
          RTP_CONTENT_ROOT: "."
          RTP_DEPLOIEMENT: ${{ vars.DEPLOY_CIBLE == 'production' && '1' || '0' }}
      - name: Contrôler le site construit (mode production, version.json du commit)
        run: npm run check-dist -- --mode production
        env:
          RTP_CONTENT_ROOT: "."
          RTP_DEPLOIEMENT: ${{ vars.DEPLOY_CIBLE == 'production' && '1' || '0' }}
      - name: Empreinte de l'arbre construit, nom de l'artefact et cible de la build
        id: empreinte
        env:
          CIBLE_BUILD: ${{ vars.DEPLOY_CIBLE }}
        run: |
          set -euo pipefail
          empreinte_arbre() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -d' ' -f1; }
          if [ -n "$(find dist ! -type f ! -type d -print -quit)" ]; then
            echo "::error::dist/ contient un lien symbolique ou un fichier spécial."
            exit 1
          fi
          E=$(empreinte_arbre dist)
          echo "empreinte=$E" >> "$GITHUB_OUTPUT"
          echo "nom=site-deploiement-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "cible=$CIBLE_BUILD" >> "$GITHUB_OUTPUT"
          echo "- Build de déploiement : cible $CIBLE_BUILD, empreinte de l'arbre $E" >> "$GITHUB_STEP_SUMMARY"
      - name: Publier la build de déploiement (artefact propre à la tentative)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.empreinte.outputs.nom }}
          path: dist
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  # Livraison (HEB-02, D-08). En sommeil tant que la variable de dépôt DEPLOY_CIBLE n'existe pas : gel puis deploy sont
  # sautés et la CI reste verte. Erwan la pose après avoir créé l'Environment production (08-13).
  # DEPLOY_CIBLE=essai : build de production construite sans RTP_DEPLOIEMENT (hôte privé sous basic_auth, D-07 révisée).
  # DEPLOY_CIBLE=production : toujours RTP_DEPLOIEMENT=1, donc toutes les gardes de déploiement public (HEB-14).
  # Erwan approuve chaque run dans l'Environment production (seul relecteur, « prevent self-review » désactivé).
  # La garde de gel est appliquée deux fois : par le job gel (un push pendant le gel ne demande même pas d'approbation)
  # et en première étape de deploy, après l'approbation (une approbation donnée pendant le gel est refusée).
  # Une approbation donnée après que main a avancé avec des changements du site est refusée par le contrôle de la
  # tête de main : une tête plus récente n'est admise que si elle descend du commit du run et ne change que des
  # chemins de CHEMINS_HORS_SITE (même classement que le job changements). Seul le site de la tête part en ligne.
  # La build vient du job construire (même commit, sans secret) : deploy n'exécute aucun code de dépendance (WR-04).
  deploy:
    name: Déployer (cible DEPLOY_CIBLE, après approbation)
    needs: [verifier, e2e, secrets, changements, gel, construire]
    if: needs.gel.outputs.ok == 'true' && ((github.event_name == 'push' && needs.changements.outputs.site == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.deployer == true || inputs.retrait_urgence == true)))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Groupe propre aux déploiements, jamais annulé. Les retours arrière (rollback.yml) ont le leur, retour-production
    # (WR-02) : un push ne peut jamais annuler un retour en attente ; le verrou flock du serveur sérialise chaque verbe
    # activer et retour (voir l'en-tête de rollback.yml).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CIBLE: ${{ vars.DEPLOY_CIBLE }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Récupérer le dépôt (historique complet, pour comparer le commit du run à la tête de main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # La garde est rejouée ici, après l'approbation (CR-02) : le job gel l'évalue avant l'attente de l'Environment,
      # qui peut durer jusqu'à 30 jours. Un run approuvé pendant un gel est refusé, sauf retrait d'urgence justifié.
      # Aucune dépendance npm requise (scripts/garde-gel.ts n'importe que node: et src/lib/dates-tours.ts).
      - name: Rejouer la garde de gel au moment de l'approbation (dates de Paris, retrait d'urgence justifié)
        id: gel
        env:
          URGENCE: ${{ inputs.retrait_urgence }}
          JUSTIFICATION: ${{ inputs.justification }}
        run: node scripts/garde-gel.ts --urgence "$URGENCE" --justification "$JUSTIFICATION"
      - name: Refuser le déploiement approuvé pendant le gel
        if: steps.gel.outputs.ok != 'true'
        run: |
          echo "::error::Déploiement refusé par la garde de gel au moment de l'approbation (voir le résumé). Retrait d'urgence : relancer avec retrait_urgence coché et une justification écrite."
          exit 1
      - name: Vérifier la cible et que le commit est encore la tête de main, ou que la tête ne change pas le site (approbation périmée refusée)
        run: |
          set -euo pipefail
          case "$CIBLE" in
            essai|production) ;;
            *) echo "::error::DEPLOY_CIBLE doit valoir essai ou production."; exit 1 ;;
          esac
          TETE=$(git ls-remote "https://github.com/$REPO" refs/heads/main | cut -f1)
          if [ "$TETE" != "$SHA" ]; then
            # main a avancé : la tête est récupérée (dépôt public, sans identifiants) puis comparée au commit du run.
            git fetch --quiet --no-tags "https://github.com/$REPO" refs/heads/main
            TETE=$(git rev-parse FETCH_HEAD)
          fi
          if [ "$TETE" = "$SHA" ]; then
            echo "- Cible : $CIBLE ; commit $SHA, encore la tête de main" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$SHA" "$TETE"; then
            echo "::error::La tête de main ($TETE) ne descend pas du commit $SHA (historique réécrit) : approbation périmée, rien n'est déployé."
            exit 1
          fi
          SITE=$(git diff --no-renames --name-only -z "$SHA" "$TETE" | bash ops/site-touche.sh)
          if [ "$SITE" != "false" ]; then
            echo "::error::main a avancé (tête $TETE) avec des changements du site depuis le commit $SHA : approbation périmée, rien n'est déployé. Le run du dernier commit de main qui change le site déploiera (ou gh workflow run ci.yml --ref main -f deployer=true)."
            exit 1
          fi
          git diff --no-renames --name-only "$SHA" "$TETE"
          echo "tête plus récente sans changement du site : déploiement autorisé (tête $TETE, commit $SHA)"
          echo "- Cible : $CIBLE ; commit $SHA ; tête de main $TETE plus récente sans changement du site : déploiement autorisé" >> "$GITHUB_STEP_SUMMARY"
      - name: Télécharger la build du job construire (jamais la build preview)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.construire.outputs.artefact }}
          path: dist
          digest-mismatch: error
      - name: Vérifier la build téléchargée (empreinte de l'arbre, cible, commit de version.json, aucun lien)
        env:
          ARTEFACT: ${{ needs.construire.outputs.artefact }}
          EMPREINTE: ${{ needs.construire.outputs.empreinte }}
          CIBLE_BUILD: ${{ needs.construire.outputs.cible }}
        run: |
          set -euo pipefail
          empreinte_arbre() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -d' ' -f1; }
          case "$ARTEFACT" in
            site-deploiement-[0-9]*) ;;
            *) echo "::error::artefact inattendu : $ARTEFACT (seule la build du job construire est déployée)."; exit 1 ;;
          esac
          if ! [[ "$EMPREINTE" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::empreinte de la build absente ou invalide."
            exit 1
          fi
          # La cible est relue à l'approbation : une build faite pour essai (sans RTP_DEPLOIEMENT) ne part jamais en production.
          if [ "$CIBLE_BUILD" != "$CIBLE" ]; then
            echo "::error::build construite pour la cible « $CIBLE_BUILD », DEPLOY_CIBLE vaut « $CIBLE » : relancer le run."
            exit 1
          fi
          if [ -n "$(find dist ! -type f ! -type d -print -quit)" ]; then
            echo "::error::la build téléchargée contient un lien symbolique ou un fichier spécial."
            exit 1
          fi
          E=$(empreinte_arbre dist)
          if [ "$E" != "$EMPREINTE" ]; then
            echo "::error::empreinte de la build téléchargée ($E) différente de celle du job construire ($EMPREINTE)."
            exit 1
          fi
          if ! jq -e --arg s "$SHA" '.commit == $s' dist/version.json > /dev/null; then
            echo "::error::dist/version.json ne porte pas le commit $SHA."
            exit 1
          fi
          echo "- Build vérifiée : $ARTEFACT, empreinte $E, cible $CIBLE" >> "$GITHUB_STEP_SUMMARY"
      - name: Écrire la clé de déploiement et l'empreinte épinglée du serveur (jamais de scan de clé d'hôte)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST et DEPLOY_USER doivent être définis dans l'Environment production."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/cle"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kh"
          test -s "$RUNNER_TEMP/cle"
          test -s "$RUNNER_TEMP/kh"
      - name: Envoyer la build dans incoming/<cible>/<sha>/ (rsync sans suppression ni lien symbolique)
        run: |
          set -euo pipefail
          # -rt sans -l : aucun lien symbolique envoyé (CR-01) ; le serveur refuse de toute façon un envoi qui en contient.
          rsync -rt --chmod=D755,F644 --stats -e "ssh -i $RUNNER_TEMP/cle -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/kh -o ConnectTimeout=15" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$CIBLE/$SHA/"
      - name: Noter la version courante avant l'activation (cible exacte d'un retour automatique)
        run: |
          set -euo pipefail
          ETAT=$(ssh -i "$RUNNER_TEMP/cle" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "etat $CIBLE")
          echo "$ETAT"
          case "$ETAT" in
            "etat cible=$CIBLE courant="*) ;;
            *) echo "::error::réponse de etat illisible avant l'activation : rien n'est activé."; exit 1 ;;
          esac
          # Vide quand aucune version n'est en ligne (courant=aucun) : aucun retour automatique possible.
          COURANT_AVANT=$(printf '%s\n' "$ETAT" | sed -n 's/.* courant=\([0-9a-f]\{40\}\) .*/\1/p')
          echo "COURANT_AVANT=$COURANT_AVANT" >> "$GITHUB_ENV"
          echo "- Version en ligne avant l'activation : ${COURANT_AVANT:-aucune} ($CIBLE)" >> "$GITHUB_STEP_SUMMARY"
      - name: Activer la version (bascule atomique de current)
        id: activer
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/cle" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "activer $CIBLE $SHA"
      - name: Vérifier l'état (current pointe le commit du run)
        run: |
          set -euo pipefail
          ETAT=$(ssh -i "$RUNNER_TEMP/cle" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "etat $CIBLE")
          echo "$ETAT"
          case " $ETAT " in
            *" courant=$SHA "*) ;;
            *) echo "::error::current ne pointe pas le commit $SHA après l'activation."; exit 1 ;;
          esac
          echo "- Version active sur le serveur : $SHA ($CIBLE)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test de fumée HTTPS (version servie, en-têtes HSTS et CSP)
        env:
          DEPLOY_SMOKE_USER: ${{ secrets.DEPLOY_SMOKE_USER }}
          DEPLOY_SMOKE_PASS: ${{ secrets.DEPLOY_SMOKE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL vide : test de fumée HTTPS sauté (current vérifié par etat)."
            echo "- Test de fumée HTTPS : sauté (DEPLOY_URL vide)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$DEPLOY_URL" in
            https://*) ;;
            *) echo "::error::DEPLOY_URL doit commencer par https://."; exit 1 ;;
          esac
          BASE="${DEPLOY_URL%/}"
          # Identifiants lus par curl sur son entrée standard (printf est interne au shell) : jamais dans argv.
          config_curl() {
            if [ -n "$DEPLOY_SMOKE_USER" ]; then
              u="${DEPLOY_SMOKE_USER//\\/\\\\}"; u="${u//\"/\\\"}"
              p="${DEPLOY_SMOKE_PASS//\\/\\\\}"; p="${p//\"/\\\"}"
              printf 'user = "%s:%s"\n' "$u" "$p"
            fi
          }
          config_curl | curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 --config - -o "$RUNNER_TEMP/version.json" "$BASE/version.json"
          if ! jq -e --arg s "$SHA" '.commit == $s' "$RUNNER_TEMP/version.json" > /dev/null; then
            echo "::error::/version.json ne sert pas le commit $SHA."
            exit 1
          fi
          config_curl | curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 --config - -o /dev/null -D "$RUNNER_TEMP/entetes" "$BASE/"
          for entete in strict-transport-security content-security-policy; do
            if ! grep -qi "^$entete:" "$RUNNER_TEMP/entetes"; then
              echo "::error::En-tête $entete absent de la page d'accueil."
              exit 1
            fi
          done
          {
            echo "- Version servie : $SHA (/version.json)"
            echo "- En-têtes Strict-Transport-Security et Content-Security-Policy présents"
          } >> "$GITHUB_STEP_SUMMARY"
      # Retour vers la version exacte notée avant l'activation, jamais vers « la précédente » de l'historique (WR-01) :
      # si ce run n'a pas changé current (sha déjà en ligne, relance), rien n'est rebasculé. Un retrait d'urgence
      # n'est jamais annulé automatiquement : le contenu retiré ne doit pas revenir en ligne sur un test de fumée raté.
      # Aussi quand le run est annulé ou dépasse timeout-minutes après l'activation (IN-07) : la version activée n'a
      # alors pas été vérifiée.
      - name: Retour arrière automatique (une étape a échoué, ou le run a été annulé, après l'activation)
        if: (failure() || cancelled()) && steps.activer.outcome == 'success'
        env:
          URGENCE: ${{ inputs.retrait_urgence }}
        run: |
          set -euo pipefail
          if [ "${URGENCE:-}" = "true" ]; then
            echo "::error::Une étape a échoué après l'activation d'un retrait d'urgence : aucun retour automatique (le contenu retiré resterait sinon en ligne). Vérifier la version servie à la main ; rollback.yml avec une version explicite si besoin."
            echo "- Retour arrière automatique : non lancé (retrait d'urgence), vérification manuelle requise" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "${COURANT_AVANT:-}" ]; then
            echo "::error::Une étape a échoué après l'activation, mais aucune version n'était en ligne avant : aucun retour automatique possible."
            echo "- Retour arrière automatique : impossible (aucune version en ligne avant l'activation)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$COURANT_AVANT" = "$SHA" ]; then
            echo "::error::Une étape a échoué après l'activation, mais ce run n'a pas changé current ($SHA était déjà en ligne) : aucun retour."
            echo "- Retour arrière automatique : rien à faire, current n'a pas changé ($SHA)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # current a-t-il bougé depuis l'activation (retour arrière manuel lancé entre-temps par rollback.yml, qui a son
          # propre groupe de concurrence) ? Alors ce run ne le défait pas.
          ETAT=$(ssh -i "$RUNNER_TEMP/cle" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "etat $CIBLE")
          echo "$ETAT"
          case " $ETAT " in
            *" courant=$SHA "*) ;;
            *)
              echo "::error::Une étape a échoué après l'activation, mais current ne pointe plus $SHA (retour arrière manuel entre-temps ?) : aucun retour automatique."
              echo "- Retour arrière automatique : non lancé, current a changé depuis l'activation" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          echo "::error::Une étape a échoué après l'activation : retour à la version en ligne avant ce run ($COURANT_AVANT)."
          ssh -i "$RUNNER_TEMP/cle" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "retour $CIBLE $COURANT_AVANT"
          ETAT=$(ssh -i "$RUNNER_TEMP/cle" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "etat $CIBLE")
          echo "$ETAT"
          case " $ETAT " in
            *" courant=$COURANT_AVANT "*) ;;
            *) echo "::error::current ne pointe pas $COURANT_AVANT après le retour arrière automatique."; exit 1 ;;
          esac
          echo "- Retour arrière automatique : current rebasculé sur $COURANT_AVANT (version en ligne avant ce run)" >> "$GITHUB_STEP_SUMMARY"
      - name: Effacer la clé et l'empreinte du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/cle" "$RUNNER_TEMP/kh"
